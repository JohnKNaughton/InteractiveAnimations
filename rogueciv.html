<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RogueCiv — An Empire in an Afternoon</title>
<style>
  :root{
    --ink:#0e1116;
    --panel:#171d26;
    --panel2:#1e2632;
    --panel3:#2a3442;
    --edge:#3a4657;
    --gold:#d9b168;
    --gold2:#f0d49a;
    --text:#dfe6ef;
    --dim:#8f9cae;
    --good:#7fc98a;
    --bad:#e0736a;
    --warn:#e8b45c;
    --food:#8fd07a;
    --prod:#e0a05a;
    --coin:#f0d060;
    --sci:#7fc4e8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--ink); color:var(--text);
    font-family:"Segoe UI","Inter",system-ui,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased;
    user-select:none; cursor:default;
  }
  h1,h2,h3,.serif{font-family:"Georgia","Palatino Linotype",serif;}
  canvas{display:block;}
  #map{position:absolute; inset:0; z-index:0;}

  /* ---------- generic chrome ---------- */
  .panel{
    background:linear-gradient(180deg,#1b222dF2,#141a23F2);
    border:1px solid var(--edge);
    border-radius:10px;
    box-shadow:0 8px 30px #0009, inset 0 1px 0 #ffffff0d;
    backdrop-filter:blur(6px);
  }
  .btn{
    background:linear-gradient(180deg,var(--panel3),#222a36);
    border:1px solid var(--edge); color:var(--text);
    border-radius:7px; padding:6px 11px; font-size:12px; font-weight:600;
    cursor:pointer; transition:all .13s; white-space:nowrap;
    font-family:inherit;
  }
  .btn:hover:not(:disabled){background:linear-gradient(180deg,#3b4859,#2a3442); border-color:var(--gold); color:var(--gold2);}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn:disabled{opacity:.35; cursor:default;}
  .btn.gold{background:linear-gradient(180deg,#c9a25c,#a07d3e); border-color:#e2c286; color:#2a2010; text-shadow:0 1px 0 #ffffff40;}
  .btn.gold:hover:not(:disabled){background:linear-gradient(180deg,#e6bd72,#bd944c); color:#1d1608;}
  .btn.red{background:linear-gradient(180deg,#8e3a34,#6d2a25); border-color:#b8564c;}
  .btn.red:hover:not(:disabled){background:linear-gradient(180deg,#a8483f,#82332c); color:#ffd9d4; border-color:#d8776c;}
  .btn.sm{padding:3px 7px; font-size:11px; border-radius:5px;}
  .btn.wide{width:100%; text-align:center;}

  .lbl{font-size:10px; letter-spacing:.9px; text-transform:uppercase; color:var(--dim); font-weight:700;}
  .sep{height:1px; background:var(--edge); margin:8px 0; opacity:.7;}
  .scroll{overflow-y:auto; overflow-x:hidden;}
  .scroll::-webkit-scrollbar{width:8px;}
  .scroll::-webkit-scrollbar-track{background:#0d1117; border-radius:4px;}
  .scroll::-webkit-scrollbar-thumb{background:#3a4657; border-radius:4px;}
  .scroll::-webkit-scrollbar-thumb:hover{background:#4d5c70;}

  /* ---------- top bar ---------- */
  #top{
    position:absolute; top:0; left:0; right:0; height:46px; z-index:20;
    display:flex; align-items:center; gap:0; padding:0 10px;
    background:linear-gradient(180deg,#141a24f7,#10151ce0 70%, #10151c00);
    border-bottom:1px solid #ffffff0f;
  }
  #civbadge{display:flex; align-items:center; gap:8px; padding-right:12px;}
  #civdot{width:16px; height:16px; border-radius:4px; border:1px solid #ffffff44; box-shadow:0 0 8px currentColor;}
  #civname{font-size:14px; font-weight:700; letter-spacing:.3px;}
  #civleader{font-size:10px; color:var(--dim);}

  .stat{display:flex; align-items:center; gap:6px; padding:0 11px; height:30px; border-left:1px solid #ffffff12;}
  .stat .ico{font-size:15px; line-height:1;}
  .stat .val{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .rate{font-size:11px; font-weight:600; font-variant-numeric:tabular-nums;}
  .pos{color:var(--good);} .neg{color:var(--bad);} .neu{color:var(--dim);}

  #agewrap{display:flex; flex-direction:column; gap:3px; padding:0 12px; min-width:190px; border-left:1px solid #ffffff12;}
  #agerow{display:flex; align-items:baseline; gap:7px;}
  #agename{font-size:13px; font-weight:700; color:var(--gold2); font-family:Georgia,serif;}
  #agesub{font-size:10px; color:var(--dim);}
  #agebar{height:6px; background:#0b0f15; border-radius:3px; overflow:hidden; border:1px solid #ffffff10; position:relative;}
  #agefill{height:100%; background:linear-gradient(90deg,#4a90c4,#7fc4e8); transition:width .35s ease; border-radius:3px;}
  .pips{position:absolute; inset:0; display:flex;}
  .pips i{flex:1; border-right:1px solid #0b0f15;}
  .pips i:last-child{border:none;}

  #topright{margin-left:auto; display:flex; align-items:center; gap:6px;}
  #turnbox{text-align:right; padding-right:6px;}
  #turnnum{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;}
  #turnsub{font-size:10px; color:var(--dim);}
  #endturn{min-width:128px; height:34px; font-size:13px;}
  #endturn.ready{animation:pulse 1.9s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d9b16800;}50%{box-shadow:0 0 0 5px #d9b16826;}}

  /* ---------- left: selection panel ---------- */
  #sel{
    position:absolute; left:10px; bottom:10px; width:262px; z-index:15;
    padding:11px 12px; display:none;
  }
  #sel.on{display:block;}
  #seltitle{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  #selname{font-size:15px; font-weight:700; font-family:Georgia,serif;}
  #selsub{font-size:11px; color:var(--dim); margin-bottom:8px;}
  .hpbar{height:7px; background:#0b0f15; border-radius:4px; overflow:hidden; border:1px solid #ffffff10; margin:6px 0;}
  .hpfill{height:100%; transition:width .25s;}
  .kv{display:flex; justify-content:space-between; font-size:11.5px; padding:2px 0;}
  .kv b{font-variant-numeric:tabular-nums; font-weight:700;}
  #selacts{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px;}

  /* ---------- right: log + minimap ---------- */
  #rightcol{position:absolute; right:10px; top:54px; width:224px; z-index:15; display:flex; flex-direction:column; gap:8px;}
  #mini{padding:7px; }
  #minicv{display:block; width:100%; border-radius:5px; background:#080b10; cursor:pointer;}
  #logbox{padding:8px 9px; max-height:190px;}
  #log{max-height:160px; font-size:11.5px; line-height:1.5;}
  #log div{padding:2px 0; border-bottom:1px solid #ffffff08; color:#b9c4d2;}
  #log div:last-child{border:none;}
  #log .t{color:#5f6b7d; font-variant-numeric:tabular-nums; margin-right:5px; font-size:10px;}
  #log .war{color:#f0938a;} #log .good{color:#8fd8a0;} #log .big{color:var(--gold2); font-weight:600;}

  /* ---------- city strip (bottom center) ---------- */
  #citystrip{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:14;
    display:flex; gap:6px; padding:6px; max-width:52vw; overflow-x:auto;
  }
  #citystrip.hide{display:none;}
  .ctab{
    background:var(--panel2); border:1px solid var(--edge); border-radius:7px;
    padding:5px 9px; cursor:pointer; min-width:96px; transition:all .13s;
  }
  .ctab:hover{border-color:var(--gold); background:var(--panel3);}
  .ctab.sel{border-color:var(--gold2); background:#33291a;}
  .ctab .cn{font-size:11.5px; font-weight:700; display:flex; justify-content:space-between; gap:6px;}
  .ctab .cb{font-size:10px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ctab .cbar{height:3px; background:#0b0f15; border-radius:2px; margin-top:3px; overflow:hidden;}
  .ctab .cbar i{display:block; height:100%; background:var(--prod);}

  /* ---------- modal ---------- */
  #veil{
    position:absolute; inset:0; z-index:40; display:none;
    background:radial-gradient(ellipse at center,#0a0d12c4,#05070ae8);
    align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(3px);
  }
  #veil.on{display:flex;}
  #modal{max-width:min(940px,94vw); max-height:90vh; padding:20px 22px; display:flex; flex-direction:column;}
  #mtitle{font-size:22px; font-weight:700; font-family:Georgia,serif; color:var(--gold2); text-align:center;}
  #msub{font-size:12.5px; color:var(--dim); text-align:center; margin-top:3px; margin-bottom:14px; line-height:1.5;}
  #mbody{overflow-y:auto; overflow-x:hidden;}
  #mfoot{display:flex; gap:8px; justify-content:center; margin-top:14px;}

  /* draft cards */
  .cards{display:flex; gap:13px; justify-content:center; flex-wrap:wrap;}
  .card{
    width:225px; min-height:250px; background:linear-gradient(170deg,#232d3b,#161d27);
    border:1.5px solid var(--edge); border-radius:11px; padding:14px 14px 12px;
    cursor:pointer; transition:all .16s; display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2.5px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.5;
  }
  .card:hover{transform:translateY(-5px); border-color:var(--gold); box-shadow:0 12px 34px #000b,0 0 0 1px #d9b16855;}
  .card:hover::before{opacity:1;}
  .card .cico{font-size:31px; text-align:center; margin:6px 0 8px; filter:drop-shadow(0 2px 4px #0008);}
  .card .cname{font-size:15px; font-weight:700; text-align:center; font-family:Georgia,serif; color:var(--gold2); line-height:1.25;}
  .card .ctype{font-size:9.5px; letter-spacing:1.1px; text-transform:uppercase; text-align:center; color:var(--dim); margin-top:4px;}
  .card .cdesc{font-size:12px; line-height:1.55; color:#c3cddb; margin-top:10px; flex:1;}
  .card .cflav{font-size:11px; font-style:italic; color:#6f7c8e; margin-top:8px; line-height:1.4; font-family:Georgia,serif;}

  /* leader select */
  .leaders{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .lcard{
    width:216px; background:linear-gradient(170deg,#232d3b,#161d27); border:1.5px solid var(--edge);
    border-radius:11px; padding:0 0 12px; cursor:pointer; transition:all .16s; overflow:hidden;
  }
  .lcard:hover{transform:translateY(-5px); box-shadow:0 12px 34px #000b;}
  .lcard .lban{height:6px;}
  .lcard .lin{padding:11px 13px;}
  .lcard .lname{font-size:15px; font-weight:700; font-family:Georgia,serif;}
  .lcard .lciv{font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); margin-bottom:9px;}
  .lcard .ltrait{font-size:12px; line-height:1.5; color:#c3cddb;}
  .lcard .ltrait b{color:var(--gold2);}
  .lcard .luu{font-size:11.5px; line-height:1.45; color:#9fb0c4; margin-top:8px; padding-top:8px; border-top:1px solid #ffffff12;}
  .lcard .luu b{color:#d6e0ec;}

  /* build / diplo lists */
  .row{
    display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
    border:1px solid transparent; cursor:pointer; transition:all .12s;
  }
  .row:hover{background:#ffffff0d; border-color:var(--edge);}
  .row.sel{background:#33291a; border-color:var(--gold);}
  .row.no{opacity:.4; cursor:default;}
  .row.no:hover{background:transparent; border-color:transparent;}
  .row .ri{font-size:19px; width:24px; text-align:center; flex-shrink:0;}
  .row .rn{font-weight:600; font-size:12.5px;}
  .row .rd{font-size:11px; color:var(--dim); line-height:1.4; margin-top:1px;}
  .row .rr{margin-left:auto; text-align:right; flex-shrink:0; font-size:11.5px;}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  .tag{
    display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase;
    padding:2px 6px; border-radius:4px; margin-right:4px;
  }
  .t-war{background:#5c2620; color:#ffb8b0;}
  .t-peace{background:#26402c; color:#a8dfb4;}
  .t-ally{background:#243a52; color:#a6d4f5;}
  .t-neu{background:#2c3442; color:#a9b6c6;}
  .t-dead{background:#2a2a2a; color:#777;}

  /* tooltip */
  #tip{
    position:absolute; z-index:60; pointer-events:none; display:none;
    max-width:280px; padding:8px 10px; font-size:11.5px; line-height:1.5;
    background:#0d1219f2; border:1px solid var(--edge); border-radius:7px;
    box-shadow:0 6px 22px #000a;
  }
  #tip.on{display:block;}
  #tip b{color:var(--gold2);}
  #tip .th{font-weight:700; font-size:12.5px; margin-bottom:3px; color:var(--gold2);}
  #tip .ts{color:var(--dim); font-size:10.5px;}

  /* toast / banner */
  #banner{
    position:absolute; top:64px; left:50%; transform:translateX(-50%) translateY(-18px);
    z-index:30; padding:9px 22px; opacity:0; transition:all .4s cubic-bezier(.2,.9,.3,1);
    font-family:Georgia,serif; font-size:16px; color:var(--gold2); text-align:center;
    pointer-events:none; white-space:nowrap;
  }
  #banner.on{opacity:1; transform:translateX(-50%) translateY(0);}
  #banner small{display:block; font-size:11px; color:var(--dim); font-family:inherit; margin-top:2px;}

  /* hint bar */
  #hint{
    position:absolute; bottom:10px; right:10px; z-index:13; font-size:11px; color:#66727f;
    text-align:right; line-height:1.6; pointer-events:none;
  }
  #hint b{color:#8b98a8;}

  #busy{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:35;
    font-family:Georgia,serif; font-size:15px; color:var(--gold2); display:none;
    padding:12px 26px; text-align:center;
  }
  #busy.on{display:block;}

  .flag{width:11px; height:11px; border-radius:3px; border:1px solid #ffffff40; display:inline-block; vertical-align:-1px; flex-shrink:0;}
  .bar{height:5px; background:#0b0f15; border-radius:3px; overflow:hidden; border:1px solid #ffffff10;}
  .bar i{display:block; height:100%; transition:width .3s;}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="top">
  <div id="civbadge">
    <div id="civdot"></div>
    <div><div id="civname">—</div><div id="civleader">—</div></div>
  </div>
  <div class="stat" id="s-gold" title="Treasury"><span class="ico" style="color:var(--coin)">◆</span><span class="val" id="v-gold">0</span><span class="rate" id="r-gold">+0</span></div>
  <div class="stat" id="s-sci" title="Progress toward your next Breakthrough"><span class="ico" style="color:var(--sci)">✦</span><span class="val" id="v-sci">0</span><span class="rate" id="r-sci">+0</span></div>
  <div class="stat" id="s-mil" title="Military strength"><span class="ico" style="color:#c9a0a0">⚔</span><span class="val" id="v-mil">0</span></div>
  <div id="agewrap">
    <div id="agerow"><span id="agename">Dawn</span><span id="agesub">Breakthrough 1 of 3</span></div>
    <div id="agebar"><div id="agefill" style="width:0%"></div><div class="pips" id="agepips"></div></div>
  </div>
  <div id="topright">
    <button class="btn" id="b-cities">Cities</button>
    <button class="btn" id="b-diplo">Nations</button>
    <button class="btn" id="b-edicts">Edicts</button>
    <button class="btn" id="b-help">?</button>
    <button class="btn" id="b-sound" title="Sound on">🔊</button>
    <div id="turnbox"><div id="turnnum">1</div><div id="turnsub">of 100</div></div>
    <button class="btn gold" id="endturn">End Turn</button>
  </div>
</div>

<div id="rightcol">
  <div class="panel" id="mini"><canvas id="minicv"></canvas></div>
  <div class="panel" id="logbox"><div class="lbl" style="margin-bottom:5px">Chronicle</div><div id="log" class="scroll"></div></div>
</div>

<div class="panel" id="sel">
  <div id="seltitle"><div id="selname">—</div></div>
  <div id="selsub">—</div>
  <div id="selbody"></div>
  <div id="selacts"></div>
</div>

<div class="panel" id="citystrip"></div>

<div id="hint">
  <b>Click</b> a unit, then a tile to move &nbsp;·&nbsp; <b>Space</b> next unit &nbsp;·&nbsp; <b>Enter</b> end turn<br>
  <b>Drag</b> or <b>WASD</b> to pan &nbsp;·&nbsp; <b>Wheel</b> to zoom &nbsp;·&nbsp; <b>F</b> fortify &nbsp;·&nbsp; <b>?</b> help
</div>

<div id="banner" class="panel"></div>
<div id="busy" class="panel">The world turns…</div>
<div id="tip"></div>

<div id="veil"><div class="panel" id="modal">
  <div id="mtitle"></div>
  <div id="msub"></div>
  <div id="mbody" class="scroll"></div>
  <div id="mfoot"></div>
</div></div>

<script>
"use strict";
/* ============================================================================
   RogueCiv — a 4X roguelike on hexes.
   Part 1 of 7: constants, data tables, seeded RNG, hex mathematics.
   ==========================================================================*/

const MAX_TURNS = 100;
const NUM_RIVALS = 3;
const BASE_CITY_CAP = 4;
const BT_PER_AGE = 3;          // Breakthroughs needed to advance one Age
const HP_MAX = 100;

/* ---------- Ages ---------------------------------------------------------- */
const AGES = [
  {name:'Dawn',      sub:'stone and story',        tint:'#8a7f6a'},
  {name:'Bronze',    sub:'the first kingdoms',     tint:'#b08d4e'},
  {name:'Iron',      sub:'law, legion and road',   tint:'#8d9099'},
  {name:'Sail',      sub:'powder and horizon',     tint:'#6f9ec0'},
  {name:'Steam',     sub:'smoke and iron rails',   tint:'#9d7f6d'},
  {name:'Atomic',    sub:'the last age',           tint:'#93c2a8'}
];
const LAST_AGE = AGES.length - 1;

/* Progress needed for the nth Breakthrough (n is 0-based, 18 total). */
function btCost(n){ return Math.round(18 + 9.5*n + 1.55*n*n); }

/* ---------- Terrain ------------------------------------------------------- */
/* base terrain: yields are [food, production, gold] */
const TERRA = {
  ocean : {n:'Ocean',     y:[1,0,1], water:1, deep:1, col:'#1d4166', col2:'#143050'},
  coast : {n:'Coast',     y:[2,0,2], water:1,         col:'#3180ac', col2:'#23628a'},
  lake  : {n:'Lake',      y:[3,0,1], water:1, fresh:1,col:'#3d93ba', col2:'#2e779c'},
  grass : {n:'Grassland', y:[3,0,0],                  col:'#71a44c', col2:'#5d8c3e'},
  plains: {n:'Plains',    y:[2,1,0],                  col:'#bda453', col2:'#a68c3f'},
  desert: {n:'Desert',    y:[0,0,0],                  col:'#e0cb90', col2:'#cdb677'},
  tundra: {n:'Tundra',    y:[1,0,0],                  col:'#9aa78c', col2:'#85917a'},
  snow  : {n:'Snow',      y:[0,0,0],                  col:'#e2eaf1', col2:'#ccd7e1'}
};
/* elevation */
const ELEV = {
  flat: {n:'',        y:[0,0,0], move:1, def:0},
  hill: {n:'Hills',   y:[-1,2,0],move:2, def:.25},
  mtn : {n:'Mountain',y:[0,0,0], move:9, def:0, block:1, impass:1}
};
/* features */
const FEAT = {
  forest: {n:'Forest', y:[0,1,0],  move:2, def:.25, block:1},
  jungle: {n:'Jungle', y:[1,0,0],  move:2, def:.25, block:1},
  marsh : {n:'Marsh',  y:[1,-1,0], move:2, def:-.25},
  oasis : {n:'Oasis',  y:[3,0,1],  move:1, def:0},
  flood : {n:'Floodplain', y:[2,0,0], move:1, def:0},
  ice   : {n:'Ice',    y:[0,0,0],  move:9, impass:1}
};

/* ---------- Resources ----------------------------------------------------- */
/* kind: b=bonus (yields), l=luxury (gold+score), s=strategic (gates units)   */
const RES = {
  wheat : {n:'Wheat',   k:'b', y:[1,0,0], ico:'\u{1F33E}', on:['plains','grass'], feat:['flood',null]},
  cattle: {n:'Cattle',  k:'b', y:[1,1,0], ico:'\u{1F404}', on:['grass'],  flat:1},
  sheep : {n:'Sheep',   k:'b', y:[1,1,0], ico:'\u{1F411}', on:['grass','plains','desert'], hill:1},
  deer  : {n:'Deer',    k:'b', y:[1,1,0], ico:'\u{1F98C}', on:['tundra','grass','plains'], needFeat:'forest'},
  fish  : {n:'Fish',    k:'b', y:[2,0,1], ico:'\u{1F41F}', on:['coast']},
  stone : {n:'Stone',   k:'b', y:[0,2,0], ico:'\u{1FAA8}', on:['plains','tundra','grass','desert']},
  gems  : {n:'Gems',    k:'l', y:[0,0,4], ico:'\u{1F48E}', on:['jungle_any','desert','plains']},
  silk  : {n:'Silk',    k:'l', y:[0,0,3], ico:'\u{1F9F5}', on:['grass','plains'], needFeat:'forest'},
  spice : {n:'Spices',  k:'l', y:[1,0,3], ico:'\u{1F336}', on:['grass','plains'], needFeat:'jungle'},

/* ---------- seeded RNG (mulberry32) --------------------------------------- */
function mkRng(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = mkRng(1);
const rnd    = ()      => RNG();
const rint   = (n)     => Math.floor(RNG()*n);
const rrange = (a,b)   => a + Math.floor(RNG()*(b-a+1));
const pick   = (arr)   => arr[Math.floor(RNG()*arr.length)];
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(RNG()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
/* stable per-tile hash for visual jitter — never consumes the game RNG */
function hash2(x,y){
  let h = Math.imul(x*374761393 + y*668265263 ^ 0x5bf03635, 1274126177);
  h ^= h >>> 13; h = Math.imul(h, 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ---------- hex mathematics (pointy-top, axial q,r) ----------------------- */
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const SQ3 = Math.sqrt(3);

const hkey  = (q,r) => (q+128)*512 + (r+128);
const hexX  = (q,r,s) => s * SQ3 * (q + r/2);
const hexY  = (q,r,s) => s * 1.5 * r;

function hexDist(q1,r1,q2,r2){
  const dq=q1-q2, dr=r1-r2;
  return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq+dr)) / 2;
}
/* all tiles within radius n of (q,r), inclusive */
function hexRing(q,r,n){
  const out=[];
  for(let dq=-n; dq<=n; dq++){
    const lo=Math.max(-n,-dq-n), hi=Math.min(n,-dq+n);
    for(let dr=lo; dr<=hi; dr++) out.push([q+dq, r+dr]);
  }
  return out;
}
/* pixel -> axial (rounded through cube coordinates) */
function pixToHex(px,py,s){
  const q = (px*SQ3/3 - py/3) / s;
  const r = (py*2/3) / s;
  let x=q, z=r, y=-x-z;
  let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if(dx>dy && dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return [rx,rz];
}
/* ============================================================================
   Part 2: the world — state container, map generation, territory, visibility.
   ==========================================================================*/

const G = {
  seed:0, turn:1, rad:10, tiles:new Map(), list:[], players:[], me:null,
  over:false, log:[], uid:1, wondersBuilt:{}, anim:[], pendingDrafts:0, difficulty:1
};

const T   = (q,r) => G.tiles.get(hkey(q,r));
function nbrs(q,r){
  const out=[];
  for(let d=0;d<6;d++){ const t=T(q+DIRS[d][0], r+DIRS[d][1]); if(t) out.push(t); }
  return out;
}
function nbrAt(t,d){ return T(t.q+DIRS[d][0], t.r+DIRS[d][1]); }
function tilesInRange(q,r,n){
  const out=[];
  for(const [aq,ar] of hexRing(q,r,n)){ const t=T(aq,ar); if(t) out.push(t); }
  return out;
}

/* ---------- value noise --------------------------------------------------- */
function mkNoise(rng){
  const N = 256, tab = new Float32Array(N*N);
  for(let i=0;i<N*N;i++) tab[i] = rng();
  const at = (x,y) => tab[((y&255)*N) + (x&255)];
  const sm = t => t*t*(3-2*t);
  function n2(x,y){
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=sm(xf), v=sm(yf);
    const a=at(xi,yi), b=at(xi+1,yi), c=at(xi,yi+1), d=at(xi+1,yi+1);
    return (a+(b-a)*u) + ((c+(d-c)*u) - (a+(b-a)*u))*v;
  }
  return function(x,y,oct){
    let s=0, amp=1, f=1, tot=0;
    for(let i=0;i<(oct||4);i++){ s += n2(x*f, y*f)*amp; tot+=amp; amp*=.5; f*=2.05; }
    return s/tot;
  };
}

/* ---------- map generation ------------------------------------------------ */
function genMap(rad){
  G.rad = rad;
  G.tiles.clear(); G.list.length = 0;
  const nEl = mkNoise(RNG), nMo = mkNoise(RNG), nTe = mkNoise(RNG), nFe = mkNoise(RNG);

  /* 1 — shape: elevation field with an oceanic rim so the map is a continent */
  for(const [q,r] of hexRing(0,0,rad)){
    const px = hexX(q,r,1), py = hexY(q,r,1);
    const dist = Math.sqrt(px*px + py*py) / (rad*1.732);
    let h = nEl(px*0.30+7, py*0.30+13, 5);
    /* two broad lobes keep the landmass from being one dull blob */
    h += 0.16*Math.cos(px*0.28) * Math.sin(py*0.22);
    const rim = Math.max(0, (dist-0.62)/0.38);
    h -= rim*rim*1.25;
    h -= 0.06;

    const t = {
      q, r, k:hkey(q,r), x:hexX(q,r,1), y:hexY(q,r,1),
      h, t:'ocean', e:'flat', f:null, res:null, riv:[], cont:0,
      owner:-1, city:null, units:[], imp:0, wt:0, worked:null, ruin:false, camp:false
    };
    G.tiles.set(t.k, t); G.list.push(t);
  }

  /* 2 — land and elevation, cut at percentiles so every seed is playable.
         Thresholding on raw noise gave maps that were 76% land.            */
  const landFrac = 0.50 + rnd()*0.09;
  const hs = G.list.map(t=>t.h).sort((a,b)=>a-b);
  const seaLevel = hs[Math.floor(hs.length*(1-landFrac))];
  const landH = hs.filter(h=>h>seaLevel);
  const hillLevel = landH[Math.floor(landH.length*0.52)];
  const mtnLevel  = landH[Math.floor(landH.length*0.88)];
  for(const t of G.list){
    if(t.h > seaLevel){
      t.t = 'grass';
      if(t.h > mtnLevel)       t.e = 'mtn';
      else if(t.h > hillLevel) t.e = 'hill';
    }
  }
  /* thin out mountain clumps so they read as ranges, not plateaus */
  for(const t of G.list){
    if(t.e!=='mtn') continue;
    const m = nbrs(t.q,t.r).filter(n=>n.e==='mtn').length;
    if(m >= 4 && rnd() < .55) t.e = 'hill';
  }

  /* 3 — coast ring and ice caps */
  for(const t of G.list){
    if(t.t !== 'ocean') continue;
    const nearLand = nbrs(t.q,t.r).some(n=>n.t!=='ocean');
    if(nearLand) t.t = 'coast';
  }
  /* inland seas with no ocean connection become lakes */
  labelContinents();
  const oceanSize = {};
  for(const t of G.list) if(isWater(t)) oceanSize[t.cont] = (oceanSize[t.cont]||0)+1;
  for(const t of G.list) if(isWater(t) && oceanSize[t.cont] <= 6){ t.t='lake'; }

  /* 4 — climate: latitude + noise decide biome */
  for(const t of G.list){
    if(isWater(t)) continue;
    const lat = Math.abs(t.r) / rad;
    let temp = 1 - lat*1.28 + (nTe(t.x*0.34+41, t.y*0.34+3, 3)-0.5)*0.42;
    if(t.e==='hill') temp -= .06;
    if(t.e==='mtn')  temp -= .16;
    const moist = nMo(t.x*0.26+91, t.y*0.26+57, 4);

    if(temp < 0.14)      t.t = 'snow';
    else if(temp < 0.30) t.t = 'tundra';
    else if(moist < 0.36 && temp > 0.44) t.t = 'desert';
    else if(moist > 0.55) t.t = 'grass';
    else t.t = 'plains';
    t._temp = temp; t._moist = moist;
  }
  for(const t of G.list){
    if(t.t==='ocean' && Math.abs(t.r)/rad > 0.93 && rnd()<.7) t.f='ice';
  }

  /* 5 — rivers: walk downhill from highland sources to water */
  const sources = G.list.filter(t=>!isWater(t) && t.h>0.24 && t.t!=='desert');
  shuffle(sources);
  const nRivers = Math.max(4, Math.round(rad*1.15));
  let made = 0;
  for(const s of sources){
    if(made >= nRivers) break;
    if(s.riv.length) continue;
    const path=[s]; let cur=s, ok=false;
    for(let step=0; step<rad*2; step++){
      let best=null, bd=1e9;
      for(let d=0; d<6; d++){
        const n = nbrAt(cur,d);
        if(!n || path.includes(n)) continue;
        const score = n.h - (isWater(n) ? 5 : 0) + hash2(n.q,n.r)*0.05;
        if(score < bd){ bd=score; best=n; }
      }
      if(!best) break;
      if(isWater(best)){ ok = path.length>=2; break; }
      if(best.h > cur.h + 0.02) break;
      path.push(best); cur=best;
      if(best.riv.length){ ok = path.length>=2; break; }
    }
    if(!ok) continue;
    for(let i=0;i<path.length;i++){
      const a=path[i], b=path[i+1];
      if(!b) continue;
      const d = DIRS.findIndex(v=>v[0]===b.q-a.q && v[1]===b.r-a.r);
      if(d<0) continue;
      if(!a.riv.includes(d)) a.riv.push(d);
      if(!b.riv.includes((d+3)%6)) b.riv.push((d+3)%6);
    }
    made++;
  }
  /* floodplains: desert next to a river becomes fertile */
  for(const t of G.list){
    if(t.t==='desert' && t.e==='flat' && hasRiver(t)) t.f='flood';
  }

  /* 6 — features */
  for(const t of G.list){
    if(isWater(t) || t.e==='mtn' || t.f) continue;
    const fv = nFe(t.x*0.42+13, t.y*0.42+77, 3);
    const temp=t._temp, moist=t._moist;
    if(temp>0.72 && moist>0.62 && fv>0.42)                       t.f='jungle';
    else if(moist>0.46 && temp>0.20 && temp<0.86 && fv>0.46)     t.f='forest';
    else if(t.e==='flat' && moist>0.70 && fv<0.26 && nbrs(t.q,t.r).some(isWater)) t.f='marsh';
    else if(t.t==='desert' && rnd()<0.045)                       t.f='oasis';
  }

  /* 7 — resources */
  labelContinents();
  placeResources();

  /* 8 — landmark features: ancient ruins */
  const landTiles = G.list.filter(t=>passable(t) && !isWater(t));
  shuffle(landTiles);
  const nRuins = Math.round(landTiles.length * 0.055);
  for(let i=0;i<nRuins && i<landTiles.length;i++) landTiles[i].ruin = true;
}

const isWater  = t => TERRA[t.t].water === 1;
const hasRiver = t => t.riv.length > 0;
const isFresh  = t => hasRiver(t) || nbrs(t.q,t.r).some(n=>n.t==='lake');
function passable(t){
  if(!t) return false;
  if(ELEV[t.e].impass) return false;
  if(t.f && FEAT[t.f].impass) return false;
  return true;
}

function labelContinents(){
  for(const t of G.list) t.cont = 0;
  let id = 0;
  for(const t of G.list){
    if(t.cont) continue;
    id++;
    const water = isWater(t), stack=[t];
    t.cont = id;
    while(stack.length){
      const c = stack.pop();
      for(const n of nbrs(c.q,c.r)){
        if(n.cont || isWater(n)!==water) continue;
        n.cont = id; stack.push(n);
      }
    }
  }
}

function placeResources(){
  const cand = shuffle(G.list.filter(t=>!t.city && !ELEV[t.e].impass && t.f!=='ice'));
  const quota = {};
  const n = G.list.length;
  for(const k in RES){
    const r = RES[k];
    quota[k] = r.k==='s' ? Math.round(n*0.030) : r.k==='l' ? Math.round(n*0.013) : Math.round(n*0.028);
  }
  const placed = {};
  for(const k in RES) placed[k]=0;

  for(const t of cand){
    if(t.res) continue;
    /* never crowd: keep resources at least 2 apart from their own kind */
    const opts = [];
    for(const k in RES){
      const r = RES[k];
      if(placed[k] >= quota[k]) continue;
      if(!resFits(t,k,r)) continue;
      if(tilesInRange(t.q,t.r,2).some(o=>o.res===k)) continue;
      opts.push(k);
    }
    if(!opts.length) continue;
    if(rnd() > 0.55) continue;
    const k = pick(opts);
    t.res = k; placed[k]++;
  }
}
function resFits(t,k,r){
  if(r.needFeat && t.f !== r.needFeat) return false;
  if(r.flat && t.e !== 'flat') return false;
  if(r.hill && t.e !== 'hill') return false;
  if(!r.needFeat && (t.f==='forest'||t.f==='jungle') && r.k!=='l') return false;
  if(r.on.includes('jungle_any')) { if(t.f==='jungle') return true; }
  if(k==='fish') return t.t==='coast';
  if(isWater(t)) return k==='oil' && t.t==='coast';
  return r.on.includes(t.t);
}
/* a strategic resource stays hidden until its Age */
function resVisible(t, P){
  if(!t.res) return false;
  const r = RES[t.res];
  if(r.k !== 's') return true;
  if(!P) return true;
  if(P.m.uraniumAll && t.res==='uran') return true;
  return P.age >= (r.age||0);
}

/* ---------- tile yields --------------------------------------------------- */
/* Yield of a tile as worked by player P (owner). Returns [food, prod, gold]. */
function tileYield(t, P){
  const base = TERRA[t.t].y, el = ELEV[t.e].y, ft = t.f ? FEAT[t.f].y : [0,0,0];
  let f = base[0]+el[0]+ft[0], p = base[1]+el[1]+ft[1], g = base[2]+el[2]+ft[2];
  if(t.res && resVisible(t,P)){
    const r = RES[t.res];
    f += r.y[0]; p += r.y[1]; g += r.y[2];
    if(P && r.k==='b') f += M(P,'tFood_res');
  }
  if(hasRiver(t)) g += 1;
  f += t.imp;                       /* tiles improve as they are worked */
  if(P){
    if(hasRiver(t) || t.f==='flood') f += M(P,'tFood_river');
    if(t.e==='hill')                 f += M(P,'tFood_hill');
    if(t.f==='forest'||t.f==='jungle') f += M(P,'tFood_wood');
    if(isWater(t)){ g += M(P,'tGold_water'); p += M(P,'tProd_water'); }
  }
  return [Math.max(0,f), Math.max(0,p), Math.max(0,g)];
}
function tileName(t){
  const bits = [];
  if(t.f && FEAT[t.f].n) bits.push(FEAT[t.f].n);
  if(ELEV[t.e].n) bits.push(ELEV[t.e].n);
  bits.push(TERRA[t.t].n);
  let s = bits.join(' ');
  if(hasRiver(t)) s += ' (river)';
  return s;
}
function moveCost(t, u){
  if(u && UNITS[u.type].ignoreT) return 1;
  let c = Math.max(ELEV[t.e].move, t.f ? FEAT[t.f].move : 1);
  return c;
}
function defBonus(t){
  let d = ELEV[t.e].def + (t.f ? FEAT[t.f].def : 0);
  return d;
}

/* ---------- territory ----------------------------------------------------- */
function cityRadius(c){
  const P = G.players[c.owner];
  let rad = c.pop >= 8 ? 3 : 2;
  rad += M(P,'cityRadius') + (c.f.rad||0);
  return Math.min(4, rad);
}
function recomputeTerritory(){
  for(const t of G.list){ t.owner = -1; t._claim = 1e9; }
  for(const P of G.players){
    if(!P || P.barb) continue;
    for(const c of P.cities){
      const rad = cityRadius(c);
      for(const t of tilesInRange(c.q, c.r, rad)){
        const d = hexDist(t.q,t.r,c.q,c.r);
        /* nearer city wins; ties break to the older claim */
        if(d < t._claim){ t._claim = d; t.owner = P.id; }
      }
    }
  }
}

/* ---------- visibility ---------------------------------------------------- */
function hexLine(a,b){
  const N = hexDist(a.q,a.r,b.q,b.r);
  if(N===0) return [a];
  const out=[];
  const ax=a.q, az=a.r, ay=-ax-az, bx=b.q, bz=b.r, by=-bx-bz;
  for(let i=0;i<=N;i++){
    const s=i/N;
    let x=ax+(bx-ax)*s, y=ay+(by-ay)*s, z=az+(bz-az)*s;
    let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
    const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
    if(dx>dy && dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
    const t=T(rx,rz); if(t) out.push(t);
  }
  return out;
}
function blocksSight(t){ return ELEV[t.e].block || (t.f && FEAT[t.f].block); }

function seeFrom(P, t, range, elevated){
  P.vis.add(t.k); P.seen.add(t.k);
  const high = elevated || t.e==='hill' || t.e==='mtn';
  for(const o of tilesInRange(t.q,t.r,range)){
    const d = hexDist(t.q,t.r,o.q,o.r);
    if(d<=1){ P.vis.add(o.k); P.seen.add(o.k); continue; }
    let blocked = false;
    if(!high){
      const line = hexLine(t,o);
      for(let i=1;i<line.length-1;i++) if(blocksSight(line[i])){ blocked=true; break; }
    }
    if(!blocked){ P.vis.add(o.k); P.seen.add(o.k); }
  }
}
function recomputeVision(P){
  if(P.barb) return;
  P.vis = new Set();
  for(const c of P.cities) seeFrom(P, T(c.q,c.r), 3, true);
  for(const u of P.units){
    const def = UNITS[u.type].sight || 2;
    seeFrom(P, T(u.q,u.r), def + M(P,'sightAll'), false);
  }
  if(P.m.revealAll) for(const t of G.list) P.seen.add(t.k);
}
const canSee   = (P,t) => P.vis.has(t.k);
const hasSeen  = (P,t) => P.seen.has(t.k);

/* ---------- modifiers ----------------------------------------------------- */
function M(P, key){ return (P && P.m[key]) || 0; }
function addMods(P, m){
  if(!m) return;
  for(const k in m) P.m[k] = (P.m[k]||0) + m[k];
}
/* ============================================================================
   Part 3: rules — players, cities, economy, units, movement, combat, progress.
   ==========================================================================*/

/* ---------- players ------------------------------------------------------- */
function newPlayer(id, leaderId, human){
  const L = LEADERS.find(l=>l.id===leaderId);
  const P = {
    id, human:!!human, barb:false, alive:true, leader:L,
    name:L.civ, col:L.col, col2:L.col2,
    gold:30, sci:0, btDone:0, age:0, edicts:[], wonders:[],
    cities:[], units:[], capital:null, m:{},
    seen:new Set(), vis:new Set(), dip:{}, nameIdx:0,
    kills:0, capturedCaps:0, score:0, aiWarTarget:null, aiMood:0
  };
  addMods(P, L.m);
  return P;
}
function newBarbs(id){
  return {id, human:false, barb:true, alive:true, leader:{n:'Raiders',civ:'Raiders',adj:'Raider',agenda:'barb'},
    name:'Raiders', col:BARB_COL, col2:BARB_COL2, gold:0, sci:0, btDone:0, age:0,
    edicts:[], wonders:[], cities:[], units:[], capital:null, m:{},
    seen:new Set(), vis:new Set(), dip:{}, kills:0, score:0};
}
const livingRivals = () => G.players.filter(p=>!p.barb && p!==G.me && p.alive);
const BARB = () => G.players[G.players.length-1];

function dipOf(a,b){
  if(!a.dip[b.id]) a.dip[b.id] = {met:false, war:false, attitude:0, truce:0, allied:false, lastTribute:-99, denounced:false};
  return a.dip[b.id];
}
const atWar = (a,b) => (a.barb||b.barb) ? a!==b : dipOf(a,b).war;

/* ---------- cities -------------------------------------------------------- */
function cityName(P){
  const list = P.leader.cities || ['City'];
  const n = list[P.nameIdx % list.length];
  P.nameIdx++;
  return P.nameIdx > list.length ? n + ' ' + (1 + Math.floor((P.nameIdx-1)/list.length)) : n;
}

function foodNeeded(pop){ return Math.round(14 + 7*pop + Math.pow(pop,1.8)); }

function foundCity(P, t, isCap){
  const c = {
    id:G.uid++, owner:P.id, q:t.q, r:t.r, name:cityName(P),
    pop:1 + (isCap?1:M(P,'popStart')), food:0, prod:0, hp:0, maxhp:0,
    structs:[], queue:null, f:{}, worked:[], founded:G.turn,
    focus:'balanced', capital:!!isCap, turnsOwned:0, justTaken:0
  };
  if(isCap) P.capital = c;
  t.city = c; t.ruin = false; t.camp = false;
  if(P === G.me) sfx('found');
  P.cities.push(c);
  refreshCity(c);
  c.hp = c.maxhp;
  recomputeTerritory();
  return c;
}

/* aggregate structure effects into c.f */
function refreshCity(c){
  const P = G.players[c.owner];
  const f = {food:0, prod:0, gold:0, sci:0, hp:0, def:0, unitPct:0, prodPct:0, xp:0, water:0, rad:0, maxPop:0};
  for(const s of c.structs){
    const d = (STRUCTS[s] || WONDERS[s]);
    if(!d || !d.f) continue;
    for(const k in d.f) f[k] = (f[k]||0) + d.f[k];
  }
  c.f = f;
  c.maxhp = Math.round(100 + c.pop*4 + f.hp + M(P,'cityHP'));
  if(c.hp > c.maxhp) c.hp = c.maxhp;
}

function cityMaxPop(c){
  const P = G.players[c.owner];
  return (c.f.maxPop || M(P,'maxPop')) ? 99 : 8;
}

/* choose which tiles this city works — greedy by focus weighting */
function assignTiles(c){
  const P = G.players[c.owner];
  const rad = cityRadius(c);
  const centre = T(c.q,c.r);
  const cand = [];
  for(const t of tilesInRange(c.q,c.r,rad)){
    if(t === centre) continue;
    if(t.owner !== c.owner) continue;
    if(t.worked && t.worked !== c.id) continue;
    if(ELEV[t.e].impass || (t.f && FEAT[t.f].impass)) continue;
    if(isWater(t) && !c.f.water && !cityIsCoastal(c)) continue;
    const y = tileYield(t, P);
    cand.push({t, y});
  }
  const W = {balanced:[2.4,2.2,1.1], growth:[4.2,1.3,0.8], prod:[1.5,4.0,0.8], gold:[1.6,1.3,3.4]}[c.focus];
  for(const o of cand){
    o.s = o.y[0]*W[0] + o.y[1]*W[1] + o.y[2]*W[2];
    if(isWater(o.t)) o.s += c.f.water ? 1.2 : -1.0;
    if(o.t.res) o.s += 0.7;
  }
  cand.sort((a,b)=>b.s-a.s);
  for(const t of G.list) if(t.worked === c.id) t.worked = null;
  c.worked = [];
  const n = Math.min(c.pop, cand.length);
  for(let i=0;i<n;i++){ cand[i].t.worked = c.id; c.worked.push(cand[i].t); }
}
function cityIsCoastal(c){
  return nbrs(c.q,c.r).some(n=>n.t==='coast'||n.t==='ocean');
}

/* the full per-turn output of a city: [food, prod, gold, sci] */
function cityYield(c){
  const P = G.players[c.owner], centre = T(c.q,c.r);
  let f=0,p=0,g=0;
  const cy = tileYield(centre, P);
  f += Math.max(2,cy[0]); p += Math.max(1,cy[1]); g += cy[2];
  for(const t of c.worked){
    const y = tileYield(t, P);
    f+=y[0]; p+=y[1]; g+=y[2];
    if(isWater(t) && c.f.water){ f+=c.f.water; g+=c.f.water; }
  }
  f += c.f.food + M(P,'pFood');
  p += c.f.prod + M(P,'pProd');
  g += c.f.gold + M(P,'pGold');
  f -= c.pop * 2;                                   /* citizens eat */
  p *= 1 + c.f.prodPct + M(P,'pctProd');
  g *= 1 + M(P,'pctGold');

  let s = 1.5 + c.pop*0.7 + c.f.sci + M(P,'pSci') + M(P,'sciPerPop')*c.pop;
  if(c.capital) s += M(P,'capSci');
  s *= 1 + M(P,'pctSci') + (c.capital ? M(P,'capSciPct') : 0);

  return [Math.round(f), Math.max(1,Math.round(p)), Math.round(g), Math.round(s)];
}

/* A city's defence falls with its walls. Without this a city at 0 HP still
   shielded its garrison at full strength, so no assault could ever finish. */
function cityDefStr(c){
  const P = G.players[c.owner];
  let s = 12 + P.age*9 + c.f.def + M(P,'cityStr');
  const g = milAt(T(c.q,c.r));
  if(g) s += unitStr(g,{}) * 0.45;
  const frac = c.maxhp ? Math.max(0, c.hp/c.maxhp) : 0;
  return s * (0.45 + 0.55*frac);
}
/* what an attacker actually faces on a tile: garrison, walls, or open ground */
function defenceStrAt(t, attacker){
  const city = (t.city && t.city.owner !== attacker.owner) ? t.city : null;
  const garr = milAt(t);
  if(garr && garr.owner !== attacker.owner){
    let d = unitStr(garr, {def:1, tile:t, foe:attacker});
    if(city) d = Math.max(d, cityDefStr(city)*0.85);
    return d;
  }
  if(city) return cityDefStr(city);
  const civ = civAt(t);
  if(civ && civ.owner !== attacker.owner) return 1;
  return 1;
}

/* Wonder ownership is stored as ownerId+1: player 0 is falsy, and testing
   G.wondersBuilt[id] directly let the first player build every wonder twice. */
const wonderTaken = id => !!G.wondersBuilt[id];
const wonderOwner = id => (G.wondersBuilt[id]||0) - 1;
const setWonderOwner = (id, pid) => { G.wondersBuilt[id] = pid + 1; };

/* ---------- production ---------------------------------------------------- */
function unitCost(P, id){
  const u = UNITS[id];
  let c = u.cost;
  if(u.cls==='settler') c = 44 + 22*Math.max(0,P.cities.length-1);
  c *= 1 + M(P, u.cls==='settler' ? 'settlerPct' : 'unitPct');
  return Math.max(10, Math.round(c));
}
function structCost(P, id){
  const d = STRUCTS[id];
  return Math.max(10, Math.round(d.cost * (1 + M(P,'structPct'))));
}
function wonderCost(P, id){
  const d = WONDERS[id];
  let mult = 1 + M(P,'wonderPct');
  if(id==='beacon') mult += M(P,'beaconPct');
  return Math.max(20, Math.round(d.cost * mult));
}
function itemCost(P, it){
  if(!it) return 0;
  return it.kind==='unit' ? unitCost(P,it.id) : it.kind==='struct' ? structCost(P,it.id) : wonderCost(P,it.id);
}
function itemName(it){
  if(!it) return '—';
  return it.kind==='unit' ? UNITS[it.id].n : it.kind==='struct' ? STRUCTS[it.id].n : WONDERS[it.id].n;
}
/* the unit a player actually gets when asking for a base unit (unique swaps) */
function realUnit(P, id){
  const uu = P.leader && P.leader.uu;
  if(uu && UNITS[uu].uq === id) return uu;
  return id;
}
function hasRes(P, res){
  if(!res) return true;
  if(M(P,'free_'+res)) return true;
  for(const t of G.list){
    if(t.res===res && t.owner===P.id && resVisible(t,P)) return true;
  }
  return false;
}
function unitAvailable(P, id){
  const u = UNITS[id];
  if(u.uq) return false;                          /* uniques offered via swap */
  if(u.age > P.age) return false;
  const real = realUnit(P,id), ru = UNITS[real];
  if(ru.req && !hasRes(P, ru.req)) return false;
  /* obsolete: a strictly later unit of the same line is available */
  const line = LINES[u.cls];
  if(line){
    const i = line.indexOf(id);
    for(let j=i+1;j<line.length;j++){
      const nx = line[j];
      if(!nx || nx===id) continue;
      const nr = realUnit(P,nx);
      if(UNITS[nx].age<=P.age && (!UNITS[nr].req || hasRes(P,UNITS[nr].req))) return false;
    }
  }
  return true;
}
function buildOptions(c){
  const P = G.players[c.owner], out = [];
  for(const id in UNITS){
    if(!unitAvailable(P,id)) continue;
    if(id==='settler' && P.cities.length >= cityCap(P)) continue;
    if(id==='settler' && c.pop<2 && !M(P,'settlerNoPop')) continue;
    out.push({kind:'unit', id:realUnit(P,id), base:id});
  }
  for(const id in STRUCTS){
    const d = STRUCTS[id];
    if(d.age > P.age || c.structs.includes(id)) continue;
    if(d.coastal && !cityIsCoastal(c)) continue;
    out.push({kind:'struct', id});
  }
  for(const id in WONDERS){
    const d = WONDERS[id];
    if(d.age > P.age || wonderTaken(id) || c.structs.includes(id)) continue;
    if(P.cities.some(o=>o!==c && o.queue && o.queue.kind==='wonder' && o.queue.id===id)) continue;
    if(d.coastal && !cityIsCoastal(c)) continue;
    if(d.req && !hasRes(P, d.req)) continue;
    out.push({kind:'wonder', id});
  }
  return out;
}
function cityCap(P){ return BASE_CITY_CAP + M(P,'cityCap'); }
function buyCost(c){
  const P = G.players[c.owner];
  if(!c.queue) return 0;
  const rem = Math.max(0, itemCost(P,c.queue) - c.prod);
  return Math.max(8, Math.round(rem * 3.4 * (1 + M(P,'buyPct'))));
}

function completeItem(c, it){
  const P = G.players[c.owner], t = T(c.q,c.r);
  if(it.kind==='unit'){
    const spot = freeSpotFor(P, t, UNITS[it.id].cls==='settler');
    if(!spot){ return false; }
    const u = spawnUnit(P, it.id, spot.q, spot.r);
    u.xp = c.f.xp + M(P,'xpStart');
    applyRank(u);
    if(UNITS[it.id].cls==='settler' && !M(P,'settlerNoPop')){
      c.pop = Math.max(1, c.pop-1); c.food = 0; refreshCity(c);
    }
    if(P===G.me) logMsg(c.name+' trains a '+UNITS[it.id].n+'.');
  } else if(it.kind==='struct'){
    c.structs.push(it.id); refreshCity(c);
    if(P===G.me){ sfx('build'); logMsg(c.name+' completes the '+STRUCTS[it.id].n+'.', 'good'); }
  } else {
    const w = WONDERS[it.id];
    /* somebody else finished it first — the effort is not lost, the wonder is */
    if(wonderTaken(it.id)){
      if(P===G.me) logMsg('Another nation completes '+w.n+' before you.','war');
      c.queue = null;
      return false;
    }
    c.structs.push(it.id); setWonderOwner(it.id, P.id);
    if(!P.wonders.includes(it.id)) P.wonders.push(it.id);
    if(w.emp) addMods(P, w.emp);
    refreshCity(c);
    logMsg(P.name+' completes '+w.n+'.', 'big');
    if(w.once) wonderHook(P, c, w.once);
    if(w.victory){ endRun(true, 'beacon'); return true; }
  }
  return true;
}
function wonderHook(P, c, id){
  if(id==='freeBT'){ P.sci += btCost(P.btDone); }
  else if(id==='rankAll'){ for(const u of P.units){ u.xp = Math.max(u.xp, 45); applyRank(u); } }
  else if(id==='peace'){
    for(const o of G.players){ if(o===P||o.barb) continue; const d=dipOf(o,P); d.war=false; d.attitude+=35; dipOf(P,o).war=false; }
  }
}

/* ---------- units --------------------------------------------------------- */
function milAt(t){ return t.units.find(u=>UNITS[u.type].cls!=='settler') || null; }
function civAt(t){ return t.units.find(u=>UNITS[u.type].cls==='settler') || null; }

function spawnUnit(P, type, q, r){
  const u = {
    id:G.uid++, owner:P.id, type, q, r, hp:HP_MAX,
    mv:0, xp:0, rank:0, fort:0, sleep:false, done:false,
    embarked:false, goto:null, str:0
  };
  const t = T(q,r);
  t.units.push(u); P.units.push(u);
  u.mv = unitMoves(u);
  return u;
}
function killUnit(u, silent){
  const t = T(u.q,u.r);
  if(t) t.units = t.units.filter(x=>x!==u);
  const P = G.players[u.owner];
  P.units = P.units.filter(x=>x!==u);
  u.dead = true;
  if(!silent && P===G.me) logMsg('Your '+UNITS[u.type].n+' is destroyed.', 'war');
}
function unitMoves(u){
  const P = G.players[u.owner], d = UNITS[u.type];
  let mv = d.mv + M(P,'mvAll');
  if(d.cls==='mounted') mv += M(P,'mvMounted');
  if(d.cls==='settler') mv += M(P,'mvSettler');
  return Math.max(1, mv);
}
const RANKS = ['', 'Veteran', 'Elite', 'Legendary'];
function applyRank(u){
  const xp=u.xp;
  const nr = xp>=90 ? 3 : xp>=45 ? 2 : xp>=15 ? 1 : 0;
  if(nr > u.rank){
    u.rank = nr;
    u.hp = Math.min(HP_MAX, u.hp + 25);
    return true;
  }
  return false;
}
/* ctx: {atk:bool, def:bool, ranged:bool, vsCity:bool, tile:tileOfUnit, foe:unit} */
function unitStr(u, ctx){
  const P = G.players[u.owner], d = UNITS[u.type];
  ctx = ctx || {};
  let s = ctx.ranged ? (d.rs||0) : d.str;
  if(u.embarked && !ctx.ranged) s = Math.max(8, s*0.45);
  s += u.rank * 6;
  s += M(P,'sAll');
  if(d.cls==='melee')   s += M(P,'sMelee');
  if(d.cls==='ranged')  s += M(P,'sRanged');
  if(d.cls==='mounted') s += M(P,'sMounted');
  if(d.cls==='siege')   s += M(P,'sSiege') + (ctx.ranged?0:0);
  if(d.gp)              s += M(P,'sGP');
  if(d.cls==='ranged' && ctx.ranged) s += 0;
  let mult = 1;
  if(ctx.atk) mult += M(P,'pctAtk') + M(P,'pctWar');
  if(ctx.def) mult += M(P,'pctWar');
  if(ctx.vsCity) mult += (d.vsCity||0) + M(P,'pctVsCity');
  if(ctx.def && ctx.tile && ctx.tile.owner===P.id) mult += M(P,'pctHome');
  if(ctx.def && ctx.tile){
    mult += defBonus(ctx.tile);
    if(u.fort) mult += 0.30;
    if(ctx.tile.city) mult += 0.20;
  }
  if(ctx.def && ctx.foe && d.vsMounted && UNITS[ctx.foe.type].cls==='mounted') mult += 1.0;
  return Math.max(1, s * mult);
}
function unitRange(u){
  const P = G.players[u.owner], d = UNITS[u.type];
  if(!d.rng) return 0;
  return d.rng + (d.cls==='siege' ? M(P,'rngSiege') : M(P,'rngRanged'));
}
function canEmbark(P){
  return M(P,'embark')>0 || (M(P,'earlyEmbark')>0 && P.age>=1) || P.age>=4;
}
function canEnter(u, t){
  if(!t) return false;
  if(ELEV[t.e].impass) return false;
  if(t.f && FEAT[t.f].impass) return false;
  const P = G.players[u.owner];
  if(isWater(t)){
    if(!canEmbark(P)) return false;
    if(t.city) return false;
  }
  return true;
}
function blockedBy(u, t){
  /* returns 'own' if a friendly unit of the same layer sits there, 'foe' if hostile */
  const P = G.players[u.owner], civil = UNITS[u.type].cls==='settler';
  for(const o of t.units){
    const oCiv = UNITS[o.type].cls==='settler';
    if(o.owner === u.owner){ if(oCiv===civil) return 'own'; }
    else return 'foe';
  }
  if(t.city && t.city.owner !== u.owner) return 'foe';
  return null;
}
function freeSpotFor(P, t, civil){
  const want = !!civil;
  const fits = (x)=>{
    if(!x || ELEV[x.e].impass || (x.f&&FEAT[x.f].impass)) return false;
    if(isWater(x)) return false;
    if(x.city && x.city.owner!==P.id) return false;
    for(const o of x.units){
      if(o.owner!==P.id) return false;
      if((UNITS[o.type].cls==='settler')===want) return false;
    }
    return true;
  };
  if(fits(t)) return t;
  for(const n of nbrs(t.q,t.r)) if(fits(n)) return n;
  for(const n of tilesInRange(t.q,t.r,2)) if(fits(n)) return n;
  return null;
}

/* ---------- movement ------------------------------------------------------ */
function zocTiles(P){
  const z = new Set();
  for(const o of G.players){
    if(o===P || !atWar(P,o)) continue;
    for(const u of o.units){
      if(UNITS[u.type].cls==='settler') continue;
      for(const n of nbrs(u.q,u.r)) z.add(n.k);
    }
  }
  return z;
}
/* Dijkstra from a unit. limit=null → unlimited (multi-turn path).
   goalKey, if given, is reached even when something hostile stands on it —
   it is recorded but never expanded through, so a path to an enemy city or
   unit exists (you walk up to it, then attack). Without this, pathTo returned
   null for every enemy target and no army could ever march on a city. */
function moveField(u, limit, goalKey){
  const P = G.players[u.owner];
  const start = T(u.q,u.r);
  const dist = new Map([[start.k,0]]), from = new Map();
  const zoc = M(P,'ignoreZOC') ? new Set() : zocTiles(P);
  const border = M(P,'mvBorder');
  const q = [start];
  while(q.length){
    q.sort((a,b)=>dist.get(a.k)-dist.get(b.k));
    const cur = q.shift();
    const cd = dist.get(cur.k);
    if(limit!=null && cd >= limit) continue;
    if(goalKey !== undefined && cur.k === goalKey) continue;
    for(const n of nbrs(cur.q,cur.r)){
      const isGoal = (n.k === goalKey);
      if(!isGoal){
        if(!canEnter(u,n)) continue;
        if(blockedBy(u,n)) continue;
      }
      let c = moveCost(n,u);
      if(isWater(n) || isWater(cur)) c = 1;
      if(border && n.owner===P.id && cur.owner===P.id) c = Math.max(1, c - border);
      let nd = cd + c;
      if(zoc.has(cur.k) && zoc.has(n.k)) nd = (limit!=null) ? limit : cd + c + 3;
      if(limit!=null) nd = Math.min(nd, limit);
      if(!dist.has(n.k) || nd < dist.get(n.k)){
        dist.set(n.k, nd); from.set(n.k, cur.k);
        q.push(n);
      }
    }
  }
  return {dist, from};
}
function reachable(u){
  if(u.mv<=0) return new Map();
  const {dist} = moveField(u, u.mv);
  dist.delete(T(u.q,u.r).k);
  return dist;
}
function pathTo(u, target){
  const {dist, from} = moveField(u, null, target.k);
  if(!dist.has(target.k)) return null;
  const path=[]; let k=target.k;
  const startK = T(u.q,u.r).k;
  while(k !== startK){ path.unshift(k); k = from.get(k); if(k===undefined) return null; }
  return path;
}
/* step a unit one tile; returns false if it could not */
function stepUnit(u, t){
  if(!canEnter(u,t) || blockedBy(u,t)) return false;
  const P = G.players[u.owner];
  const cur = T(u.q,u.r);
  let c = moveCost(t,u);
  if(isWater(t) || isWater(cur)) c = 1;
  const border = M(P,'mvBorder');
  if(border && t.owner===P.id && cur.owner===P.id) c = Math.max(1, c-border);
  c = Math.min(c, Math.max(1,u.mv));
  if(u.mv <= 0) return false;
  cur.units = cur.units.filter(x=>x!==u);
  u.q=t.q; u.r=t.r; t.units.push(u);
  u.mv -= c;
  u.fort = 0;
  u.embarked = isWater(t);
  if(!M(P,'ignoreZOC')){
    const zoc = zocTiles(P);
    if(zoc.has(cur.k) && zoc.has(t.k)) u.mv = 0;
  }
  if(P === G.me) sfx('move');
  if(t.ruin && !P.barb) popRuin(P, t, u);
  if(t.camp && !P.barb){ t.camp=false; P.gold += 40; if(P===G.me) logMsg('You clear a raider camp. +40 gold.','good'); }
  if(P===G.me || canSee(G.me,t)) markDirty();
  return true;
}
function popRuin(P, t, u){
  t.ruin = false;
  const roll = rint(100);
  if(roll<26){ const g=rrange(30,70); P.gold+=g; if(P===G.me) logMsg('Ruins yield '+g+' gold.','good'); }
  else if(roll<50){ const s=Math.round(btCost(P.btDone)*0.34); P.sci+=s; if(P===G.me) logMsg('Ruins yield ancient knowledge. +'+s+' progress.','good'); }
  else if(roll<66){ u.xp += 30; applyRank(u); if(P===G.me) logMsg('Your '+UNITS[u.type].n+' learns from the ruins.','good'); }
  else if(roll<80){ seeFrom(P,t,6,true); if(P===G.me) logMsg('A map fragment reveals the land around.','good'); }
  else if(roll<92){
    const sp = freeSpotFor(P,t,false);
    if(sp){ const id = realUnit(P, P.age>=2?'warrior':'warrior'); const nu=spawnUnit(P, unitAvailable(P,'warrior')?realUnit(P,'warrior'):realUnit(P,'scout'), sp.q,sp.r);
            if(P===G.me) logMsg('Wanderers join you: a '+UNITS[nu.type].n+'.','good'); }
    else { P.gold+=40; }
  }
  else {
    const sp = freeSpotFor(P,t,true);
    if(sp && P.cities.length < cityCap(P)){ spawnUnit(P,'settler',sp.q,sp.r); if(P===G.me) logMsg('A lost people ask to follow you. A Settler joins!','good'); }
    else { P.sci += Math.round(btCost(P.btDone)*0.3); }
  }
}

/* ---------- combat -------------------------------------------------------- */
function combatOdds(atk, defT){
  return Math.round(100 / (1 + Math.exp(-0.05*(atk-defT))));
}
function dmgRoll(a, d){
  const raw = 30 * Math.exp(0.036*(a-d)) * (0.88 + rnd()*0.24);
  return Math.max(2, Math.min(95, Math.round(raw)));
}
function meleeAttack(u, t){
  const P = G.players[u.owner];
  const foe = milAt(t) || civAt(t);
  const city = t.city;
  if(city && city.owner !== u.owner) return attackCity(u, city, t);
  if(!foe) return false;
  const D = G.players[foe.owner];
  if(!atWar(P,D)) return false;

  /* an undefended civilian is simply captured */
  if(UNITS[foe.type].cls==='settler' && !milAt(t)){
    killUnit(foe, true);
    if(D===G.me) logMsg('Your '+UNITS[foe.type].n+' is captured by '+P.name+'!','war');
    if(P===G.me) logMsg('You capture a '+UNITS[foe.type].n+'.','good');
    u.mv = Math.max(0, u.mv-1);
    stepUnit(u,t);
    return true;
  }
  const a = unitStr(u,   {atk:1, foe:foe, tile:T(u.q,u.r)});
  const d = unitStr(foe, {def:1, tile:t, foe:u});
  const dd = dmgRoll(a,d), da = dmgRoll(d,a);
  foe.hp -= dd; u.hp -= da;
  fxCombat(t, dd, T(u.q,u.r), da);
  u.mv = 0; u.fort = 0;
  u.xp += 6; foe.xp += 5;

  if(foe.hp<=0 && u.hp<=0){ if(rnd()<.5) u.hp=1; else foe.hp=1; }
  if(foe.hp<=0){
    onKill(P, D, foe, u);
    killUnit(foe);
    if(!milAt(t) && !t.city){
      const c2 = civAt(t);
      if(c2 && c2.owner!==u.owner) killUnit(c2, true);
      if(M(P,'moveAfterAttack') && UNITS[u.type].cls==='mounted') u.mv = 1;
      stepUnit(u,t);
    }
  } else if(u.hp<=0){
    killUnit(u); foe.xp += 4; applyRank(foe);
    D.kills++;
  }
  applyRank(u); applyRank(foe);
  return true;
}
function rangedAttack(u, t){
  const P = G.players[u.owner];
  const foe = milAt(t) || civAt(t);
  const city = t.city && t.city.owner!==u.owner ? t.city : null;
  if(!foe && !city) return false;
  const D = G.players[city ? city.owner : foe.owner];
  if(!atWar(P,D)) return false;
  const a = unitStr(u, {atk:1, ranged:1, vsCity:!!city && !foe, foe:foe, tile:T(u.q,u.r)});
  if(foe){
    const d = unitStr(foe, {def:1, tile:t, foe:u});
    const dd = dmgRoll(a,d);
    foe.hp -= dd;
    fxCombat(t, dd, null, 0);
    u.xp += 5; foe.xp += 3;
    if(foe.hp<=0){ onKill(P,D,foe,u); killUnit(foe); }
    else applyRank(foe);
  } else {
    const d = cityDefStr(city);
    const dd = Math.round(dmgRoll(a,d) * 1.15);
    city.hp = Math.max(0, city.hp - dd);
    fxCombat(t, dd, null, 0);
    u.xp += 4;
  }
  u.mv = 0; u.fort = 0; applyRank(u);
  return true;
}
function attackCity(u, city, t){
  const P = G.players[u.owner], D = G.players[city.owner];
  if(!atWar(P,D)) return false;
  const garrison = milAt(t);
  if(garrison) return meleeAttackGarrison(u, garrison, t, city);
  if(city.hp > 0){
    const a = unitStr(u, {atk:1, vsCity:1, tile:T(u.q,u.r)});
    const d = cityDefStr(city);
    const dd = dmgRoll(a,d), da = Math.round(dmgRoll(d,a)*0.75);
    city.hp = Math.max(0, city.hp - dd); u.hp -= da;
    fxCombat(t, dd, T(u.q,u.r), da);
    u.mv = 0; u.xp += 6; applyRank(u);
    if(u.hp<=0){ killUnit(u); return true; }
    if(city.hp<=0 && UNITS[u.type].cls!=='ranged' && UNITS[u.type].cls!=='siege'){ captureCity(P, city, u); }
    return true;
  }
  if(UNITS[u.type].cls==='ranged' || UNITS[u.type].cls==='siege'){ return false; }
  captureCity(P, city, u);
  return true;
}
function meleeAttackGarrison(u, foe, t, city){
  const P = G.players[u.owner], D = G.players[foe.owner];
  const a = unitStr(u,   {atk:1, foe:foe, vsCity:1, tile:T(u.q,u.r)});
  const d = defenceStrAt(t, u);
  const dd = dmgRoll(a,d), da = dmgRoll(d,a);
  foe.hp -= dd; u.hp -= da;
  city.hp = Math.max(0, city.hp - Math.round(dd*0.5));
  fxCombat(t, dd, T(u.q,u.r), da);
  u.mv = 0; u.xp += 6; foe.xp += 5;
  if(foe.hp<=0){ onKill(P,D,foe,u); killUnit(foe); }
  if(u.hp<=0){ killUnit(u); D.kills++; }
  applyRank(u); applyRank(foe);
  return true;
}
function onKill(P, D, foe, killer){
  if(P === G.me || D === G.me) sfx('kill');
  P.kills++;
  P.gold += M(P,'killGold');
  P.sci  += M(P,'killSci');
  if(killer){
    killer.xp += 14;
    const heal = M(P,'healWin');
    if(heal) killer.hp = Math.min(HP_MAX, killer.hp + heal);
    applyRank(killer);
  }
  if(D===G.me) logMsg('Your '+UNITS[foe.type].n+' falls to '+P.name+'.','war');
  else if(P===G.me) logMsg('You destroy a '+D.name+' '+UNITS[foe.type].n+'.','good');
}
function captureCity(P, city, u){
  const D = G.players[city.owner];
  const t = T(city.q, city.r);
  const wasCap = city.capital;
  D.cities = D.cities.filter(c=>c!==city);
  /* razed to a husk, but it survives */
  city.owner = P.id; city.pop = Math.max(1, Math.floor(city.pop*0.6));
  city.capital = false; city.justTaken = 3; city.queue = null; city.prod = 0; city.food = 0;
  if(!M(P,'keepStructs')) city.structs = city.structs.filter(s=>WONDERS[s]);
  /* wonders change hands exactly once per capture — recapturing must not
     stack their empire modifiers, nor list the same wonder twice */
  for(const s of city.structs){
    if(!WONDERS[s] || wonderOwner(s) === P.id) continue;
    const prev = G.players[wonderOwner(s)] || D;
    setWonderOwner(s, P.id);
    const w = WONDERS[s];
    if(w.emp){ addMods(P, w.emp); if(prev && prev!==P) addMods(prev, negMods(w.emp)); }
    if(prev) prev.wonders = prev.wonders.filter(x=>x!==s);
    D.wonders = D.wonders.filter(x=>x!==s);
    if(!P.wonders.includes(s)) P.wonders.push(s);
  }
  P.cities.push(city);
  G.captures = (G.captures||0)+1;
  refreshCity(city); city.hp = Math.round(city.maxhp*0.4);
  if(u){ u.mv=0; stepUnit(u,t); }
  recomputeTerritory();
  if(P === G.me) sfx('capture'); else if(D === G.me) sfx('lost');
  logMsg(P.name+' captures '+city.name+'!', 'war');
  if(wasCap){
    P.capturedCaps++;
    if(D.cities.length){ D.cities[0].capital = true; D.capital = D.cities[0]; }
  }
  if(!D.cities.length){ eliminate(D, P); }
  if(D===G.me && (wasCap || !D.cities.length)) { /* handled by checkEnd */ }
  checkEnd();
}
function negMods(m){ const o={}; for(const k in m) o[k] = -m[k]; return o; }
function eliminate(D, by){
  D.alive = false;
  for(const u of D.units.slice()) killUnit(u, true);
  if(D.barb) return;
  logMsg(D.name+' is no more.','big');
}

/* ---------- progress, ages, drafting -------------------------------------- */
function grantProgress(P, amount){
  P.sci += amount;
  let guard = 0;
  while(P.sci >= btCost(P.btDone) && P.btDone < BT_PER_AGE*AGES.length && guard++ < 8){
    P.sci -= btCost(P.btDone);
    P.btDone++;
    const newAge = Math.min(LAST_AGE, Math.floor(P.btDone / BT_PER_AGE));
    const aged = newAge > P.age;
    P.age = newAge;
    if(P.human){
      G.pendingDrafts++;
      sfx(aged ? 'age' : 'draft');
      if(aged) queueBanner('The '+AGES[P.age].name+' Age', AGES[P.age].sub);
    }
    else aiDraft(P);
    if(aged && !P.human) logMsg(P.name+' enters the '+AGES[P.age].name+' Age.');
  }
}
function draftPool(P){
  const taken = new Set(P.edicts);
  let pool = [];
  for(let a=P.age; a>=0 && pool.length<3; a--){
    pool = pool.concat(EDICTS[a].filter(e=>!taken.has(e.id)));
  }
  if(!pool.length) return [];
  const shuffled = shuffle(pool.slice());
  return shuffled.slice(0,3);
}
function takeEdict(P, e){
  P.edicts.push(e.id);
  addMods(P, e.m);
  if(e.once) edictHook(P, e.once);
  if(P===G.me){ sfx('edict'); logMsg('Edict adopted: '+e.n+'.','big'); }
}
function edictHook(P, id){
  if(id==='reveal'){ P.m.revealAll=1; for(const t of G.list) P.seen.add(t.k); }
  else if(id==='uranium'){ P.m.uraniumAll=1; }
  else if(id==='spy'){ for(const o of G.players){ if(o===P) continue; for(const c of o.cities) seeFrom(P,T(c.q,c.r),1,true); } }
  else if(id==='endwars'){
    for(const o of G.players){ if(o===P||o.barb) continue; dipOf(P,o).war=false; dipOf(o,P).war=false; dipOf(o,P).truce=G.turn+15; }
    logMsg('Every war ends at once.','big');
  }
}
function aiDraft(P){
  const opts = draftPool(P);
  if(!opts.length) return;
  let best=opts[0], bs=-1e9;
  for(const e of opts){
    let s = rnd()*8;
    const m = e.m||{};
    const ag = P.leader.agenda;
    for(const k in m){
      const v = m[k];
      if(/^s[A-Z]|^pct(Atk|War|VsCity)|cityStr|cityHP/.test(k)) s += v*(ag==='conqueror'||ag==='raider'?2.4:1.3);
      else if(/pctSci|pSci|capSci|sciPerPop/.test(k)) s += v*(ag==='scholar'?26:16);
      else if(/pctGold|pGold|buyPct/.test(k)) s += Math.abs(v)*(ag==='tributary'?22:14);
      else if(/pctProd|pProd|unitPct|structPct/.test(k)) s += Math.abs(v)*20;
      else if(/pFood|tFood/.test(k)) s += v*(ag==='builder'?20:15);
      else if(k==='cityCap') s += v*30;
      else if(k==='diplo') s += v*(ag==='peaceful'?1.4:0.5);
      else s += Math.abs(v)*6;
    }
    if(s>bs){ bs=s; best=e; }
  }
  takeEdict(P, best);
}

/* ---------- end of run ---------------------------------------------------- */
function scoreOf(P){
  let s = 0;
  s += P.cities.length * 38;
  for(const c of P.cities) s += c.pop*7;
  s += P.edicts.length * 26;
  s += P.wonders.length * 65;
  s += P.age * 90;
  s += Math.round(P.gold/12);
  s += P.kills * 6;
  s += P.capturedCaps * 170;
  return Math.round(s);
}
function checkEnd(){
  if(G.over) return;
  const me = G.me;
  if(!me.cities.length){ endRun(false, 'wiped'); return; }
  if(!livingRivals().length){ endRun(true, 'conquest'); return; }
}
function endRun(won, how){
  if(G.over) return;
  G.over = true; G.endHow = how; G.endWon = won;
  sfx(won ? 'win' : 'lost');
  G.me.score = scoreOf(G.me);
  showGameOver(won, how);
}
/* ============================================================================
   Part 4b: sound. Everything is synthesised — no assets, no network.
   The context is only created on a real user gesture, so a headless run
   (and the tests) never make a sound and never pay for one.
   ==========================================================================*/

const AUDIO = {ctx:null, on:true, master:null, noise:null, last:{}};

function audioInit(){
  if(AUDIO.ctx) return AUDIO.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0.30;
    master.connect(ctx.destination);
    /* one shared noise buffer for thumps and impacts */
    const len = Math.floor(ctx.sampleRate * 0.5);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    AUDIO.ctx = ctx; AUDIO.master = master; AUDIO.noise = buf;
  }catch(e){ return null; }
  return AUDIO.ctx;
}
function audioReady(){
  return AUDIO.on && AUDIO.ctx && AUDIO.ctx.state !== 'suspended' ? AUDIO.ctx : null;
}
function tone(freq, t0, dur, vol, type, slideTo){
  const ctx = AUDIO.ctx; if(!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.02, dur*0.25));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AUDIO.master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function thump(t0, dur, vol, cut, q){
  const ctx = AUDIO.ctx; if(!ctx) return;
  const src = ctx.createBufferSource(); src.buffer = AUDIO.noise;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(cut||900, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(80,(cut||900)*0.25), t0+dur);
  f.Q.value = q || 1;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(AUDIO.master);
  src.start(t0); src.stop(t0 + dur + 0.02);
}

/* Throttle: a stack of units resolving at once must not become a wall of noise */
function sfx(name){
  const ctx = audioReady(); if(!ctx) return;
  const now = ctx.currentTime;
  const gap = {move:0.05, hit:0.06, select:0.05}[name] || 0.12;
  if(AUDIO.last[name] && now - AUDIO.last[name] < gap) return;
  AUDIO.last[name] = now;
  const t = now + 0.001;
  switch(name){
    case 'select':  tone(660, t, 0.06, 0.05, 'triangle'); break;
    case 'move':    thump(t, 0.10, 0.10, 700); tone(320, t, 0.07, 0.03, 'sine', 240); break;
    case 'hit':     thump(t, 0.20, 0.34, 1700, 0.8); tone(150, t, 0.16, 0.16, 'square', 60); break;
    case 'kill':    thump(t, 0.34, 0.40, 900); tone(110, t, 0.34, 0.20, 'sawtooth', 42); break;
    case 'found':   [523,659,784].forEach((f,i)=>tone(f, t+i*0.075, 0.36, 0.13, 'triangle')); break;
    case 'capture': [392,523,659,784].forEach((f,i)=>tone(f, t+i*0.06, 0.42, 0.13, 'square')); break;
    case 'lost':    [392,330,262,196].forEach((f,i)=>tone(f, t+i*0.11, 0.5, 0.14, 'sawtooth')); break;
    case 'age':     [392,523,659,784,1047].forEach((f,i)=>tone(f, t+i*0.10, 0.75, 0.15, 'triangle'));
                    thump(t, 0.6, 0.14, 400); break;
    case 'draft':   tone(880, t, 0.5, 0.10, 'sine'); tone(1320, t+0.05, 0.45, 0.06, 'sine'); break;
    case 'edict':   [659,988].forEach((f,i)=>tone(f, t+i*0.08, 0.5, 0.12, 'triangle')); break;
    case 'turn':    tone(240, t, 0.09, 0.10, 'square', 200); break;
    case 'build':   tone(523, t, 0.18, 0.09, 'triangle'); tone(784, t+0.07, 0.22, 0.07, 'triangle'); break;
    case 'war':     tone(196, t, 0.7, 0.18, 'sawtooth', 92); thump(t, 0.7, 0.20, 500); break;
    case 'win':     [523,659,784,1047,1319].forEach((f,i)=>tone(f, t+i*0.13, 1.1, 0.16, 'triangle')); break;
    case 'deny':    tone(160, t, 0.16, 0.12, 'square', 120); break;
  }
}

/* the context may only be created inside a gesture */
function audioWake(){
  if(!AUDIO.ctx) audioInit();
  if(AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
}
window.addEventListener('pointerdown', audioWake, {capture:true});
window.addEventListener('keydown', audioWake, {capture:true});

function audioToggle(){
  AUDIO.on = !AUDIO.on;
  try{ localStorage.setItem('rogueciv_sound', AUDIO.on ? '1' : '0'); }catch(e){}
  const b = document.getElementById('b-sound');
  if(b){ b.textContent = AUDIO.on ? '\u{1F50A}' : '\u{1F507}'; b.title = AUDIO.on ? 'Sound on' : 'Sound off'; }
  if(AUDIO.on) sfx('select');
}
try{ if(localStorage.getItem('rogueciv_sound') === '0') AUDIO.on = false; }catch(e){}
/* ============================================================================
   Part 4: the turn cycle, the rival AI, diplomacy and the raiders.
   ==========================================================================*/

const DIFFS = [
  {n:'Wanderer',  d:'A forgiving world. Rivals expand slowly and rarely strike first.', ai:0.85, barb:0.6, aggr:0.6},
  {n:'Chieftain', d:'A fair contest. Rivals play as you do, and will punish a weak border.', ai:1.0, barb:1.0, aggr:1.0},
  {n:'Conqueror', d:'A hard world. Rivals grow faster, scheme sooner, and finish what they start.', ai:1.35, barb:1.5, aggr:1.5}
];
const DF = () => DIFFS[G.difficulty];

/* ---------- upkeep and per-city turn -------------------------------------- */
function upkeepOf(P){
  const free = 3 + P.cities.length*(1 + M(P,'upkeepFree'));
  const over = Math.max(0, P.units.length - free);
  return Math.max(0, Math.round(over * 1 * (1 + M(P,'upkeepPct'))));
}
function empireRates(P){
  let gold=0, sci=0;
  for(const c of P.cities){ const y=cityYield(c); gold+=y[2]; sci+=y[3]; }
  gold -= upkeepOf(P);
  if(!P.human) { const b=DF().ai; gold=Math.round(gold*b); sci=Math.round(sci*b); }
  return {gold, sci};
}

function cityTurn(c){
  const P = G.players[c.owner];
  assignTiles(c);
  const [f,p,g,s] = cityYield(c);
  const bonus = P.human ? 1 : DF().ai;

  /* tiles improve simply by being worked, in place of worker units */
  const impCap = P.age>=4 ? 3 : P.age>=2 ? 2 : 1;
  for(const t of c.worked){
    t.wt = (t.wt||0)+1;
    const lvl = t.wt>=52 ? 3 : t.wt>=26 ? 2 : t.wt>=9 ? 1 : 0;
    t.imp = Math.min(impCap, lvl);
  }

  /* food and growth */
  c.food += f;
  if(c.food < 0){
    if(c.pop > 1){ c.pop--; c.food = Math.round(foodNeeded(c.pop)*0.5); refreshCity(c);
      if(P===G.me) logMsg(c.name+' starves and shrinks.','war'); }
    else c.food = 0;
  } else if(c.food >= foodNeeded(c.pop) && c.pop < cityMaxPop(c)){
    c.food -= foodNeeded(c.pop); c.pop++; refreshCity(c);
    if(P===G.me && c.pop%3===0) logMsg(c.name+' grows to size '+c.pop+'.');
  }

  /* production */
  if(c.justTaken>0){ c.justTaken--; }
  else {
    c.prod += Math.round(p*bonus);
    if(!c.queue) { if(!P.human) aiPickBuild(c); }
    if(c.queue){
      const need = itemCost(P, c.queue);
      if(c.prod >= need){
        const it = c.queue;
        if(completeItem(c, it)){ c.prod -= need; c.queue = null; if(!P.human) aiPickBuild(c); }
      }
    }
  }
  /* walls knit themselves back together — but not while anyone is at the gate */
  const besieged = nbrs(c.q,c.r).some(n=>n.units.some(u=>
      UNITS[u.type].cls!=='settler' && atWar(P, G.players[u.owner])));
  if(c.hp < c.maxhp && !besieged) c.hp = Math.min(c.maxhp, c.hp + Math.round(c.maxhp*0.07) + 2);
  return [g, s];
}

function playerEndTurn(P){
  if(!P.alive) return;
  let gold=0, sci=0;
  for(const c of P.cities.slice()){ const [g,s] = cityTurn(c); gold+=g; sci+=s; }
  const bonus = P.human ? 1 : DF().ai;
  gold -= upkeepOf(P);
  P.gold += Math.round(gold * (P.human?1:bonus));
  if(P.gold < 0){
    P.gold = 0;
    const victim = P.units.filter(u=>UNITS[u.type].cls!=='settler').sort((a,b)=>UNITS[a.type].str-UNITS[b.type].str)[0];
    if(victim){ if(P===G.me) logMsg('The treasury is empty — a '+UNITS[victim.type].n+' disbands.','war'); killUnit(victim,true); }
  }
  grantProgress(P, Math.round(sci * (P.human?1:bonus)));

  /* units: refresh, heal, resume orders */
  for(const u of P.units){
    const t = T(u.q,u.r);
    if(!u.movedThisTurn && !u.foughtThisTurn && u.hp<HP_MAX){
      let h = 7;
      if(t.owner===P.id) h = 13;
      if(t.city && t.city.owner===P.id) h = 24;
      if(u.fort) h += 4;
      if(u.embarked) h = 0;
      u.hp = Math.min(HP_MAX, u.hp + h);
    }
    u.mv = unitMoves(u);
    u.done = false; u.movedThisTurn=false; u.foughtThisTurn=false;
    if(u.fort) u.fort = Math.min(3, u.fort+1);
  }
  recomputeTerritory();
  recomputeVision(P);
}

/* ---------- diplomacy ----------------------------------------------------- */
function meet(a,b){
  const da=dipOf(a,b), db=dipOf(b,a);
  if(da.met) return;
  da.met = db.met = true;
  da.attitude = M(a,'diplo') + (a.leader.agenda==='peaceful'?10:0);
  db.attitude = M(b,'diplo') + (b.leader.agenda==='peaceful'?10:0);
  if(a===G.me || b===G.me){
    const o = a===G.me ? b : a;
    logMsg('You meet '+o.name+', led by '+o.leader.n+'.','big');
    queueBanner('You meet '+o.leader.n, 'of '+o.name);
  }
}
function checkMeetings(){
  for(const A of G.players){
    if(A.barb || !A.alive) continue;
    for(const B of G.players){
      if(B===A || B.barb || !B.alive) continue;
      if(dipOf(A,B).met) continue;
      let close=false;
      outer:
      for(const u of A.units.concat(A.cities.map(c=>({q:c.q,r:c.r})))){
        for(const v of B.units.concat(B.cities.map(c=>({q:c.q,r:c.r})))){
          if(hexDist(u.q,u.r,v.q,v.r)<=4){ close=true; break outer; }
        }
      }
      if(close) meet(A,B);
    }
  }
}
function declareWar(a, b, quiet){
  const da=dipOf(a,b), db=dipOf(b,a);
  if(da.war) return;
  da.war = db.war = true; da.allied = db.allied = false;
  da.attitude -= 30; db.attitude -= 45;
  /* everyone dislikes a warmonger a little */
  for(const o of G.players){
    if(o===a||o===b||o.barb) continue;
    const d=dipOf(o,a); d.attitude -= (o.leader.agenda==='peaceful'?14:6);
  }
  if(!quiet){
    if(a===G.me || b===G.me) sfx('war');
    if(b===G.me){ logMsg(a.name+' declares war on you!','war'); queueBanner(a.name+' declares war','the '+a.leader.n+' host marches'); }
    else if(a===G.me){ logMsg('You declare war on '+b.name+'.','war'); }
    else logMsg(a.name+' declares war on '+b.name+'.','war');
  }
}
function makePeace(a,b){
  const da=dipOf(a,b), db=dipOf(b,a);
  da.war=db.war=false; da.truce=db.truce=G.turn+12;
  da.attitude+=12; db.attitude+=12;
  if(a===G.me||b===G.me) logMsg('Peace between '+a.name+' and '+b.name+'.','good');
}
function militaryPower(P){
  let s=0;
  for(const u of P.units){ const d=UNITS[u.type]; if(d.cls==='settler') continue; s += (d.str + u.rank*6) * (u.hp/HP_MAX); }
  return Math.round(s);
}
function empirePower(P){
  return militaryPower(P) + P.cities.length*22 + P.age*18;
}
/* how the AI feels about a rival, recomputed each turn from its agenda */
function driftAttitude(A, B){
  const d = dipOf(A,B);
  if(!d.met) return;
  const ag = A.leader.agenda;
  const mine = empirePower(A), theirs = empirePower(B);
  const ratio = theirs / Math.max(1, mine);
  let target = -8;                       /* nobody starts out trusting anybody */

  if(ag==='conqueror')      target -= 24 + (1.4 - Math.min(1.4,ratio))*30;
  else if(ag==='raider')    target -= 15 + (B.gold > A.gold ? 16 : 0);
  else if(ag==='builder')   target -= 5 + B.wonders.length*12;
  else if(ag==='scholar')   target += (A.btDone - B.btDone)*3.5 - 5;
  else if(ag==='peaceful')  target += 30 - B.kills*2.0;
  else if(ag==='tributary') target += (d.paidTribute||0)*12 - (d.refusedTribute||0)*20 - 5;

  /* land hunger: a close neighbour is a temptation, a weak one doubly so */
  let minDist = 99;
  for(const c of A.cities) for(const c2 of B.cities) minDist = Math.min(minDist, hexDist(c.q,c.r,c2.q,c2.r));
  if(minDist < 9) target -= (9-minDist)*4.0 * (ratio < 1 ? 1.5 : 0.7);

  target += M(A,'diplo');
  if(d.denounced) target -= 25;
  if(d.war)       target -= 25;
  target = Math.max(-100, Math.min(100, target));

  const step = Math.min(2.5, Math.abs(target - d.attitude)*0.25);
  d.attitude += Math.sign(target - d.attitude) * step;
  d.attitude = Math.max(-100, Math.min(100, d.attitude));
}

/* ---------- AI: choosing what a city builds ------------------------------- */
function aiThreatAt(P, q, r){
  let th = 0;
  for(const o of G.players){
    if(o===P || !atWar(P,o)) continue;
    for(const u of o.units){
      const d = hexDist(q,r,u.q,u.r);
      if(d<=6) th += (UNITS[u.type].str + u.rank*6) / (1+d);
    }
  }
  return th;
}
function aiPickBuild(c){
  const P = G.players[c.owner];
  const opts = buildOptions(c);
  if(!opts.length){ c.queue=null; return; }
  const threat = aiThreatAt(P, c.q, c.r);
  const garrison = milAt(T(c.q,c.r));
  const atWarAny = G.players.some(o=>o!==P && !o.barb && atWar(P,o));
  const settlersOut = P.units.filter(u=>UNITS[u.type].cls==='settler').length;
  const army = P.units.filter(u=>UNITS[u.type].cls!=='settler').length;
  const wantArmy = 2 + P.cities.length*(atWarAny?2.8:1.1) + (P.leader.agenda==='conqueror'?3:0);
  const aggr = DF().aggr;

  let best=null, bs=-1e9;
  for(const o of opts){
    let s = rnd()*10;
    if(o.kind==='unit'){
      const d = UNITS[o.id];
      if(d.cls==='settler'){
        const room = cityCap(P) - P.cities.length;
        s += settlersOut >= Math.min(2, room) ? -70 : 84 - P.cities.length*5;
        if(threat>28) s -= 45;
        if(c.pop<3) s -= 18;
      } else {
        s += 26 + (garrison?0:34) + Math.min(50, threat*1.5);
        s += (army < wantArmy) ? 34*aggr : -22;
        if(atWarAny) s += 18*aggr;
        s += d.str*0.28;
        if(d.cls==='ranged') s += 6;
        if(d.cls==='siege' && atWarAny) s += 16;
        if(d.cls==='recon' && P.units.length>3) s -= 40;
      }
      s -= unitCost(P,o.id)*0.055;
    } else if(o.kind==='struct'){
      const d = STRUCTS[o.id];
      s += 40;
      if(d.f.food) s += d.f.food*7 + (c.pop<5?12:0);
      if(d.f.sci)  s += d.f.sci*6 + (P.leader.agenda==='scholar'?14:0);
      if(d.f.gold) s += d.f.gold*5;
      if(d.f.prodPct) s += d.f.prodPct*70;
      if(d.f.hp) s += d.f.hp*0.22 + threat*0.8;
      if(d.f.unitPct) s += 14*aggr;
      s -= structCost(P,o.id)*0.075;
      if(threat > 30) s -= 20;
    } else {
      const d = WONDERS[o.id];
      s += 44 + (P.leader.agenda==='builder'?46:0);
      if(d.victory) s += 260;
      s -= wonderCost(P,o.id)*0.055;
      if(threat > 25) s -= 40;
    }
    if(s>bs){ bs=s; best=o; }
  }
  c.queue = best ? {kind:best.kind, id:best.id} : null;
  if(c.queue && c.queue.id==='beacon' && !P._beaconTold){
    P._beaconTold = true;
    logMsg(P.name+' begins work on The Beacon.', 'big');
    queueBanner(P.name+' begins The Beacon', 'finish yours first, or stop theirs');
  }
}

/* ---------- AI: where to put the next city -------------------------------- */
function siteScore(P, t){
  if(isWater(t) || ELEV[t.e].impass) return -1e9;
  if(t.city) return -1e9;
  for(const o of G.players){
    for(const c of o.cities) if(hexDist(t.q,t.r,c.q,c.r) < 3) return -1e9;
  }
  if(P && t.owner>=0 && t.owner!==P.id) return -1e9;
  let s = 0;
  for(const n of tilesInRange(t.q,t.r,2)){
    const y = tileYield(n, P);
    const d = hexDist(t.q,t.r,n.q,n.r);
    const w = d===0 ? 1.6 : d===1 ? 1.2 : 0.75;
    s += (y[0]*1.5 + y[1]*1.6 + y[2]*0.7) * w;
    if(n.res && resVisible(n,P)) s += RES[n.res].k==='s' ? 7 : 4;
  }
  if(isFresh(t)) s += 12;
  if(cityIsCoastalAt(t)) s += 7;
  if(t.e==='hill') s += 6;
  if(t.t==='snow'||t.t==='desert') s -= 8;
  return s;
}
function cityIsCoastalAt(t){ return nbrs(t.q,t.r).some(n=>n.t==='coast'||n.t==='ocean'); }
function bestSiteNear(P, from, maxDist){
  let best=null, bs=-1e9;
  for(const t of G.list){
    if(!P.seen.has(t.k) && !P.barb) continue;
    const d = hexDist(from.q,from.r,t.q,t.r);
    if(d > maxDist) continue;
    let s = siteScore(P,t);
    if(s<=-1e8) continue;
    s -= d*2.2;
    if(s>bs){ bs=s; best=t; }
  }
  return best;
}

/* ---------- AI: unit orders ----------------------------------------------- */
function aiMoveAlong(u, target){
  if(!target) return;
  if(u.q===target.q && u.r===target.r) return;
  const path = pathTo(u, target);
  if(!path) return;
  for(const k of path){
    if(u.mv<=0) break;
    const t = G.tiles.get(k);
    if(!t) break;
    const b = blockedBy(u,t);
    if(b==='foe'){ break; }
    if(b==='own') break;
    if(!stepUnit(u,t)) break;
    u.movedThisTurn = true;
  }
}
