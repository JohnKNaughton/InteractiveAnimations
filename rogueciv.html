function aiAdjacentTargets(u){
  const P = G.players[u.owner], out=[];
  for(const n of nbrs(u.q,u.r)){
    const foe = milAt(n) || civAt(n);
    if(foe && atWar(P,G.players[foe.owner])) out.push({t:n, foe});
    else if(n.city && n.city.owner!==u.owner && atWar(P,G.players[n.city.owner])) out.push({t:n, city:n.city});
  }
  return out;
}
function aiRangedTargets(u){
  const P = G.players[u.owner], rng = unitRange(u), out=[];
  if(!rng) return out;
  for(const n of tilesInRange(u.q,u.r,rng)){
    if(hexDist(u.q,u.r,n.q,n.r)<1) continue;
    const foe = milAt(n) || civAt(n);
    if(foe && atWar(P,G.players[foe.owner])) out.push({t:n, foe});
    else if(n.city && n.city.owner!==u.owner && atWar(P,G.players[n.city.owner]) && n.city.hp>0) out.push({t:n, city:n.city});
  }
  return out;
}
function aiUnit(u){
  const P = G.players[u.owner];
  const d = UNITS[u.type];
  if(u.dead) return;

  /* civilians: go found a city */
  if(d.cls==='settler'){
    if(P.cities.length >= cityCap(P)){ u.done=true; return; }
    const here = T(u.q,u.r);
    if(!u.site || u.site.city || u.site.owner>=0 && u.site.owner!==P.id || hexDist(u.q,u.r,u.site.q,u.site.r)>16) u.site = bestSiteNear(P, here, 13);
    if(u.site && u.q===u.site.q && u.r===u.site.r && siteScore(P,here)>-1e8){
      foundCity(P, here, false); killUnit(u, true); return;
    }
    if(!u.site){ if(siteScore(P,here)>-1e8){ foundCity(P,here,false); killUnit(u,true); } return; }
    aiMoveAlong(u, u.site);
    const nowT = T(u.q,u.r);
    if(u.site && u.q===u.site.q && u.r===u.site.r && siteScore(P,nowT)>-1e8){ foundCity(P,nowT,false); killUnit(u,true); }
    return;
  }

  /* wounded units retire to heal */
  if(u.hp < 38 && !u.embarked){
    const home = nearestOwnCity(P, u);
    if(home && hexDist(u.q,u.r,home.q,home.r) > 0){ aiMoveAlong(u, T(home.q,home.r)); return; }
    u.fort = 1; return;
  }

  /* ranged and siege shoot first, then reposition */
  if(unitRange(u)){
    const tg = aiRangedTargets(u);
    if(tg.length){
      tg.sort((a,b)=> (b.city?200:0) - (a.city?200:0) + ((a.foe?a.foe.hp:0)-(b.foe?b.foe.hp:0)));
      rangedAttack(u, tg[0].t); u.foughtThisTurn=true; return;
    }
  }
  /* melee: strike anything adjacent worth striking */
  const adj = aiAdjacentTargets(u);
  if(adj.length && d.cls!=='siege'){
    let best=null, bo=-1, bestIsCity=false;
    for(const a of adj){
      let odds;
      if(a.city){
        odds = combatOdds(unitStr(u,{atk:1,vsCity:1,tile:T(u.q,u.r)}), defenceStrAt(a.t,u));
        odds += (a.city.hp < a.city.maxhp*0.35 ? 25 : 8);       /* press a breach */
        if(P._obj && a.t===P._obj) odds += 20;
      } else {
        odds = combatOdds(unitStr(u,{atk:1,foe:a.foe,tile:T(u.q,u.r)}), unitStr(a.foe,{def:1,tile:a.t,foe:u}));
      }
      if(a.foe && UNITS[a.foe.type].cls==='settler') odds = 200;
      if(odds>bo){ bo=odds; best=a; bestIsCity=!!a.city; }
    }
    /* an even field fight just trades away the army that was meant to take a city */
    const bar = P.barb ? 32 : bestIsCity ? 42 : 56;
    if(bo >= bar){
      meleeAttack(u, best.t); u.foughtThisTurn=true;
      return;
    }
  }
  if(unitRange(u) && aiRangedTargets(u).length===0){ /* fall through to move */ }

  /* strategy: garrison, hunt, or explore */
  const goal = aiGoalFor(u);
  if(goal) aiMoveAlong(u, goal);
  else { u.fort = Math.min(3, u.fort+1); }

  const adj2 = aiAdjacentTargets(u);
  if(adj2.length && u.mv>0 && d.cls!=='siege' && !u.foughtThisTurn){
    const a = adj2[0];
    const odds = a.city ? combatOdds(unitStr(u,{atk:1,vsCity:1}), defenceStrAt(a.t,u)) + 12
                        : combatOdds(unitStr(u,{atk:1,foe:a.foe}), unitStr(a.foe,{def:1,tile:a.t,foe:u}));
    if(odds >= (a.city ? 45 : 58)){ meleeAttack(u, a.t); u.foughtThisTurn=true; }
  }
  if(unitRange(u) && u.mv>0 && !u.foughtThisTurn){
    const tg = aiRangedTargets(u);
    if(tg.length) rangedAttack(u, tg[0].t);
  }
}
function nearestOwnCity(P, u){
  let best=null, bd=1e9;
  for(const c of P.cities){ const d=hexDist(u.q,u.r,c.q,c.r); if(d<bd){ bd=d; best=c; } }
  return best;
}
function aiGoalFor(u){
  const P = G.players[u.owner], d = UNITS[u.type];

  if(P.barb){
    /* raiders make for the nearest thing worth burning */
    let best=null, bd=1e9;
    for(const o of G.players){
      if(o===P || !o.alive) continue;
      for(const c of o.cities){ const dd=hexDist(u.q,u.r,c.q,c.r); if(dd<bd && dd<11){ bd=dd; best=T(c.q,c.r); } }
      for(const v of o.units){ const dd=hexDist(u.q,u.r,v.q,v.r); if(dd<bd-3 && dd<7){ bd=dd+3; best=T(v.q,v.r); } }
    }
    if(best) return best;
    const unseen = G.list.filter(t=>passable(t)&&!isWater(t));
    return unseen.length ? unseen[rint(unseen.length)] : null;
  }

  /* scouts explore */
  if(d.cls==='recon' && P.units.length>1){
    let best=null, bd=1e9;
    for(const t of G.list){
      if(P.seen.has(t.k) || isWater(t) || !passable(t)) continue;
      const dd = hexDist(u.q,u.r,t.q,t.r);
      if(dd<bd){ bd=dd; best=t; }
    }
    if(best) return best;
  }

  /* at war: the whole army works one objective at a time. Units picking
     their own nearest target scattered the host and no city ever fell. */
  const foes = G.players.filter(o=>o!==P && o.alive && atWar(P,o) && (o.cities.length||o.units.length));
  if(foes.length){
    if(P._objTurn !== G.turn) chooseObjective(P, foes);
    if(u._garrison) return hexDist(u.q,u.r,u._garrison.q,u._garrison.r)>0 ? T(u._garrison.q,u._garrison.r) : null;
    const obj = P._obj;
    if(obj){
      /* siege stops as soon as the walls are within reach */
      if(d.cls==='siege' && hexDist(u.q,u.r,obj.q,obj.r) <= unitRange(u)) return null;
      return obj;
    }
    let best=null, bd=1e9;
    for(const o of foes) for(const v of o.units){
      const dd = hexDist(u.q,u.r,v.q,v.r);
      if(dd<bd){ bd=dd; best=T(v.q,v.r); }
    }
    if(best) return best;
  }

  /* peace: hold the frontier city that looks softest */
  let weakest=null, ws=1e9;
  for(const c of P.cities){
    const garr = P.units.filter(v=>v!==u && hexDist(v.q,v.r,c.q,c.r)<=1 && UNITS[v.type].cls!=='settler').length;
    const s = garr*10 - aiThreatAt(P,c.q,c.r)*0.4 + hexDist(u.q,u.r,c.q,c.r)*0.6;
    if(s<ws){ ws=s; weakest=c; }
  }
  if(weakest && hexDist(u.q,u.r,weakest.q,weakest.r)>1) return T(weakest.q,weakest.r);
  return null;
}
/* one shared objective per turn, plus a home guard for every city */
function chooseObjective(P, foes){
  P._objTurn = G.turn;
  let best=null, bs=-1e9;
  for(const o of foes) for(const c of o.cities){
    let sc = (1 - c.hp/Math.max(1,c.maxhp)) * 70;
    sc -= cityDefStr(c) * 0.7;
    let dist = 40;
    for(const mc of P.cities) dist = Math.min(dist, hexDist(mc.q,mc.r,c.q,c.r));
    sc -= dist * 3.2;
    if(c.capital) sc += 22;
    if(o.cities.length===1) sc += 30;          /* finish a wounded rival off */
    if(sc>bs){ bs=sc; best=c; }
  }
  P._obj = best ? T(best.q,best.r) : null;

  /* pin the closest healthy unit to each city so the homeland is not naked */
  const army = P.units.filter(v=>UNITS[v.type].cls!=='settler');
  for(const v of army) v._garrison = null;
  const taken = new Set();
  for(const c of P.cities){
    let pickU=null, pd=1e9;
    for(const v of army){
      if(taken.has(v) || v.hp < 55) continue;
      const dd = hexDist(v.q,v.r,c.q,c.r);
      if(dd < pd){ pd=dd; pickU=v; }
    }
    if(pickU && army.length > P.cities.length){ pickU._garrison = c; taken.add(pickU); }
  }
}

/* ---------- AI: the whole turn -------------------------------------------- */
function aiTurn(P){
  if(!P.alive) return;
  recomputeVision(P);

  if(!P.barb){
    for(const o of G.players){
      if(o===P || o.barb || !o.alive) continue;
      driftAttitude(P,o);
      const dp = dipOf(P,o);
      if(!dp.met) continue;

      /* war and peace */
      const mine = empirePower(P), theirs = empirePower(o);
      if(!dp.war && dp.truce < G.turn){
        const wants  = dp.attitude < -28 && mine > theirs*1.02 && G.turn > 8;
        const oppor  = dp.attitude < -10 && mine > theirs*1.7  && G.turn > 12;
        const greedy = (P.leader.agenda==='conqueror'||P.leader.agenda==='raider')
                       && mine > theirs*1.25 && G.turn > 16;
        if((wants||oppor||greedy) && rnd() < 0.26*DF().aggr) declareWar(P,o);
      } else if(dp.war){
        const losing = mine < theirs*0.62;
        const stale  = rnd() < 0.10;
        if((losing || stale) && rnd()<0.4) {
          if(o===G.me){ if(rnd()<0.5) offerPeaceToPlayer(P); }
          else makePeace(P,o);
        }
      }
      /* tribute demands, the tributary's favourite pastime */
      if(o===G.me && !dp.war && P.leader.agenda==='tributary' && G.turn - (dp.lastTribute||-99) > 16
         && mine > theirs*1.15 && !M(G.me,'noTribute') && rnd()<0.45){
        dp.lastTribute = G.turn; demandTributeFromPlayer(P);
      }
    }
  }

  /* cities */
  for(const c of P.cities.slice()){ if(!c.queue) aiPickBuild(c); }

  /* buy something when rich */
  if(!P.barb && P.gold > 260 && rnd()<0.5){
    const c = P.cities[rint(P.cities.length)];
    if(c && c.queue){
      const cost = buyCost(c);
      if(cost <= P.gold*0.7){ P.gold -= cost; c.prod = itemCost(P,c.queue); }
    }
  }

  /* units */
  const order = P.units.slice().sort((a,b)=>{
    const ca=UNITS[a.type].cls, cb=UNITS[b.type].cls;
    const w = x => x==='settler'?0 : x==='siege'?1 : x==='ranged'?2 : 3;
    return w(ca)-w(cb);
  });
  for(const u of order){ if(!u.dead) aiUnit(u); }
}

/* ---------- raiders ------------------------------------------------------- */
function seedCamps(){
  const land = G.list.filter(t=>passable(t)&&!isWater(t)&&!t.city&&t.owner<0);
  shuffle(land);
  const want = Math.round(G.list.length*0.016*DF().barb)+2;
  let n=0;
  for(const t of land){
    if(n>=want) break;
    if(G.players.some(p=>p.cities.some(c=>hexDist(c.q,c.r,t.q,t.r)<4))) continue;
    if(tilesInRange(t.q,t.r,3).some(o=>o.camp)) continue;
    t.camp=true; n++;
  }
}
function barbTurn(){
  const B = BARB();
  const camps = G.list.filter(t=>t.camp);
  const cap = Math.round((3 + G.turn*0.12) * DF().barb);
  if(B.units.length < cap && camps.length && rnd() < 0.55*DF().barb){
    const t = camps[rint(camps.length)];
    const spot = freeSpotFor(B, t, false);
    if(spot){
      const tier = Math.min(LAST_AGE, Math.max(0, maxRivalAge()-1));
      const pool = ['warrior','warrior','spearman','archer','horseman','legion','crossbow','knight','musket','rifle','infantry']
        .filter(k=>UNITS[k].age<=tier && (!UNITS[k].req));
      const type = pool.length ? pool[pool.length-1-rint(Math.min(3,pool.length))] : 'warrior';
      const u = spawnUnit(B, type, spot.q, spot.r);
      u.xp = 10*tier; applyRank(u);
    }
  }
  aiTurn(B);
}
function maxRivalAge(){
  let a=0; for(const p of G.players) if(!p.barb) a=Math.max(a,p.age);
  return a;
}

/* ---------- the turn cycle ------------------------------------------------ */
function runTurn(){
  for(const P of G.players){ if(!P.human && !P.barb && P.alive) aiTurn(P); }
  barbTurn();
  checkMeetings();
  for(const P of G.players){ if(P.alive) playerEndTurn(P); }
  G.turn++;
  pruneDead();
  if(G.turn > MAX_TURNS && !G.over){
    const mine = scoreOf(G.me);
    const best = Math.max.apply(null, G.players.filter(p=>!p.barb && p!==G.me).map(scoreOf).concat([0]));
    endRun(mine >= best, 'time');
  }
  checkEnd();
}
function endTurnNow(){
  if(G.over || G.busy) return;
  G.busy = true;
  sfx('turn');
  setBusy(true);
  setTimeout(()=>{
    try{ runTurn(); }
    catch(err){ console.error('turn error', err); }
    G.busy = false;
    setBusy(false);
    if(!G.over){
      selectNextUnit(true);
      flushDrafts();
    }
    refreshAll(); markDirty();
  }, 24);
}
function pruneDead(){
  for(const P of G.players){
    if(P.barb || !P.alive) continue;
    if(!P.cities.length && !P.units.length) eliminate(P, null);
    else if(!P.cities.length && P.units.length && G.turn - (P.lostAll||G.turn) > 8) eliminate(P,null);
    if(!P.cities.length && !P.lostAll) P.lostAll = G.turn;
  }
}
/* ============================================================================
   Part 5: rendering the world.
   ==========================================================================*/

const cv = document.getElementById('map');
const cx = cv.getContext('2d');
const mcv = document.getElementById('minicv');
const mx  = mcv.getContext('2d');

const HEX = 46;                       /* hex "size" (centre to corner) at zoom 1 */
const CAM = {x:0, y:0, z:1, tz:1};
let DIRTY = true, W=0, H=0, DPR=1;
const markDirty = () => { DIRTY = true; };

/* unit-hex corner offsets, pointy-top */
const CORN = [];
for(let i=0;i<6;i++){ const a=(60*i+30)*Math.PI/180; CORN.push([Math.cos(a), Math.sin(a)]); }

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth || 1280;
  H = window.innerHeight || 800;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
  const mw = mcv.clientWidth || 210;
  mcv.width = Math.round(mw*DPR); mcv.height = Math.round(mw*0.62*DPR);
  mcv.style.height = Math.round(mw*0.62)+'px';
  markDirty();
}
window.addEventListener('resize', resize);

const sc   = () => HEX*CAM.z;
const wx   = t => t.x*sc() + W/2 - CAM.x*sc();
const wy   = t => t.y*sc() + H/2 - CAM.y*sc();
function screenToHex(px,py){
  const s = sc();
  const ox = (px - W/2)/s + CAM.x, oy = (py - H/2)/s + CAM.y;
  const [q,r] = pixToHex(ox,oy,1);
  return T(q,r);
}
function centreOn(q,r,snap){
  CAM.x = hexX(q,r,1); CAM.y = hexY(q,r,1);
  markDirty();
}

/* ---------- colour helpers ------------------------------------------------ */
/* shade() is chained — a hill's colour is shaded for the slope, again for its
   forest, and again for the gradient — so it must read back its own output.
   Parsing only '#rrggbb' made parseInt return NaN, NaN>>16 is 0, and every
   hill, forest, jungle, marsh and floodplain tile rendered black. */
function parseCol(c){
  if(c.charCodeAt(0) === 35){
    const n = parseInt(c.slice(1),16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  const m = c.match(/-?\d+(?:\.\d+)?/g) || [0,0,0];
  return [+m[0]||0, +m[1]||0, +m[2]||0];
}
function shade(col, amt){
  let [r,g,b] = parseCol(col);
  if(amt>0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=(1+amt); g*=(1+amt); b*=(1+amt); }
  const cl = v => Math.max(0, Math.min(255, v|0));
  return 'rgb('+cl(r)+','+cl(g)+','+cl(b)+')';
}
function hexPath(x,y,s,inset){
  const k = s*(inset||1);
  cx.beginPath();
  for(let i=0;i<6;i++){
    const px = x + CORN[i][0]*k, py = y + CORN[i][1]*k;
    if(i===0) cx.moveTo(px,py); else cx.lineTo(px,py);
  }
  cx.closePath();
}

/* ---------- the frame ----------------------------------------------------- */
function draw(){
  const s = sc();
  cx.clearRect(0,0,W,H);

  /* deep water beyond the map */
  const bg = cx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0c1b2c'); bg.addColorStop(1,'#08131f');
  cx.fillStyle = bg; cx.fillRect(0,0,W,H);

  const me = G.me;
  const pad = s*2;
  const vis = [];
  for(const t of G.list){
    const x = wx(t), y = wy(t);
    if(x < -pad || x > W+pad || y < -pad || y > H+pad) continue;
    t._sx = x; t._sy = y;
    vis.push(t);
  }

  /* 1 — terrain */
  for(const t of vis){
    if(!hasSeen(me,t)) continue;
    drawTerrain(t, t._sx, t._sy, s);
  }
  /* 2 — rivers */
  if(s > 14) for(const t of vis){ if(hasSeen(me,t) && t.riv.length) drawRiver(t, t._sx, t._sy, s); }
  /* 3 — decoration */
  if(s > 17) for(const t of vis){ if(hasSeen(me,t)) drawDecor(t, t._sx, t._sy, s); }
  /* 4 — territory borders */
  drawBorders(vis, s);
  /* 5 — resources */
  if(s > 22) for(const t of vis){ if(hasSeen(me,t)) drawResource(t, t._sx, t._sy, s); }
  /* 6 — overlays: movement, attack, path */
  drawOverlays(vis, s);
  /* 7 — cities and units */
  for(const t of vis){ if(t.city && hasSeen(me,t)) drawCity(t.city, t._sx, t._sy, s); }
  for(const t of vis){
    if(!canSee(me,t)) continue;
    for(const u of t.units) drawUnit(u, t._sx, t._sy, s, t.units.length>1);
  }
  /* 8 — fog */
  for(const t of vis) drawFog(t, t._sx, t._sy, s);
  /* 9 — the edge of the known world */
  drawMapEdge(vis, s);
  /* 10 — effects */
  drawFx(s);

  /* vignette */
  const vg = cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.36, W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'#0000'); vg.addColorStop(1,'#00000073');
  cx.fillStyle = vg; cx.fillRect(0,0,W,H);

  drawMini();
}

/* ---------- terrain ------------------------------------------------------- */
function drawTerrain(t,x,y,s){
  const T0 = TERRA[t.t];
  const h = hash2(t.q,t.r);
  let base = T0.col, dark = T0.col2;
  if(t.e==='hill'){ base = shade(base,-0.06); dark = shade(dark,-0.10); }
  if(t.e==='mtn'){ base = '#7b8290'; dark = '#5c626e'; }
  if(t.f==='forest'){ base = shade(base,-0.16); dark = shade(dark,-0.20); }
  if(t.f==='jungle'){ base = '#4e7c3c'; dark = '#3c6330'; }
  if(t.f==='marsh'){  base = '#5d7458'; dark = '#4a5f47'; }
  if(t.f==='flood'){  base = '#93a05a'; dark = '#7d8a48'; }
  if(t.f==='ice'){    base = '#cfe0ea'; dark = '#b3c8d6'; }

  const g = cx.createLinearGradient(x, y-s, x, y+s);
  g.addColorStop(0, shade(base, 0.055 + (h-0.5)*0.07));
  g.addColorStop(1, shade(dark, (h-0.5)*0.05));
  hexPath(x,y,s,1.005);
  cx.fillStyle = g; cx.fill();

  /* seams: a faint darker rim gives the tiles physical thickness */
  cx.strokeStyle = 'rgba(0,0,0,.16)'; cx.lineWidth = Math.max(0.6, s*0.018); cx.stroke();

  if(isWater(t) && s>18) drawWaves(t,x,y,s,h);
  if(t.t==='desert' && s>20 && !t.f) drawDunes(x,y,s,h);
  if((t.t==='snow'||t.t==='tundra') && s>20) drawSpeckle(x,y,s,h,'#ffffff55');
  if(s>30 && !t.f && t.e!=='mtn' && (t.t==='grass'||t.t==='plains')) drawTufts(x,y,s,h);
}
function drawWaves(t,x,y,s,h){
  cx.strokeStyle = t.t==='ocean' ? 'rgba(255,255,255,.055)' : 'rgba(255,255,255,.10)';
  cx.lineWidth = Math.max(0.7, s*0.028);
  const ph = h*6.28;
  for(let i=0;i<2;i++){
    const yy = y + (i-0.5)*s*0.42 + Math.sin(ph+i)*s*0.08;
    const w = s*0.42;
    cx.beginPath();
    cx.moveTo(x-w, yy);
    cx.quadraticCurveTo(x-w*0.5, yy-s*0.09, x, yy);
    cx.quadraticCurveTo(x+w*0.5, yy+s*0.09, x+w, yy);
    cx.stroke();
  }
}
/* sparse grass tufts: enough texture that open ground is not a flat fill */
function drawTufts(x,y,s,h){
  cx.strokeStyle = 'rgba(255,255,255,.10)';
  cx.lineWidth = Math.max(0.6, s*0.017);
  for(let i=0;i<7;i++){
    const a = hash2((x|0)+i*11, (y|0)+i*29)*6.283;
    const d = hash2(i*67, (x-y)|0)*s*0.62;
    const tx = x + Math.cos(a)*d, ty = y + Math.sin(a)*d*0.82;
    cx.beginPath();
    cx.moveTo(tx, ty+s*0.035);
    cx.lineTo(tx - s*0.02, ty - s*0.03);
    cx.moveTo(tx, ty+s*0.035);
    cx.lineTo(tx + s*0.022, ty - s*0.026);
    cx.stroke();
  }
}
function drawDunes(x,y,s,h){
  cx.strokeStyle='rgba(255,255,255,.13)'; cx.lineWidth=Math.max(0.6,s*0.024);
  for(let i=0;i<2;i++){
    const yy=y+(i-0.4)*s*0.4+ (h-0.5)*s*0.2, w=s*0.34;
    cx.beginPath(); cx.moveTo(x-w,yy); cx.quadraticCurveTo(x,yy-s*0.16,x+w,yy); cx.stroke();
  }
}
function drawSpeckle(x,y,s,h,col){
  cx.fillStyle=col;
  for(let i=0;i<5;i++){
    const a=hash2(x|0,(y|0)+i*97)*6.28, d=hash2(i*31,(x+y)|0)*s*0.6;
    cx.beginPath(); cx.arc(x+Math.cos(a)*d, y+Math.sin(a)*d, s*0.035, 0, 6.29); cx.fill();
  }
}

/* ---------- rivers -------------------------------------------------------- */
function drawRiver(t,x,y,s){
  cx.lineCap='round'; cx.lineJoin='round';
  for(const pass of [0,1]){
    cx.strokeStyle = pass ? '#4fa3d0' : 'rgba(20,50,72,.55)';
    cx.lineWidth = (pass ? s*0.115 : s*0.185);
    for(const d of t.riv){
      const nx = x + hexX(DIRS[d][0],DIRS[d][1],s)/2;
      const ny = y + hexY(DIRS[d][0],DIRS[d][1],s)/2;
      const mxp = (x+nx)/2 + Math.cos(hash2(t.q+d,t.r)*6.28)*s*0.06;
      const myp = (y+ny)/2 + Math.sin(hash2(t.q,t.r+d)*6.28)*s*0.06;
      cx.beginPath(); cx.moveTo(x,y); cx.quadraticCurveTo(mxp,myp,nx,ny); cx.stroke();
    }
  }
}

/* ---------- decoration: trees, hills, mountains --------------------------- */
function drawDecor(t,x,y,s){
  const h = hash2(t.q,t.r);
  if(t.e==='mtn'){ drawMountain(x,y,s,h,t.t==='snow'||t.t==='tundra'); return; }
  if(t.e==='hill') drawHills(x,y,s,h);
  if(t.f==='forest') drawTrees(x,y,s,h, t.t==='tundra'||t.t==='snow' ? '#3f5f4a' : '#3d6b3c', true);
  else if(t.f==='jungle') drawTrees(x,y,s,h,'#2f5c2c', false);
  else if(t.f==='marsh') drawMarsh(x,y,s,h);
  else if(t.f==='oasis') drawOasis(x,y,s);
}
function drawMountain(x,y,s,h,snowy){
  const peaks = [[-0.36,0.20,0.70],[0.32,0.24,0.86],[0.00,-0.08,1.18]];
  for(const [ox,oy,sz] of peaks){
    const bx = x+ox*s, by = y+oy*s, hh = s*0.70*sz, hw = s*0.44*sz;
    cx.beginPath();
    cx.moveTo(bx-hw, by+hh*0.45); cx.lineTo(bx, by-hh*0.55); cx.lineTo(bx+hw, by+hh*0.45); cx.closePath();
    cx.fillStyle = '#6a7382'; cx.fill();
    /* lit face */
    cx.beginPath();
    cx.moveTo(bx-hw, by+hh*0.45); cx.lineTo(bx, by-hh*0.55); cx.lineTo(bx, by+hh*0.45); cx.closePath();
    cx.fillStyle = '#8b95a4'; cx.fill();
    /* cap */
    const cap = hh*(snowy?0.42:0.28);
    cx.beginPath();
    cx.moveTo(bx-hw*cap/(hh*0.55)*0.55, by-hh*0.55+cap);
    cx.lineTo(bx, by-hh*0.55);
    cx.lineTo(bx+hw*cap/(hh*0.55)*0.55, by-hh*0.55+cap);
    cx.closePath(); cx.fillStyle='#e9eef4'; cx.fill();
  }
}
function drawHills(x,y,s,h){
  cx.fillStyle='rgba(0,0,0,.10)';
  for(let i=0;i<2;i++){
    const bx=x+(i-0.5)*s*0.5, by=y+s*0.16+ (h-0.5)*s*0.1;
    cx.beginPath(); cx.ellipse(bx,by,s*0.34,s*0.19,0,Math.PI,0); cx.fill();
  }
  cx.fillStyle='rgba(255,255,255,.13)';
  for(let i=0;i<2;i++){
    const bx=x+(i-0.5)*s*0.5, by=y+s*0.13+ (h-0.5)*s*0.1;
    cx.beginPath(); cx.ellipse(bx,by,s*0.30,s*0.16,0,Math.PI,0); cx.fill();
  }
}
function drawTrees(x,y,s,h,col,conifer){
  const n = conifer?7:8;
  for(let i=0;i<n;i++){
    const a = hash2(x|0, (y|0)+i*17)*6.283;
    const d = 0.10 + hash2(i*53,(x+y)|0)*0.52;
    const tx = x + Math.cos(a)*s*d, ty = y + Math.sin(a)*s*d*0.8;
    const sz = s*(0.19 + hash2(i*7,(x-y)|0)*0.07);
    cx.fillStyle='rgba(0,0,0,.20)';
    cx.beginPath(); cx.ellipse(tx, ty+sz*0.85, sz*0.75, sz*0.28, 0,0,6.29); cx.fill();
    cx.fillStyle = col;
    if(conifer){
      cx.beginPath(); cx.moveTo(tx-sz*0.75, ty+sz*0.75); cx.lineTo(tx, ty-sz*1.25); cx.lineTo(tx+sz*0.75, ty+sz*0.75); cx.closePath(); cx.fill();
      cx.fillStyle = shade(col,0.16);
      cx.beginPath(); cx.moveTo(tx-sz*0.42, ty+sz*0.2); cx.lineTo(tx, ty-sz*1.25); cx.lineTo(tx+sz*0.10, ty+sz*0.2); cx.closePath(); cx.fill();
    } else {
      cx.beginPath(); cx.arc(tx, ty, sz*0.85, 0, 6.29); cx.fill();
      cx.fillStyle = shade(col,0.18);
      cx.beginPath(); cx.arc(tx-sz*0.22, ty-sz*0.24, sz*0.5, 0, 6.29); cx.fill();
    }
  }
}
function drawMarsh(x,y,s,h){
  cx.strokeStyle='rgba(120,170,190,.5)'; cx.lineWidth=Math.max(0.7,s*0.03);
  for(let i=0;i<4;i++){
    const a=hash2(i*13,(x+y)|0)*6.28, d=hash2(i*29,(x-y)|0)*s*0.5;
    const tx=x+Math.cos(a)*d, ty=y+Math.sin(a)*d*0.8;
    cx.beginPath(); cx.moveTo(tx-s*0.12,ty); cx.quadraticCurveTo(tx,ty-s*0.07,tx+s*0.12,ty); cx.stroke();
  }
}
function drawOasis(x,y,s){
  cx.fillStyle='#3f8fb0'; cx.beginPath(); cx.ellipse(x,y+s*0.06,s*0.26,s*0.17,0,0,6.29); cx.fill();
  cx.fillStyle='#57a56a';
  for(let i=0;i<3;i++){
    const tx=x+(i-1)*s*0.24, ty=y-s*0.14;
    cx.beginPath(); cx.ellipse(tx,ty,s*0.10,s*0.055,0,0,6.29); cx.fill();
    cx.fillRect(tx-s*0.012, ty, s*0.024, s*0.16);
  }
}

/* ---------- resources ----------------------------------------------------- */
function drawResource(t,x,y,s){
  if(!t.res || !resVisible(t, G.me)) return;
  const r = RES[t.res];
  const rx = x + s*0.40, ry = y - s*0.40, rr = s*0.19;
  cx.beginPath(); cx.arc(rx,ry,rr,0,6.29);
  cx.fillStyle = r.k==='s' ? 'rgba(28,20,34,.86)' : r.k==='l' ? 'rgba(40,26,44,.84)' : 'rgba(24,30,22,.82)';
  cx.fill();
  cx.strokeStyle = r.k==='s' ? '#c98ae0' : r.k==='l' ? '#e8c15a' : '#9ed08a';
  cx.lineWidth = Math.max(0.8, s*0.022); cx.stroke();
  cx.font = (rr*1.35)+'px "Segoe UI Emoji",sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(r.ico, rx, ry+rr*0.06);
}

/* ---------- territory ----------------------------------------------------- */
function drawBorders(vis, s){
  const me = G.me;
  cx.lineCap='round';
  for(const t of vis){
    if(t.owner<0 || !hasSeen(me,t)) continue;
    const P = G.players[t.owner];
    if(!P) continue;
    for(let d=0;d<6;d++){
      const n = nbrAt(t,d);
      if(n && n.owner===t.owner) continue;
      const c1 = CORN[(5-d+6)%6], c2 = CORN[(6-d)%6];
      const k = 0.93;
      const ax = t._sx + c1[0]*s*k, ay = t._sy + c1[1]*s*k;
      const bx = t._sx + c2[0]*s*k, by = t._sy + c2[1]*s*k;
      cx.strokeStyle = 'rgba(0,0,0,.35)'; cx.lineWidth = Math.max(2.4, s*0.10);
      cx.beginPath(); cx.moveTo(ax,ay); cx.lineTo(bx,by); cx.stroke();
      cx.strokeStyle = P.col; cx.lineWidth = Math.max(1.4, s*0.062);
      cx.beginPath(); cx.moveTo(ax,ay); cx.lineTo(bx,by); cx.stroke();
    }
    /* faint wash of ownership */
    hexPath(t._sx,t._sy,s,1);
    cx.fillStyle = P.col + '14'; cx.fill();
  }
}
function drawMapEdge(vis, s){
  cx.strokeStyle='rgba(6,12,20,.75)'; cx.lineWidth=Math.max(2,s*0.09);
  for(const t of vis){
    for(let d=0;d<6;d++){
      if(nbrAt(t,d)) continue;
      const c1 = CORN[(5-d+6)%6], c2 = CORN[(6-d)%6];
      cx.beginPath();
      cx.moveTo(t._sx+c1[0]*s, t._sy+c1[1]*s);
      cx.lineTo(t._sx+c2[0]*s, t._sy+c2[1]*s);
      cx.stroke();
    }
  }
}

/* ---------- fog ----------------------------------------------------------- */
function drawFog(t,x,y,s){
  const me = G.me;
  if(!hasSeen(me,t)){
    hexPath(x,y,s,1.01);
    const h = hash2(t.q,t.r);
    cx.fillStyle = 'rgb('+(10+h*6|0)+','+(14+h*6|0)+','+(20+h*8|0)+')';
    cx.fill();
    return;
  }
  if(!canSee(me,t)){
    hexPath(x,y,s,1.01);
    cx.fillStyle = 'rgba(14,24,38,.32)'; cx.fill();
  }
}

/* ---------- overlays ------------------------------------------------------ */
function drawOverlays(vis, s){
  const u = UI.selUnit;
  if(UI.selCity && !u){
    const c = UI.selCity;
    for(const t of c.worked){
      if(!t._sx) continue;
      hexPath(t._sx,t._sy,s,0.86);
      cx.strokeStyle='rgba(240,212,154,.55)'; cx.lineWidth=Math.max(1,s*0.03); cx.stroke();
    }
  }
  if(u && !u.dead){
    const tu = T(u.q,u.r);
    /* reachable */
    if(UI.reach){
      for(const [k,cost] of UI.reach){
        const t = G.tiles.get(k);
        if(!t || t._sx===undefined) continue;
        hexPath(t._sx,t._sy,s,0.92);
        cx.fillStyle='rgba(200,225,255,.13)'; cx.fill();
        cx.strokeStyle='rgba(200,225,255,.20)'; cx.lineWidth=1; cx.stroke();
      }
    }
    /* legal city sites, when a Settler is in hand */
    if(UI.sites){
      const pulse = 0.80 + Math.sin(performance.now()/430)*0.06;
      for(const t of UI.sites){
        if(t._sx===undefined) continue;
        hexPath(t._sx,t._sy,s*pulse,1);
        cx.strokeStyle='rgba(150,220,160,.85)'; cx.lineWidth=Math.max(1.4,s*0.04);
        cx.setLineDash([s*0.13, s*0.10]); cx.stroke(); cx.setLineDash([]);
        cx.fillStyle='rgba(120,200,130,.10)'; cx.fill();
      }
    }
    /* attack targets */
    for(const t of UI.targets||[]){
      if(t._sx===undefined) continue;
      hexPath(t._sx,t._sy,s,0.92);
      cx.strokeStyle='rgba(230,90,80,.9)'; cx.lineWidth=Math.max(1.6,s*0.05); cx.stroke();
      cx.fillStyle='rgba(200,60,50,.15)'; cx.fill();
    }
    /* hover path */
    if(UI.path && UI.path.length){
      cx.strokeStyle='rgba(255,236,190,.75)'; cx.lineWidth=Math.max(1.6,s*0.045);
      cx.setLineDash([s*0.14, s*0.12]);
      cx.beginPath(); cx.moveTo(tu._sx!==undefined?tu._sx:wx(tu), tu._sy!==undefined?tu._sy:wy(tu));
      for(const k of UI.path){ const t=G.tiles.get(k); cx.lineTo(wx(t), wy(t)); }
      cx.stroke(); cx.setLineDash([]);
      const last = G.tiles.get(UI.path[UI.path.length-1]);
      cx.beginPath(); cx.arc(wx(last),wy(last), s*0.14, 0, 6.29);
      cx.fillStyle='rgba(255,236,190,.8)'; cx.fill();
    }
    /* selection ring */
    const px = tu._sx!==undefined?tu._sx:wx(tu), py = tu._sy!==undefined?tu._sy:wy(tu);
    const pulse = 0.94 + Math.sin(performance.now()/320)*0.045;
    hexPath(px,py,s*pulse,1);
    cx.strokeStyle='#f0d49a'; cx.lineWidth=Math.max(2,s*0.055); cx.stroke();
  }
  if(UI.hover && UI.hover._sx!==undefined){
    hexPath(UI.hover._sx,UI.hover._sy,s,0.99);
    cx.strokeStyle='rgba(255,255,255,.28)'; cx.lineWidth=Math.max(1,s*0.028); cx.stroke();
  }
}

/* ---------- cities -------------------------------------------------------- */
function drawCity(c,x,y,s){
  const P = G.players[c.owner];
  const walled = c.structs.includes('walls') || c.structs.includes('fortress');
  const grand  = c.structs.some(k=>WONDERS[k]);
  const h0 = hash2(c.q, c.r);

  cx.fillStyle='rgba(0,0,0,.30)';
  cx.beginPath(); cx.ellipse(x, y+s*0.32, s*0.60, s*0.24, 0,0,6.29); cx.fill();

  /* a curtain wall with crenellations */
  if(walled){
    hexPath(x, y+s*0.06, s*0.66, 1);
    cx.fillStyle = '#9a917f'; cx.fill();
    cx.strokeStyle = '#645d51'; cx.lineWidth = Math.max(1, s*0.028); cx.stroke();
    if(s > 30){
      cx.fillStyle = '#b3a992';
      for(let i=0;i<6;i++){
        const a1 = CORN[i], a2 = CORN[(i+1)%6];
        for(let t=0.18; t<0.9; t+=0.28){
          const px = x + (a1[0]+(a2[0]-a1[0])*t)*s*0.66;
          const py = y+s*0.06 + (a1[1]+(a2[1]-a1[1])*t)*s*0.66;
          cx.fillRect(px-s*0.035, py-s*0.035, s*0.07, s*0.07);
        }
      }
    }
  }

  /* the town: a keep in the civ colour with houses gathered round it */
  const n = Math.min(6, 1 + Math.floor(c.pop/1.6));
  const roofs = ['#9c6047','#8a5340','#a86a4e','#7d4c3b'];
  const houses = [];
  for(let i=0;i<n;i++){
    const a = (i/Math.max(1,n))*6.283 + h0*6.283;
    const d = s*(0.20 + (i%2)*0.11);
    houses.push({x:x+Math.cos(a)*d, y:y+Math.sin(a)*d*0.55 + s*0.10, i});
  }
  houses.sort((a,b)=>a.y-b.y);
  for(const hs of houses){
    const w = s*0.17, ht = s*0.19;
    cx.fillStyle = '#d7cbb4';
    cx.fillRect(hs.x-w/2, hs.y-ht, w, ht);
    cx.fillStyle = shade('#d7cbb4', -0.16);
    cx.fillRect(hs.x, hs.y-ht, w/2, ht);
    cx.fillStyle = roofs[hs.i % roofs.length];
    cx.beginPath();
    cx.moveTo(hs.x-w*0.68, hs.y-ht); cx.lineTo(hs.x, hs.y-ht-s*0.105); cx.lineTo(hs.x+w*0.68, hs.y-ht);
    cx.closePath(); cx.fill();
  }
  /* the keep */
  const kw = s*0.21, kh = s*0.34, ky = y + s*0.10;
  cx.fillStyle = shade(P.col, -0.34); cx.fillRect(x-kw/2, ky-kh, kw, kh);
  cx.fillStyle = shade(P.col, -0.14); cx.fillRect(x-kw/2, ky-kh, kw*0.5, kh);
  cx.fillStyle = P.col;
  cx.beginPath();
  cx.moveTo(x-kw*0.72, ky-kh); cx.lineTo(x, ky-kh-s*0.15); cx.lineTo(x+kw*0.72, ky-kh);
  cx.closePath(); cx.fill();
  if(s > 26){
    cx.strokeStyle='#e8e2d4'; cx.lineWidth=Math.max(1,s*0.018);
    cx.beginPath(); cx.moveTo(x, ky-kh-s*0.15); cx.lineTo(x, ky-kh-s*0.34); cx.stroke();
    cx.fillStyle = P.col;
    cx.beginPath();
    cx.moveTo(x, ky-kh-s*0.34); cx.lineTo(x+s*0.15, ky-kh-s*0.29); cx.lineTo(x, ky-kh-s*0.24);
    cx.closePath(); cx.fill();
  }
  if(grand && s > 26){
    /* a wonder shows as a gilded dome beside the keep */
    cx.fillStyle='#e6c877';
    cx.beginPath(); cx.arc(x - s*0.30, ky - s*0.14, s*0.11, Math.PI, 0); cx.fill();
    cx.fillRect(x - s*0.41, ky - s*0.14, s*0.22, s*0.14);
  }
  if(c.capital){
    cx.fillStyle='#f0d49a';
    const cxp=x, cyp=y-s*0.50;
    cx.beginPath();
    cx.moveTo(cxp-s*0.14, cyp+s*0.07); cx.lineTo(cxp-s*0.14, cyp-s*0.05);
    cx.lineTo(cxp-s*0.055, cyp+s*0.02); cx.lineTo(cxp, cyp-s*0.08);
    cx.lineTo(cxp+s*0.055, cyp+s*0.02); cx.lineTo(cxp+s*0.14, cyp-s*0.05);
    cx.lineTo(cxp+s*0.14, cyp+s*0.07); cx.closePath(); cx.fill();
  }

  if(s < 26) return;
  const label = c.name + '  ' + c.pop;
  cx.font = '700 ' + Math.round(s*0.235) + 'px "Segoe UI",sans-serif';
  const tw = cx.measureText(label).width + s*0.24;
  const bx = x - tw/2, by = y + s*0.40, bh = s*0.30;
  cx.fillStyle='rgba(12,16,22,.86)';
  roundRect(bx,by,tw,bh,bh*0.32); cx.fill();
  cx.strokeStyle = P.col; cx.lineWidth = Math.max(1,s*0.024); cx.stroke();
  cx.fillStyle = '#e9eef5'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(label, x, by+bh*0.54);
  if(c.hp < c.maxhp){
    const w = tw*0.9, hh = Math.max(2,s*0.05);
    cx.fillStyle='rgba(0,0,0,.6)'; cx.fillRect(x-w/2, by-hh-s*0.05, w, hh);
    const f = c.hp/c.maxhp;
    cx.fillStyle = f>0.5?'#7fc98a':f>0.25?'#e8b45c':'#e0736a';
    cx.fillRect(x-w/2, by-hh-s*0.05, w*f, hh);
  }
}

function roundRect(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.quadraticCurveTo(x+w,y,x+w,y+r);
  cx.lineTo(x+w,y+h-r); cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  cx.lineTo(x+r,y+h); cx.quadraticCurveTo(x,y+h,x,y+h-r);
  cx.lineTo(x,y+r); cx.quadraticCurveTo(x,y,x+r,y); cx.closePath();
}

/* ---------- units --------------------------------------------------------- */
function drawUnit(u,x,y,s,stacked){
  const P = G.players[u.owner], d = UNITS[u.type];
  const civil = d.cls==='settler';
  if(stacked) { x += civil ? -s*0.24 : s*0.20; y += civil ? s*0.16 : -s*0.04; }
  const onCity = T(u.q,u.r) && T(u.q,u.r).city;
  if(onCity) y -= s*0.26;                    /* do not sit on top of the town */
  const R = s*(civil?0.25:0.29) * (onCity?0.86:1);
  const dim = (P===G.me && (u.done || u.mv<=0));

  cx.globalAlpha = dim ? 0.62 : 1;
  cx.fillStyle='rgba(0,0,0,.34)';
  cx.beginPath(); cx.ellipse(x, y+R*0.92, R*0.92, R*0.34, 0,0,6.29); cx.fill();

  /* token */
  const g = cx.createLinearGradient(x, y-R, x, y+R);
  g.addColorStop(0, shade(P.col, 0.26)); g.addColorStop(1, P.col2);
  cx.beginPath();
  if(civil){ roundRect(x-R, y-R*0.92, R*2, R*1.84, R*0.42); }
  else { cx.arc(x,y,R,0,6.29); }
  cx.fillStyle=g; cx.fill();
  cx.strokeStyle = u.embarked ? '#a8d8f0' : 'rgba(12,16,22,.85)';
  cx.lineWidth = Math.max(1.2, s*0.032); cx.stroke();
  if(P===G.me && !u.done && u.mv>0){
    cx.strokeStyle='rgba(255,246,214,.7)'; cx.lineWidth=Math.max(0.8,s*0.016);
    cx.beginPath(); cx.arc(x,y,R*1.16,0,6.29); cx.stroke();
  }

  if(s>20){
    cx.save(); cx.translate(x,y); cx.scale(R/16, R/16);
    cx.strokeStyle='#f2f6fb'; cx.fillStyle='#f2f6fb';
    cx.lineWidth=2.1; cx.lineCap='round'; cx.lineJoin='round';
    glyph(u.embarked ? 'boat' : d.g);
    cx.restore();
  }
  /* rank pips */
  if(u.rank && s>24){
    cx.fillStyle='#f0d49a';
    for(let i=0;i<u.rank;i++){
      cx.beginPath(); cx.arc(x - R*0.5 + i*R*0.5, y + R*1.02, R*0.13, 0, 6.29); cx.fill();
    }
  }
  /* fortified marker */
  if(u.fort && s>24){
    cx.strokeStyle='rgba(240,212,154,.8)'; cx.lineWidth=Math.max(1,s*0.022);
    cx.beginPath(); cx.arc(x, y, R*1.30, -0.9, -0.9+2.2); cx.stroke();
  }
  /* health */
  if(u.hp < HP_MAX){
    const w = R*1.9, hh = Math.max(2, s*0.055);
    cx.fillStyle='rgba(0,0,0,.65)'; cx.fillRect(x-w/2, y-R-hh*2.0, w, hh);
    const f = u.hp/HP_MAX;
    cx.fillStyle = f>0.55?'#7fc98a':f>0.28?'#e8b45c':'#e0736a';
    cx.fillRect(x-w/2, y-R-hh*2.0, w*f, hh);
  }
  cx.globalAlpha = 1;
}

/* Vector unit glyphs, drawn in a ~24x24 box centred on the origin.
   Filled silhouettes read far better than line art at token size. */
function glyph(g){
  const P = (pts, fill)=>{
    cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0], pts[i][1]);
    cx.closePath(); fill===false ? cx.stroke() : cx.fill();
  };
  const L = (a,b,c,d,w)=>{ cx.lineWidth = w||2.2; cx.beginPath(); cx.moveTo(a,b); cx.lineTo(c,d); cx.stroke(); };
  const C = (a,b,r)=>{ cx.beginPath(); cx.arc(a,b,r,0,6.29); cx.fill(); };
  const dark = (fn)=>{ cx.save(); cx.fillStyle='rgba(20,26,34,.8)'; fn(); cx.restore(); };
  const blade = (len, wide)=> P([[0,-len],[wide,-len*0.45],[wide*0.72,3],[-wide*0.72,3],[-wide,-len*0.45]]);

  switch(g){
    case 'sword':                                    /* long blade, crossguard, pommel */
      blade(11, 2.6); L(-5.5,3.4,5.5,3.4,2.4); L(0,3.4,0,8,2.2); C(0,9,1.7); break;
    case 'gladius':                                  /* short, broad, leaf-shaped */
      blade(8.5, 3.6); L(-5,3.4,5,3.4,2.6); L(0,3.4,0,7.5,2.4); C(0,8.8,1.9); break;
    case 'axe':
      L(-1.5,-9,-1.5,9,2.4);
      P([[-1.5,-8.5],[3,-9],[7.5,-5],[7.5,-0.5],[3,1.5],[-1.5,1]]);
      break;
    case 'spear':
      L(0,-4,0,10,2.0); P([[0,-10.5],[3.2,-4.5],[0,-2.8],[-3.2,-4.5]]);
      L(-3,4,3,4,1.6); break;
    case 'sling':                                    /* Y-frame, cord, and a stone */
      L(0,2,0,9,2.4); L(0,2,-5,-4,2.4); L(0,2,5,-4,2.4);
      cx.lineWidth=1.5; cx.beginPath(); cx.moveTo(-5,-4);
      cx.quadraticCurveTo(0,-1.5,5,-4); cx.stroke();
      C(0,-3.2,2.4); break;
    case 'bow':
      cx.lineWidth=2.3; cx.beginPath(); cx.arc(2,0,8,-2.05,2.05); cx.stroke();
      L(-5,-7,-5,7,1.3);
      L(-6,0,8,0,1.9); P([[9.5,0],[6,-2.2],[6,2.2]]); break;
    case 'xbow':
      cx.lineWidth=2.3; cx.beginPath(); cx.arc(0,-3,8,3.34,6.08); cx.stroke();
      L(-7.6,-4.6,7.6,-4.6,1.3);
      P([[-1.6,-6],[1.6,-6],[1.6,6],[-1.6,8]]);
      L(-4,6,1.6,6,2.0); break;
    case 'horse': case 'cavalry': case 'cuirass': case 'knight': case 'chariot':
      /* A chess-knight profile with deliberately exaggerated features: at a
         token's ~20px anything subtler collapses into a blob. */
      P([[-6.5,10],[6.5,10],[5.5,1],[3.5,-2.5],[10.5,-3.5],[10.5,-7.5],[4,-7.5],
         [3,-13.5],[-0.5,-8.5],[-3,-9.5],[-6,-3],[-7.5,3]]);
      dark(()=>C(4.6,-5.2,1.5));                        /* eye */
      dark(()=>C(9.3,-5.4,1.0));                        /* nostril */
      if(g==='knight'||g==='cuirass'){                  /* plume on the helm */
        P([[-2,-9],[-4,-14],[-0.5,-13],[1,-9.5]]);
      }
      if(g==='chariot'){ cx.lineWidth=1.7; cx.beginPath(); cx.arc(-7,7,3.4,0,6.29); cx.stroke();
                         C(-7,7,1.1); }
      break;
    case 'elephant':
      /* body and legs */
      P([[-6,8],[-6,-3],[-2,-8],[5,-8],[9,-3],[9,8],[6,8],[6,1],[-3,1],[-3,8]]);
      /* head and trunk, curling forward */
      cx.beginPath();
      cx.moveTo(-6,-2); cx.lineTo(-9,-1);
      cx.quadraticCurveTo(-12,3,-10,8);
      cx.lineTo(-7.4,8); cx.quadraticCurveTo(-9,3,-6.2,1.4);
      cx.closePath(); cx.fill();
      dark(()=>{ cx.beginPath(); cx.ellipse(-1.5,-3.2,3.6,4.2,0.15,0,6.29); cx.fill(); });  /* ear */
      P([[-8.6,1.5],[-11.5,4.5],[-9.6,5.2]]);            /* tusk */
      dark(()=>C(-5.2,-2.6,0.95));                       /* eye */
      break;
    case 'catapult':
      L(-8,7,8,7,2.0);
      C(-4.5,7.5,2.9); C(4.5,7.5,2.9);
      dark(()=>{ C(-4.5,7.5,1.1); C(4.5,7.5,1.1); });
      L(-6,6,4,-7,2.6); C(5.5,-8.5,3.0); break;
    case 'bombard': case 'arty':
      P([[-9,3],[-2,3],[9,-5],[7.5,-8],[-4,-1],[-9,-1]]);
      L(-7,3,-7,7,2.2);
      C(-5,7.5,3.2);
      dark(()=>C(-5,7.5,1.2));
      L(-8,4,4,9,2.0); break;
    case 'rocket':
      P([[0,-11],[3.4,-3],[3.4,5],[-3.4,5],[-3.4,-3]]);
      P([[3.4,4],[8,9.5],[3.4,9.5]]); P([[-3.4,4],[-8,9.5],[-3.4,9.5]]);
      dark(()=>C(0,-3.5,1.7)); break;
    case 'musket': case 'rifle':
      P([[6,-10],[8.5,-8.6],[-2,6],[-4.5,4.5]]);
      P([[-3,4],[-1,5.5],[-5.5,10.5],[-8.5,9]]);
      L(-1,1,2,3,1.8); if(g==='rifle') L(5.5,-8,8,-11,1.6); break;
    case 'infantry':
      /* brimmed helmet */
      cx.beginPath();
      cx.moveTo(-5.2,-4.4); cx.quadraticCurveTo(-5.2,-10.5,0,-10.5);
      cx.quadraticCurveTo(5.2,-10.5,5.2,-4.4); cx.closePath(); cx.fill();
      P([[-7.4,-4.4],[7.4,-4.4],[6.4,-2.4],[-6.4,-2.4]]);
      /* shoulders */
      P([[-6,0],[6,0],[5,8.5],[-5,8.5]]);
      dark(()=>P([[-1.2,0],[1.2,0],[1.2,8.5],[-1.2,8.5]]));
      /* slung rifle */
      cx.save(); cx.strokeStyle=cx.fillStyle;
      L(8.6,-8,3.4,9.5,2.3); cx.restore(); break;
    case 'tank':
      P([[-9,2],[9,2],[9,7.5],[-9,7.5]]);
      dark(()=>{ for(let i=-7;i<=7;i+=3.5) C(i,5,1.1); });
      P([[-6,-4.5],[3.5,-4.5],[4.5,1],[-7,1]]);
      P([[3.5,-4],[11,-4],[11,-1.8],[3.5,-1.8]]); break;
    case 'settler':                                         /* covered wagon */
      P([[-8,2],[8,2],[8,5],[-8,5]]);
      cx.beginPath(); cx.moveTo(-7,2); cx.quadraticCurveTo(0,-11,7,2); cx.closePath(); cx.fill();
      C(-5,7,2.7); C(5,7,2.7);
      dark(()=>{ C(-5,7,1.0); C(5,7,1.0); }); break;
    case 'scout':                                           /* spyglass */
      cx.save(); cx.translate(0,1); cx.rotate(-0.6);
      P([[-9,-2.6],[1,-2.0],[1,2.0],[-9,2.6]]);
      P([[1,-3.4],[9,-4.6],[9,4.6],[1,3.4]]);
      cx.restore(); break;
    case 'eagle':
      P([[0,-9],[4,-4],[11,0],[4,2],[2,9],[0,4],[-2,9],[-4,2],[-11,0],[-4,-4]]);
      break;
    case 'boat':
      cx.beginPath(); cx.moveTo(-9,1); cx.lineTo(9,1);
      cx.quadraticCurveTo(6,7,0,7); cx.quadraticCurveTo(-6,7,-9,1); cx.closePath(); cx.fill();
      L(0,1,0,-9,1.9); P([[0.9,-9.5],[7.5,-4],[0.9,-2.5]]); break;
    default:
      C(0,0,5.5);
  }
}


/* ---------- effects ------------------------------------------------------- */
function fxCombat(t, dmg, from, dmg2){
  if(G.me && canSee(G.me, t)) sfx('hit');
  G.anim.push({k:'hit', q:t.q, r:t.r, n:dmg, t:performance.now()});
  if(from && dmg2) G.anim.push({k:'hit', q:from.q, r:from.r, n:dmg2, t:performance.now()+90});
  markDirty();
}
function fxText(t, text, col){
  G.anim.push({k:'txt', q:t.q, r:t.r, s:text, c:col||'#f0d49a', t:performance.now()});
  markDirty();
}
function drawFx(s){
  const now = performance.now();
  G.anim = G.anim.filter(a => now - a.t < 1150);
  for(const a of G.anim){
    const age = (now - a.t)/1150;
    if(age < 0) continue;
    const t = T(a.q,a.r); if(!t) continue;
    const x = wx(t), y = wy(t) - age*s*0.5;
    cx.globalAlpha = Math.max(0, 1 - age*age);
    if(a.k==='hit'){
      cx.font='700 '+Math.round(s*0.36)+'px "Segoe UI",sans-serif';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.lineWidth=Math.max(2,s*0.06); cx.strokeStyle='rgba(0,0,0,.75)';
      cx.strokeText('-'+a.n, x, y); cx.fillStyle='#ff8b7e'; cx.fillText('-'+a.n, x, y);
      if(age<0.35){
        cx.beginPath(); cx.arc(x,y+age*s*0.5, s*(0.3+age*1.2), 0, 6.29);
        cx.strokeStyle='rgba(255,160,120,'+(0.7-age*2)+')'; cx.lineWidth=Math.max(2,s*0.07); cx.stroke();
      }
    } else {
      cx.font='700 '+Math.round(s*0.30)+'px "Segoe UI",sans-serif';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.lineWidth=Math.max(2,s*0.06); cx.strokeStyle='rgba(0,0,0,.75)';
      cx.strokeText(a.s,x,y); cx.fillStyle=a.c; cx.fillText(a.s,x,y);
    }
    cx.globalAlpha=1;
  }
}

/* ---------- minimap ------------------------------------------------------- */
function drawMini(){
  const w = mcv.width/DPR, h = mcv.height/DPR;
  mx.setTransform(DPR,0,0,DPR,0,0);
  mx.fillStyle='#080b10'; mx.fillRect(0,0,w,h);
  const R = G.rad;
  const spanX = SQ3*(R+0.5)*2, spanY = 1.5*(R+0.7)*2;
  const k = Math.min(w/spanX, h/spanY);
  const ox = w/2, oy = h/2;
  const me = G.me;
  for(const t of G.list){
    if(!hasSeen(me,t)) continue;
    const px = ox + t.x*k, py = oy + t.y*k;
    let col;
    if(t.owner>=0 && G.players[t.owner]) col = G.players[t.owner].col;
    else if(isWater(t)) col = t.t==='ocean' ? '#16304c' : '#25597c';
    else if(t.e==='mtn') col = '#79808d';
    else col = TERRA[t.t].col;
    mx.fillStyle = col;
    mx.fillRect(px-k*0.95, py-k*0.85, k*1.9, k*1.75);
    if(!canSee(me,t)){ mx.fillStyle='rgba(8,12,18,.42)'; mx.fillRect(px-k*0.95,py-k*0.85,k*1.9,k*1.75); }
  }
  for(const P of G.players){
    if(P.barb) continue;
    for(const c of P.cities){
      const t=T(c.q,c.r); if(!hasSeen(me,t)) continue;
      mx.fillStyle = c.capital ? '#fff' : P.col;
      mx.beginPath(); mx.arc(ox+t.x*k, oy+t.y*k, k*(c.capital?1.5:1.1), 0, 6.29); mx.fill();
      mx.strokeStyle='#0009'; mx.lineWidth=0.8; mx.stroke();
    }
  }
  /* viewport box */
  const vw = (W/sc())*k, vh = (H/sc())*k;
  mx.strokeStyle='rgba(255,236,190,.85)'; mx.lineWidth=1.3;
  mx.strokeRect(ox+CAM.x*k-vw/2, oy+CAM.y*k-vh/2, vw, vh);
  mcv._k = k; mcv._ox = ox; mcv._oy = oy;
}

function canFoundHere(P, t){
  if(isWater(t) || ELEV[t.e].impass) return false;
  if(t.city) return false;
  if(P.cities.length >= cityCap(P)) return false;
  for(const o of G.players) for(const c of o.cities) if(hexDist(t.q,t.r,c.q,c.r) < 3) return false;
  if(t.owner>=0 && t.owner!==P.id) return false;
  return true;
}
function doFound(u){
  const P = G.players[u.owner], t = T(u.q,u.r);
  if(!canFoundHere(P,t)) return;
  const c = foundCity(P, t, !P.cities.length);
  killUnit(u, true);
  logMsg('You found '+c.name+'.', 'big');
  clearSel(); selectCity(c);
  recomputeVision(P);
  refreshAll(); markDirty();
}
function upgradeFor(P, u){
  const d = UNITS[u.type];
  const base = d.uq || u.type;
  const line = LINES[d.cls];
  if(!line) return null;
  let i = line.indexOf(base);
  if(i<0) return null;
  for(let j=line.length-1;j>i;j--){
    const nx = line[j];
    if(!nx || nx === base) continue;              /* never upgrade into yourself */
    const real = realUnit(P,nx);
    if(real === u.type) continue;
    if(UNITS[nx].age<=P.age && (!UNITS[real].req || hasRes(P,UNITS[real].req))) return real;
  }
  return null;
}
function upgradeCost(P,u,to){
  return Math.max(20, Math.round((unitCost(P,to) - unitCost(P,u.type))*1.4 + 20));
}
function doUpgrade(u, to){
  const P = G.players[u.owner], cost = upgradeCost(P,u,to);
  if(P.gold < cost) return;
  P.gold -= cost;
  u.type = to; u.hp = Math.min(HP_MAX, u.hp+20); u.mv = 0; u.done = true;
  logMsg('A unit becomes a '+UNITS[to].n+'.','good');
  refreshAll(); markDirty();
}

function showBuildMenu(c){
  const P = G.me, opts = buildOptions(c), y = cityYield(c);
  const group = {unit:[], struct:[], wonder:[]};
  for(const o of opts) group[o.kind].push(o);
  const row = (o)=>{
    const cost = itemCost(P,o), turns = Math.max(1,Math.ceil(cost/Math.max(1,y[1])));
    let ico, name, desc;
    if(o.kind==='unit'){
      const d = UNITS[o.id];
      ico = '<span style="color:#cdd8e6">'+({melee:'⚔',ranged:'\u{1F3F9}',siege:'\u{1F4A3}',mounted:'\u{1F40E}',recon:'\u{1F441}',settler:'\u{1F3D5}'}[d.cls]||'⚔')+'</span>';
      name = d.n + (d.uq?' <span style="color:var(--gold2);font-size:10px">UNIQUE</span>':'');
      desc = d.d || ('Strength '+d.str + (d.rs?' · ranged '+d.rs+' (range '+d.rng+')':'') + ' · '+d.mv+' movement');
      if(d.req) desc += ' · needs '+RES[d.req].n;
    } else if(o.kind==='struct'){
      const d = STRUCTS[o.id]; ico = d.ico; name = d.n; desc = d.d;
    } else {

      name = d.n + ' <span style="color:var(--gold2);font-size:10px">WONDER</span>'; desc = d.d;

      + '<div class="ri">'+ico+'</div><div style="min-width:0"><div class="rn">'+name+'</div><div class="rd">'+esc(desc)+'</div></div>'
      + '<div class="rr"><b>'+cost+'</b><div style="color:var(--dim);font-size:10px">'+turns+' turns</div></div></div>';

  let body = '';

  openModal(esc(c.name), 'Size '+c.pop+' · '+y[1]+' production a turn · '+G.me.gold+' gold in the treasury'
    + (P.cities.length>=cityCap(P)?' · <span style="color:var(--warn)">city limit reached ('+cityCap(P)+')</span>':' · '+P.cities.length+'/'+cityCap(P)+' cities'),
    '<div style="width:min(620px,86vw)">'+body+'</div>', [{label:'Close', fn:closeModal}]);

      c.queue = {kind:k, id};

      +   '<span style="color:var(--dim);font-size:11px">of '+esc(o.name)+'</span>'
      +   '<span style="margin-left:auto">'+tag+'</span></div>'
      + '<div style="font-size:11px;color:var(--dim);margin:6px 0 3px">'+esc(o.leader.ad)+'</div>'
      + '<div style="display:flex;align-items:center;gap:8px;margin:6px 0">'
      +   '<span style="font-size:11px;width:74px;color:'+(att>=25?'var(--good)':att<=-40?'var(--bad)':'var(--dim)')+'">'+attitudeWord(att)+'</span>'
      +   '<div class="bar" style="flex:1"><i style="width:'+((att+100)/2)+'%;background:'+(att>=25?'#7fc98a':att<=-40?'#e0736a':'#8f9cae')+'"></i></div>'
      +   '<span style="font-size:11px;color:var(--dim);width:96px;text-align:right">'+rel+'</span></div>'
      + '<div style="font-size:11px;color:var(--dim);margin-bottom:7px">'
      +   o.cities.length+' cities · '+AGES[o.age].name+' Age · '+o.edicts.length+' edicts</div>'
      + '<div id="dip-'+o.id+'" style="display:flex;gap:5px;flex-wrap:wrap"></div></div>';
  }
  body += '</div>';
  openModal('The Nations', 'Rivals remember what you do. Their agendas decide what they make of it.', body, [{label:'Close', fn:closeModal}]);
  for(const o of met){
    const holder = $('dip-'+o.id); if(!holder) continue;
    const d = dipOf(P,o);
    if(!o.alive) { holder.innerHTML='<span style="color:var(--dim);font-size:11px">Nothing remains to negotiate with.</span>'; continue; }
    if(d.war){
      holder.appendChild(actBtn('Sue for Peace', ()=>tryPeace(o)));
    } else {
      holder.appendChild(actBtn('Gift 60 gold', ()=>doGift(o,60), '', P.gold<60));
      holder.appendChild(actBtn('Gift 200 gold', ()=>doGift(o,200), '', P.gold<200));
      holder.appendChild(actBtn('Demand Tribute', ()=>doDemand(o), '', false, 'They may pay — or remember the insult.'));
      holder.appendChild(actBtn('Declare War', ()=>{ declareWar(P,o); showDiplo(); refreshAll(); markDirty(); }, 'red'));
    }
  }
}
function doGift(o, amt){
  const P = G.me;
  if(P.gold < amt) return;
  P.gold -= amt;
  const d = dipOf(o,P);
  d.attitude = Math.min(100, d.attitude + amt/5);
  logMsg('You send '+amt+' gold to '+o.name+'.','good');
  showDiplo(); refreshAll();
}
function tryPeace(o){
  const P = G.me, d = dipOf(o,P);
  const mine = empirePower(P), theirs = empirePower(o);
  const willing = d.attitude > -55 && (mine > theirs*0.85 || rnd()<0.5) || theirs < mine*0.6;
  if(willing){ makePeace(P,o); queueBanner('Peace with '+o.name, 'the guns fall silent'); }
  else { logMsg(o.leader.n+' refuses peace.','war'); d.attitude -= 4; }
  showDiplo(); refreshAll(); markDirty();
}
function doDemand(o){
  const P = G.me, d = dipOf(o,P);
  const mine = empirePower(P), theirs = empirePower(o);
  const scared = mine > theirs*1.25 || d.attitude > 45;
  if(scared && o.gold >= 40){
    const amt = Math.min(o.gold, 40 + Math.round(o.gold*0.35));
    o.gold -= amt; P.gold += amt;
    d.attitude -= M(P,'tributeUp') ? 0 : 16;
    d.paidTribute = (d.paidTribute||0)+1;
    logMsg(o.name+' pays '+amt+' gold in tribute.','good');
    queueBanner(o.leader.n+' pays tribute', amt+' gold');
  } else {
    d.attitude -= M(P,'tributeUp') ? 4 : 22;
    d.refusedTribute = (d.refusedTribute||0)+1;
    logMsg(o.leader.n+' refuses your demand, and remembers it.','war');
    if(d.attitude < -60 && rnd()<0.35) declareWar(o,P);
  }
  showDiplo(); refreshAll(); markDirty();
}
/* the AI's own approaches to the human */
function demandTributeFromPlayer(P){
  const amt = Math.min(G.me.gold, 40 + G.turn*2);

/* ============================================================================
   Part 7: selection, input, starting a run, the loop.
   ==========================================================================*/

/* ---------- selection ----------------------------------------------------- */
function computeSel(){
  const u = UI.selUnit;
  UI.reach = null; UI.targets = []; UI.sites = null;
  if(!u || u.dead || u.owner !== G.me.id) return;
  if(u.mv > 0) UI.reach = reachable(u);
  const P = G.me, d = UNITS[u.type];
  if(d.cls==='settler'){
    /* show where a city may legally stand, so the first expansion is not a guess */
    UI.sites = [];
    if(P.cities.length < cityCap(P)){
      for(const t of tilesInRange(u.q, u.r, 7)){
        if(!hasSeen(P,t)) continue;
        if(canFoundHere(P, t)) UI.sites.push(t);
      }
    }
    return;
  }
  UI.sites = null;
  const rng = unitRange(u);
  const scan = rng ? tilesInRange(u.q,u.r,rng) : nbrs(u.q,u.r);
  for(const t of scan){
    const dist = hexDist(u.q,u.r,t.q,t.r);
    if(dist===0) continue;
    if(!rng && dist>1) continue;
    if(rng && dist<1) continue;
    if(!canSee(P,t)) continue;
    const foe = milAt(t) || civAt(t);
    if(foe && atWar(P, G.players[foe.owner])) UI.targets.push(t);
    else if(t.city && t.city.owner!==P.id && atWar(P, G.players[t.city.owner])){
      if(rng || d.cls!=='ranged') UI.targets.push(t);
    }
  }
  if(u.mv<=0) UI.targets = [];
}
function selectUnit(u){
  if(u !== UI.selUnit) sfx('select');
  UI.selUnit = u; UI.selCity = null; UI.path = null;
  computeSel(); refreshAll(); markDirty();
}
function selectCity(c){
  UI.selCity = c; UI.selUnit = null; UI.reach=null; UI.targets=[]; UI.path=null;
  refreshAll(); markDirty();
}
function clearSel(){
  UI.selUnit=null; UI.selCity=null; UI.reach=null; UI.targets=[]; UI.path=null;
  refreshAll(); markDirty();
}
function idleUnits(){
  return G.me.units.filter(u=>!u.dead && !u.done && !u.sleep && u.mv>0
    && !(UNITS[u.type].cls==='settler' && u.goto));
}
function nextUnit(){ selectNextUnit(false); }
function selectNextUnit(auto){
  if(auto) resumeOrders(G.me);
  const list = idleUnits();
  if(!list.length){ if(auto) clearSel(); else { UI.selUnit=null; refreshAll(); markDirty(); } return false; }
  const cur = UI.selUnit;
  let i = cur ? list.indexOf(cur) : -1;
  const u = list[(i+1) % list.length];
  selectUnit(u);
  const t = T(u.q,u.r);
  const px = wx(t), py = wy(t);
  if(px<120 || px>W-260 || py<90 || py>H-140) centreOn(u.q,u.r);
  return true;
}
function resumeOrders(P){
  for(const u of P.units.slice()){
    if(u.dead || !u.goto) continue;
    const tgt = T(u.goto.q, u.goto.r);
    if(!tgt){ u.goto=null; continue; }
    if(u.q===tgt.q && u.r===tgt.r){ u.goto=null; continue; }
    const path = pathTo(u, tgt);
    if(!path){ u.goto=null; continue; }
    let moved=false;
    for(const k of path){
      if(u.mv<=0) break;
      const t = G.tiles.get(k);
      if(blockedBy(u,t)) { u.goto=null; break; }
      if(!stepUnit(u,t)) { u.goto=null; break; }
      moved = true;
      /* stop the moment anything hostile comes into view */
      if(nbrs(u.q,u.r).some(n=>{
          const f = milAt(n); return f && atWar(P, G.players[f.owner]); })){ u.goto=null; break; }
    }
    if(moved && u.q===tgt.q && u.r===tgt.r) u.goto=null;
    if(u.goto) u.done = true;
    if(UNITS[u.type].cls==='settler' && !u.goto && canFoundHere(P, T(u.q,u.r))) u.done=false;
  }
}

/* ---------- issuing orders ------------------------------------------------ */
function orderTo(u, t){
  const P = G.me;
  /* attack? */
  if(UI.targets.includes(t)){
    const rng = unitRange(u);
    const dist = hexDist(u.q,u.r,t.q,t.r);
    if(rng && dist>1) rangedAttack(u,t);
    else if(dist===1) meleeAttack(u,t);
    else {
      const path = pathTo(u,t);
      if(path && path.length>1){ walkPath(u, path.slice(0,-1)); if(hexDist(u.q,u.r,t.q,t.r)===1 && u.mv>0) meleeAttack(u,t); }
    }
    if(!u.dead && u.mv<=0) u.done = true;
    computeSel(); refreshAll(); markDirty();
    if(!u.dead && u.mv<=0) setTimeout(()=>{ if(UI.selUnit===u) nextUnit(); }, 260);
    return;
  }
  if(t.city && t.city.owner===P.id && t.q===u.q && t.r===u.r){ selectCity(t.city); return; }
  if(u.q===t.q && u.r===t.r) return;
  /* move */
  const path = pathTo(u, t);
  if(!path){ sfx('deny'); fxText(T(u.q,u.r), 'no route', '#e0736a'); markDirty(); return; }
  walkPath(u, path);
  if(u.q!==t.q || u.r!==t.r){ u.goto = {q:t.q, r:t.r}; u.done = true; }
  else u.goto = null;
  computeSel(); refreshAll(); markDirty();
  if(u.mv<=0 || u.goto) { u.done = true; setTimeout(()=>{ if(UI.selUnit===u) nextUnit(); }, 200); }
}
function walkPath(u, path){
  for(const k of path){
    if(u.mv<=0) break;
    const t = G.tiles.get(k);
    if(!t || blockedBy(u,t)) break;
    if(!stepUnit(u,t)) break;
    u.movedThisTurn = true;
  }
}

});
window.addEventListener('mousemove', e=>{
  if(drag){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy) > 5) dragMoved = true;
    if(dragMoved){
      CAM.x = drag.cx - dx/sc(); CAM.y = drag.cy - dy/sc();
      clampCam(); markDirty(); hideTip();
    }
    return;
  }
  if(modalOpen()){ hideTip(); return; }
  const t = screenToHex(e.clientX, e.clientY);
  if(t !== UI.hover){
    UI.hover = t;
    UI.path = null;
    const u = UI.selUnit;
    if(u && !u.dead && t && u.mv>0 && !UI.targets.includes(t) && hasSeen(G.me,t)){
      const p = pathTo(u,t);
      if(p && p.length) UI.path = p.slice(0, 24);
    }
    markDirty();
  }
  if(t){ showTip(tileTip(t), e.clientX, e.clientY); } else hideTip();
});
window.addEventListener('mouseup', e=>{
  if(!drag) return;
  const wasDrag = dragMoved;
  drag = null;
  if(wasDrag || modalOpen()) return;
  handleClick(e.clientX, e.clientY);
});
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); if(!modalOpen()) clearSel(); });
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  if(modalOpen()) return;
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.13 : 1/1.13);
}, {passive:false});

function zoomAt(px, py, f){
  const before = screenPointToWorld(px,py);
  CAM.z = Math.max(0.40, Math.min(2.2, CAM.z*f));
  const after = screenPointToWorld(px,py);
  CAM.x += before.x - after.x; CAM.y += before.y - after.y;
  clampCam(); markDirty();
}
function screenPointToWorld(px,py){
  const s = sc();
  return {x:(px-W/2)/s + CAM.x, y:(py-H/2)/s + CAM.y};
}
function clampCam(){
  const lim = G.rad*1.9;
  CAM.x = Math.max(-lim, Math.min(lim, CAM.x));
  CAM.y = Math.max(-lim*0.85, Math.min(lim*0.85, CAM.y));
}
function handleClick(px, py){
  if(G.over || G.busy) return;
  const t = screenToHex(px,py);
  if(!t || !hasSeen(G.me,t)){ return; }
  const P = G.me, u = UI.selUnit;

  if(u && !u.dead && u.owner===P.id){
    /* clicking another of your own units on a different tile selects it */
    const own = t.units.find(x=>x.owner===P.id && x!==u);
    if(own && !UI.targets.includes(t) && (t.q!==u.q || t.r!==u.r)){
      if(!UI.reach || !UI.reach.has(t.k) || own){ selectUnit(own); return; }
    }
    orderTo(u, t);
    return;
  }
  /* nothing selected: pick something on this tile */
  const mine = t.units.filter(x=>x.owner===P.id);
  if(mine.length){
    const cur = UI.selUnit;
    const i = mine.indexOf(cur);
    selectUnit(mine[(i+1)%mine.length]);
    return;
  }
  if(t.city && t.city.owner===P.id){ selectCity(t.city); return; }
  clearSel();
}

/* minimap */
mcv.addEventListener('mousedown', e=>{
  const r = mcv.getBoundingClientRect();
  const k = mcv._k, ox = mcv._ox, oy = mcv._oy;
  if(!k) return;
  CAM.x = (e.clientX-r.left-ox)/k; CAM.y = (e.clientY-r.top-oy)/k;
  clampCam(); markDirty();
});

/* ---------- keyboard ------------------------------------------------------ */
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(modalOpen() && UI.modal!=='draft' && UI.modal!=='over' && UI.modal!=='start') closeModal();
    else if(!modalOpen()) clearSel();
    return;
  }
  if(modalOpen()) return;
  const k = e.key.toLowerCase();
  const pan = 1.4/CAM.z;
  if(k==='w'||e.key==='ArrowUp')    { CAM.y-=pan; clampCam(); markDirty(); e.preventDefault(); }
  else if(k==='s'&&e.shiftKey)      { }
  else if(k==='a'||e.key==='ArrowLeft'){ CAM.x-=pan; clampCam(); markDirty(); e.preventDefault(); }
  else if(k==='d'||e.key==='ArrowRight'){ CAM.x+=pan; clampCam(); markDirty(); e.preventDefault(); }
  else if(e.key==='ArrowDown')      { CAM.y+=pan; clampCam(); markDirty(); e.preventDefault(); }
  else if(k===' '){ e.preventDefault(); nextUnit(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(idleUnits().length && !e.shiftKey) nextUnit(); else endTurnNow(); }
  else if(k==='f'){ const u=UI.selUnit; if(u&&UNITS[u.type].cls!=='settler'){ u.fort=Math.max(1,u.fort); u.done=true; nextUnit(); } }
  else if(k==='s'){ const u=UI.selUnit; if(u){ u.sleep=true; u.done=true; nextUnit(); } else { CAM.y+=pan; clampCam(); markDirty(); } }
  else if(k==='b'){ if(UI.selCity) showBuildMenu(UI.selCity); else if(G.me.cities[0]) showBuildMenu(G.me.cities[0]); }
  else if(k==='c'){ const c=G.me.capital||G.me.cities[0]; if(c){ centreOn(c.q,c.r); selectCity(c); } }
  else if(k==='n'){ showDiplo(); }
  else if(k==='e'){ showEdicts(); }
  else if(k==='?'||k==='h'){ showHelp(); }
  else if(k==='+'||k==='='){ zoomAt(W/2,H/2,1.16); }
  else if(k==='-'||k==='_'){ zoomAt(W/2,H/2,1/1.16); }
});
$('endturn').onclick = ()=>{ if(idleUnits().length) nextUnit(); else endTurnNow(); };
$('b-cities').onclick = showCities;
$('b-diplo').onclick  = showDiplo;
$('b-edicts').onclick = showEdicts;
$('b-help').onclick   = showHelp;
$('b-sound').onclick  = audioToggle;
if(!AUDIO.on) $('b-sound').textContent = '\u{1F507}';

/* ---------- starting a run ------------------------------------------------ */
function showLeaderSelect(){
  const seed = (Math.random()*1e9)|0;
  RNG = mkRng(seed);
  const offered = shuffle(LEADERS.slice()).slice(0,3);
  let diff = 1;
  const cards = offered.map((L,i)=>
    '<div class="lcard" data-i="'+i+'">'
    + '<div class="lban" style="background:linear-gradient(90deg,'+L.col+','+L.col2+')"></div>'
    + '<div class="lin"><div class="lname">'+esc(L.n)+'</div><div class="lciv">'+esc(L.civ)+'</div>'
    + '<div class="ltrait"><b>'+esc(L.trait)+'</b><br>'+L.td+'</div>'
    + '<div class="luu"><b>'+esc(UNITS[L.uu].n)+'</b><br>'+esc(UNITS[L.uu].d)+'</div>'
    + '</div></div>').join('');
  const best = lsGet('rogueciv_best');
  openModal('RogueCiv',
    'A whole civilisation in one sitting: 100 turns, 6 Ages, 18 Edicts — and only one of every three offered to you.'
    + (best?'<br><span style="color:var(--gold2)">best run so far: '+best+'</span>':''),
    '<div class="leaders">'+cards+'</div>'
    + '<div style="text-align:center;margin-top:16px"><div class="lbl">Choose a world</div>'
    + '<div id="diffrow" style="display:flex;gap:6px;justify-content:center;margin-top:7px"></div>'
    + '<div id="diffdesc" style="font-size:11.5px;color:var(--dim);margin-top:7px;min-height:32px;max-width:460px;'
    + 'margin-left:auto;margin-right:auto;line-height:1.5"></div></div>',
    [{label:'How to play', fn:showHelp}], {id:'start'});

  const row = $('diffrow');
  const paint = ()=>{
    row.innerHTML='';
    DIFFS.forEach((D,i)=>{
      const b = actBtn(D.n, ()=>{ diff=i; paint(); }, diff===i?'gold':'');
      row.appendChild(b);
    });
    $('diffdesc').textContent = DIFFS[diff].d;
  };
  paint();
  for(const el of $('mbody').querySelectorAll('.lcard')){
    el.onclick = ()=>{ closeModal(); newRun(seed, offered[+el.dataset.i].id, diff); };
  }
}

function newRun(seed, leaderId, diff){
  G.seed = seed; G.difficulty = diff;
  RNG = mkRng(seed);
  G.turn = 1; G.over=false; G.busy=false; G.uid=1; G.log=[]; G.anim=[];
  G.wondersBuilt = {}; G.pendingDrafts = 0; G.players = [];
  $('log').innerHTML='';

  genMap(10);

  /* players: you, then rivals drawn from the leaders you were not offered */
  const me = newPlayer(0, leaderId, true);
  G.players.push(me); G.me = me;
  const rest = shuffle(LEADERS.filter(l=>l.id!==leaderId));
  for(let i=0;i<NUM_RIVALS;i++) G.players.push(newPlayer(i+1, rest[i].id, false));
  G.players.push(newBarbs(G.players.length));

  const spots = pickStarts(NUM_RIVALS+1);
  const civs = G.players.filter(p=>!p.barb);
  for(let i=0;i<civs.length;i++){
    const P = civs[i], t = spots[i];
    const c = foundCity(P, t, true);
    const gv = (type, civil) => { const s = freeSpotFor(P, t, civil); if(s) spawnUnit(P, realUnit(P,type), s.q, s.r); };
    gv('warrior', false);
    gv('scout', false);
    gv('settler', true);
    P.gold = 40;
    recomputeVision(P);
  }
  seedCamps();
  recomputeTerritory();
  for(const P of G.players) recomputeVision(P);
  for(const c of G.players.flatMap(p=>p.cities)) assignTiles(c);

  const cap = me.capital;
  me.cities[0].queue = {kind:'unit', id:realUnit(me,'warrior')};
  CAM.z = 1; centreOn(cap.q, cap.r);
  clearSel();
  logMsg('The '+me.leader.adj+' people settle at '+cap.name+'.', 'big');
  queueBanner(me.leader.n+' of '+me.name, AGES[0].name+' Age · turn 1 of '+MAX_TURNS);
  refreshAll(); markDirty();
  setTimeout(()=>selectNextUnit(false), 400);
}

/* spread the civilisations out over the good ground */
function pickStarts(n){
  const cands = G.list.filter(t=>{
    if(isWater(t)||ELEV[t.e].impass) return false;
    if(t.t==='snow') return false;
    return true;
  }).map(t=>({t, s:siteScore(null,t) + hash2(t.q,t.r)*6}));
  cands.sort((a,b)=>b.s-a.s);
  const out=[];
  const minD = Math.max(5, Math.round(G.rad*0.85));
  for(let relax=0; relax<6 && out.length<n; relax++){
    const need = minD - relax;
    for(const {t} of cands){
      if(out.length>=n) break;
      if(out.some(o=>hexDist(o.q,o.r,t.q,t.r) < need)) continue;
      if(out.includes(t)) continue;
      out.push(t);
    }
    if(out.length<n) out.length = 0;
    else break;
  }
  while(out.length<n){
    const t = cands[out.length*7 % cands.length].t;
    if(!out.includes(t)) out.push(t); else out.push(cands[out.length].t);
  }
  return shuffle(out).slice(0,n);
}
/* ---------- loop ---------------------------------------------------------- */
let frameMs = 0;
function loop(ts){
  const need = DIRTY || G.anim.length || UI.selUnit;
  if(need){
    const t0 = performance.now();
    draw();
    frameMs = frameMs*0.9 + (performance.now()-t0)*0.1;
    DIRTY = false;
  }
  requestAnimationFrame(loop);
}

/* ---------- boot ---------------------------------------------------------- */
resize();
requestAnimationFrame(loop);
showLeaderSelect();

/* a small hook so the game can be driven headlessly for testing */
window.RC = {
  G, UI, CAM,
  newRun, endTurnNow, runTurn, draw, T, hexDist, tileYield, cityYield, empireRates,
  btCost, scoreOf, unitStr, combatOdds, dmgRoll, EDICTS, UNITS, STRUCTS, WONDERS, LEADERS,
  AGES, RES, TERRA, foodNeeded, unitCost, structCost, wonderCost, draftPool, takeEdict,
  AUDIO, sfx, audioToggle,
  grantProgress, militaryPower, empirePower, buildOptions, pathTo, reachable, siteScore,
  shade, parseCol, drawTerrain, spawnUnit, killUnit, tilesInRange, meleeAttack,
  selectUnit, selectCity, clearSel, orderTo, doFound, canFoundHere, idleUnits,
  resumeOrders, computeSel, nextUnit, selectNextUnit, buyCost, upgradeFor,
  upgradeCost, doUpgrade, tileTip, assignTiles, showBuildMenu, showDiplo,
  showCities, showEdicts, showHelp, showDraft, closeModal, refreshAll,
  foundCity, itemCost, cityCap, hasRes, unitAvailable, realUnit, milAt, civAt,
  recomputeVision, recomputeTerritory, moveCost, canEnter, blockedBy, stepUnit, rangedAttack, cityDefStr, unitMoves, foundCity, declareWar, aiTurn,
  get frameMs(){ return frameMs; },
  get tiles(){ return G.list; }
};
