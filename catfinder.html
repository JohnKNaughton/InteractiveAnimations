<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 Cat Finder — Nana Plum's Picnic</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:Georgia, "Palatino Linotype", "Segoe UI", serif;
    background:linear-gradient(160deg,#dff0e4 0%, #fdf3dd 60%, #fbe3cf 100%);
    color:#4a4238; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:12px;
  }
  h1{font-size:26px; color:#6a5a48; margin:2px 0;}
  h1 small{font-size:14px; color:#a08a72; font-style:italic;}
  #topbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
    background:#fffdf7ee; border-radius:16px; padding:8px 16px; margin:8px 0;
    box-shadow:0 3px 14px #0001;
  }
  #paws{display:flex; gap:6px;}
  #levels{display:flex; gap:5px;}
  .lvl{
    width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:#fffdf7; font-size:17px; cursor:pointer; border:2px solid #e5d9c5;
    transition:all .25s;
  }
  .lvl:hover:not(.locked){transform:translateY(-2px); background:#fdf2dd;}
  .lvl.active{border-color:#d9a84a; background:#fdf0d0; box-shadow:0 2px 8px #d9a84a44;}
  .lvl.locked{filter:grayscale(1) opacity(.4); cursor:default;}
  .lvl.done::after{content:'✓'; position:absolute; margin-top:-26px; margin-left:24px; font-size:10px; color:#7aa86a; font-weight:bold;}
  .paw{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:#eee5d8; font-size:16px; filter:grayscale(1) opacity(.45);
    transition:all .4s; cursor:default; border:2px solid transparent;
  }
  .paw.found{filter:none; background:#fff; border-color:#e8c98a; cursor:pointer; transform:scale(1.08);}
  #progressTxt{font-size:14px; color:#8a7a64; min-width:120px; text-align:center;}
  button{
    font-family:inherit; font-size:14px; padding:6px 12px; border-radius:12px;
    border:2px solid #e5d9c5; background:#fffdf7; color:#5a4a3a; cursor:pointer;
    transition:transform .1s, background .2s;
  }
  button:hover:not(:disabled){background:#fdf2dd; transform:translateY(-1px);}
  button:disabled{opacity:.5; cursor:default;}
  #stage{position:relative; border-radius:18px; overflow:hidden; box-shadow:0 10px 36px #0002; line-height:0;}
  canvas#scene{max-width:min(96vw,1000px); height:auto; display:block;}
  footer{font-size:12px; color:#a89880; margin-top:10px; font-style:italic;}
  /* card + overlays */
  #overlay{
    position:fixed; inset:0; background:#3a2f2466; display:none;
    align-items:center; justify-content:center; z-index:60; padding:16px;
  }
  #overlay.show{display:flex;}
  #card{
    background:linear-gradient(180deg,#fffdf7,#fdf4e3);
    border-radius:22px; padding:26px 30px; max-width:520px; width:100%;
    box-shadow:0 14px 50px #0005; text-align:center;
    animation:pop .4s cubic-bezier(.2,1.4,.4,1); max-height:90vh; overflow-y:auto;
    border:3px solid #f0e2c8;
  }
  @keyframes pop{from{transform:scale(.65); opacity:0;} to{transform:scale(1); opacity:1;}}
  #card h2{font-size:26px; color:#6a5240; margin:6px 0 0;}
  #card .title{color:#b08a5a; font-style:italic; font-size:15px; margin-bottom:8px;}
  #card p{font-size:15px; line-height:1.65; margin:10px 0; text-align:left; color:#5a4c3c;}
  #card .fact{
    background:#f3ead7; border-radius:14px; padding:12px 14px; font-size:14px;
    text-align:left; border-left:4px solid #d9b87a; line-height:1.6;
  }
  #card .fact b{color:#9a7a3a;}
  #card button{font-size:16px; padding:10px 22px; margin-top:14px; background:#e9d7ae; border-color:#d9c08a;}
  #portraitWrap{display:flex; justify-content:center;}
  canvas#portrait{background:radial-gradient(circle at 50% 36%, #fff8e8, #f3e6cc); border-radius:50%; border:3px solid #ecd9b4;}
  .rules{text-align:left; font-size:14.5px; line-height:1.7; color:#5a4c3c;}
  .rules li{margin:6px 0 6px 20px;}
</style>
</head>
<body>
<h1>🐾 Cat Finder <small id="subtitle">— nine friends are hiding near Nana Plum's cottage</small></h1>
<div id="topbar">
  <div id="levels"></div>
  <div id="paws"></div>
  <span id="progressTxt">0 / 9 friends found</span>

  <button id="musicBtn" title="Music on/off">🎵</button>
  <button id="sfxBtn" title="Sounds on/off">🔊</button>

<div id="overlay"><div id="card"></div></div>

<script>
'use strict';
/* ==========================================================
   CAT FINDER — a gentle hidden-cat game.
   Nine cats are hiding around Nana Plum's cottage. Find them
   and they'll gather on the picnic blanket... it turns out
   they were all waiting for her birthday party to begin.
   ========================================================== */
const IS_TEST = (typeof window!=='undefined') && window.__CF_TEST===true;

// ---------- helpers ----------
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpColor(c1,c2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
function nowMs(){ return (typeof performance!=='undefined'&&performance.now)? performance.now():Date.now(); }
const VW=960, VH=600;

// ---------- the cats ----------
const CATS=[
  {name:'Mochi', title:'The Flowerbed Dreamer', pattern:'solid', base:'#f3e9dc', dark:'#e2d2bd', eye:'#7aa86a', collar:'#e8a0b0',
   story:`Mochi arrived on a stormy night three springs ago, a soggy little cloud of a cat mewing at the cottage door. Nana Plum set out a saucer of warm milk and an old wool sock, and by morning Mochi had decided this was home forever. She sleeps among the tulips because they smell like that first kind morning.`,
   fact:`Cats purr at frequencies between about 25 and 150 Hz — a range studies suggest may promote bone and tissue healing. A purring cat on your lap is, quite literally, a tiny therapy machine.`},
  {name:'Biscuit', title:'The Roof Loafer', pattern:'tabby', base:'#e8a35c', dark:'#c97f3d', eye:'#c98a2a', collar:'#7aa86a',
   story:`Every dawn, Biscuit climbs to the rooftop to supervise the sunrise, kneading the chimney-warmed shingles with great seriousness — Nana calls it "making the morning biscuits." He shares the warmest spot with a family of sparrows. They have an understanding, and it is sacred.`,
   fact:`Around 4 out of 5 orange tabby cats are male, thanks to the way the orange fur gene rides on the X chromosome. Biscuit considers himself one of the lucky ones.`},
  {name:'Juniper', title:'The Tree Philosopher', pattern:'solid', base:'#9aa3ad', dark:'#7f8893', eye:'#d9c04a', collar:'#5a7a96',
   story:`Juniper spent her younger years as a ship's cat and crossed three seas before retiring to the old oak. Now she naps on the high branch where the leaves move like waves, and on quiet evenings she tells the kittens long stories about lighthouses and the moths that love them.`,
   fact:`Cats have more than 30 muscles in each ear and can swivel them about 180 degrees — which is how Juniper hears the biscuit tin open from the top of a tree.`},
  {name:'Captain Pickles', title:'The Pond Admiral', pattern:'tuxedo', base:'#3a3f4a', dark:'#2c3038', eye:'#7fc77a', collar:'#d9534f',
   story:`Captain Pickles has stood guard over the pond for six proud years. He has never once caught a fish, and if he did he would have absolutely no idea what to do next. The koi know this. They drift up to visit him every afternoon, and he salutes each one by name.`,
   fact:`A cat's whiskers can detect air movements smaller than a millimeter, helping them sense nearby objects in the dark — or notice a koi surfacing without even looking.`},
  {name:'Clementine', title:'The Meadow Matchmaker', pattern:'calico', base:'#f5efe4', dark:'#e8964f', dark2:'#4a4440', eye:'#c98a2a', collar:'#e8c84a',
   story:`Clementine patrols the tall grass making sure every bumblebee finds its way to a flower. She once spent an entire afternoon escorting a lost duckling back to the pond, walking exactly slow enough for tiny webbed feet. The meadow has been noticeably happier ever since she took the job.`,
   fact:`Nearly all calico cats — about 999 in 1000 — are female. Their patchwork coats need two X chromosomes, which makes boys like a winning lottery ticket.`},
  {name:'Umbra', title:'The Window Librarian', pattern:'solid', base:'#37343f', dark:'#2a2832', eye:'#e8b84a', collar:'#9a7ab0',
   story:`Umbra lives on the windowsill beside Nana's bookshelf and takes her duties as librarian very seriously. She sits on whichever book you ought to read next, and she is somehow always right. Late at night, she watches over the cottage while everyone dreams, which she considers the most important shelf of all.`,
   fact:`A black cat's fur can "rust" into a reddish-brown in strong sunshine as the pigment breaks down — Umbra's summer highlights are entirely natural and very fashionable.`},
  {name:'Poppy', title:'The Tiny Gardener', pattern:'bicolor', base:'#f0b070', dark:'#f5efe4', eye:'#6a9ad0', collar:'#7aa86a', kitten:true,
   story:`Poppy is the youngest by far, and she is convinced the watering can is a sleeping dragon that she alone has tamed. Every morning she headbutts it until it tips, watering exactly one daisy. That daisy is now the tallest flower in the garden, and Poppy takes full credit.`,
   fact:`Kittens sleep up to 20 hours a day — growing happens mostly during sleep. Poppy is not lazy; she is extremely busy becoming a cat.`},
  {name:'Earl Grey', title:'The Mail Inspector', pattern:'solid', base:'#b9c2cc', dark:'#9aa6b2', eye:'#c97a4a', collar:'#4a6a8a',
   story:`Earl Grey meets the mail carrier at the gate every morning at 9:02 sharp, and inspects each envelope with one solemn sniff. He receives more postcards than anyone in the village — though it took Nana years to discover the mail carrier had been writing them himself, one for every birthday and rainy day.`,
   fact:`When a cat looks at you and blinks slowly, it's a sign of trust — a "cat kiss." If you slow-blink back at Earl Grey, he will absolutely return it. Try it with a cat you know.`},
  {name:'Waffles', title:'The Pastry Guard', pattern:'bicolor', base:'#b58a64', dark:'#f5efe4', eye:'#8a7a4a', collar:'#d98a3a',
   story:`Waffles guards Nana's cooling pies from the crows with tremendous dignity. There was, admittedly, the Incident — he fell asleep mid-shift and woke to find a crow holding a strawberry. After a long staring contest, they split it. He and that crow now share a strawberry every Sunday, and the pies remain officially untouched.`,
   fact:`Cats can't taste sweetness at all — they're missing part of the gene for sweet receptors. Waffles guards the pie purely out of loyalty, which somehow makes it more noble.`},
];

// ---------- guest cats (each adventure has two locals who join the crew) ----------
const GUESTS={
  coco:{name:'Coco', title:'The Wave Rider', pattern:'bicolor', base:'#8a6248', dark:'#f2e8d8', eye:'#5a9ad0', collar:'#f0c84a',
    story:`Coco lives under the lifeguard chair and is the only cat anyone has ever seen surf — belly-down on a boogie board, absolutely thrilled, absolutely soaked. The lifeguards gave her an honorary whistle. She can't blow it, but she wears it with enormous pride.`,
    fact:`Most cats avoid water, but the Turkish Van is famous for swimming happily — it's nicknamed "the swimming cat." Coco insists she taught them everything they know.`},

    story:`Pearl keeps a museum of seashells arranged by prettiness along the tide line, and she rearranges it every single morning because the sea keeps donating new pieces. If you sit beside her quietly, she will present you with one shell. It will be the third-prettiest. She keeps the top two.`,
    fact:`Cats sweat only through their paw pads — which is why a nervous cat leaves tiny damp pawprints on the vet's table, and why beach sand feels so interesting underfoot.`},
  edel:{name:'Edelweiss', title:'The Summit Fluff', pattern:'solid', base:'#f5f2ec', dark:'#e2dcd0', eye:'#8ab060', collar:'#d9534f',
    story:`Edelweiss lives above the tree line and has never once been cold, because she is roughly 80% fur. Hikers who reach the summit find her already there, looking mildly surprised they took so long. Nobody has ever seen her climb. The marmots believe she simply appears.`,
    fact:`A cat's righting reflex lets it twist mid-air to land feet-first, and it works from heights as low as about 30 centimeters — a skill Edelweiss files under "obviously."`},
  strudel:{name:'Strudel', title:'The Hut Keeper', pattern:'tabby', base:'#d99a54', dark:'#b57838', eye:'#8a7a4a', collar:'#7aa86a',
    story:`Strudel manages the alpine hut: he inspects every boot, naps on every bunk exactly once for quality control, and sits by the stove where the apple strudel cools. The hut keeper says the strudel is safe with him. The hut keeper has never checked the whipped cream. Nobody should check the whipped cream.`,
    fact:`Cats knead with their paws — "making biscuits" — because kittens knead to get milk flowing. Adult cats keep doing it wherever they feel safest, like stoveside blankets in mountain huts.`},
  denali:{name:'Denali', title:'The Quiet Watcher', pattern:'solid', base:'#8a929e', dark:'#6f7883', eye:'#d9c04a', collar:'#4a6a8a',
    story:`Denali has watched over this stretch of river since she was a kitten, and she knows everything: where the moose crosses, when the salmon run, which cloud means snow. She says almost nothing. But if you're about to sit on the wet log, she will look at you until you choose the dry one.`,
    fact:`When it's cold, cats fluff up their fur to trap a layer of warm air against their skin — the same trick puffy jackets use. Denali is, essentially, wearing a down parka she grew herself.`},
  sockeye:{name:'Sockeye', title:'The Salmon Scholar', pattern:'tabby', base:'#e08a4a', dark:'#b8662e', eye:'#7fc77a', collar:'#d9534f',
    story:`Sockeye has spent four summers studying the salmon as they leap the rapids, taking careful mental notes. He has concluded that they are magnificent, that they are extremely bad at being caught, and that this is probably fine. The salmon leap a little higher when he's watching. Everyone likes an audience.`,
    fact:`A cat's sense of smell is around 14 times stronger than a human's — Sockeye can tell which bend of the river the salmon are passing without opening his eyes.`},
  feta:{name:'Feta', title:'The Taverna Greeter', pattern:'bicolor', base:'#f2ede4', dark:'#9aa3ad', eye:'#c98a2a', collar:'#5a7a96',
    story:`Feta has greeted every guest at the taverna for nine years, escorting them to their chairs with the confidence of someone who owns the building. She accepts payment in sardines and chin scratches. The taverna keeper calls her "the manager." He is only partly joking — she did once reject a rowdy seagull's reservation.`,
    fact:`The Aegean cat of the Greek islands is one of the oldest natural cat breeds in the world — island cats who have greeted fishermen at the docks for thousands of years.`},
  odie:{name:'Odysseus', title:'The Harbor Legend', pattern:'tabby', base:'#a8977a', dark:'#82705a', eye:'#d9c04a', collar:'#b06a3a',
    story:`Odysseus — Odie to friends — sailed with the fishing fleet for ten years and knows every island by smell alone. He retired to the harbor wall, where he tells the young cats about the storm of the great October, which grows greater every telling. The fishermen still salute him. The sea, he says, salutes back.`,
    fact:`Cats have sailed with people for thousands of years as ship's cats, guarding grain from mice — it's one of the ways cats spread to nearly every corner of the world.`},
  bramble:{name:'Bramble', title:'The Honorary Bear', pattern:'tabby', base:'#9a7a54', dark:'#7a5c3c', eye:'#c98a2a', collar:'#d98a3a',
    story:`Bramble was raised alongside the bear cubs and is fully convinced she is one. She fishes like a bear (badly), naps like a bear (magnificently), and every autumn she gets very serious about eating berries "for the long sleep." She has never once hibernated. Every spring she claims she did.`,
    fact:`Cats sleep 12 to 16 hours a day and spend roughly 70% of their lives asleep — so while cats don't truly hibernate, Bramble's "practice" is genuinely world-class.`},
  huck:{name:'Huckleberry', title:'The Berry Sommelier', pattern:'solid', base:'#4a4038', dark:'#38302a', eye:'#e8b84a', collar:'#7aa86a',
    story:`Huckleberry can identify seventeen kinds of berry by scent alone, and he rates each bush every morning with one long, thoughtful sniff. The bears wait for his verdict before breakfast. When he makes his funny open-mouthed face at a bush, the bears know: today, that one's the good one.`,
    fact:`That open-mouthed face cats make is the flehmen response — they're pulling scent over a special organ in the roof of the mouth (the Jacobson's organ) to "taste" a smell.`},
};

// of nine cats (core crew + two locals), fresh stories, and its own finale.
const SPOTS_COTTAGE=[

  {id:'chimney', x:828, y:200, r:36, peek:'tail', ps:1.0,  hint:'up where the chimney smoke curls'},

  {id:'grass',   x:520, y:436, r:36, peek:'ears', ps:0.95, hint:'low in the tall meadow grass'},
  {id:'flowers', x:716, y:430, r:36, peek:'back', ps:1.0,  hint:'snoozing in the flower bed'},
  {id:'bush',    x:924, y:364, r:38, peek:'ears', ps:1.0,  hint:'behind the big berry bush'},
  {id:'mailbox', x:560, y:372, r:30, peek:'face', ps:0.85, hint:'peeking past the mailbox'},

const SEATS=[[72,-12],[100,14],[42,24],[126,-16],[16,-4],[148,22],[64,46],[112,50],[-46,16]];
const core=names=>names.map(n=>CATS.find(c=>c.name===n));

const LEVELS=[
{ id:'cottage', emoji:'🏡', name:"Nana Plum's Picnic", sub:'— nine friends are hiding near the cottage',
  roster:CATS, spots:SPOTS_COTTAGE, gather:{x:152,y:543}, paint:paintCottage,
  bannerText:'Happy Birthday, Nana Plum! 🎂',
  intro:`Nine cats are hiding around Nana Plum's cottage — watch for a flick of a tail or the tips of two ears. They seem to be waiting for something...`,
  finale:{title:'🎂 Surprise!', sub:`So that's why they were hiding...`,
    text:`The cats weren't lost at all — they were waiting for the signal. Today is <b>Nana Plum's birthday</b>, and not one of her nine friends forgot. As the sun melts into the pond, the kettle sings, the cake is cut (Waffles inspects it, out of loyalty), and nine warm little bodies settle around the blanket like the happiest constellation.`},
},
{ id:'beach', emoji:'🏐', name:'Volleyball Cove', sub:'— the crew is hiding somewhere sandy',
  roster:[...core(['Mochi','Biscuit','Juniper','Captain Pickles','Clementine','Poppy','Waffles']), GUESTS.coco, GUESTS.pearl],
  spots:[
    {id:'palm',      x:96,  y:158, r:36, peek:'ears', ps:1.0,  hint:'up in the palm fronds'},
    {id:'lifeguard', x:856, y:296, r:34, peek:'tail', ps:1.0,  hint:'dangling from the lifeguard chair'},
    {id:'umbrella',  x:262, y:437, r:36, peek:'back', ps:1.0,  hint:'snoozing in the umbrella shade'},
    {id:'castle',    x:700, y:474, r:32, peek:'face', ps:0.9,  hint:'peeking over the sandcastle'},
    {id:'cooler',    x:150, y:497, r:30, peek:'ears', ps:0.9,  hint:'behind the picnic cooler'},

    {id:'dunegrass', x:928, y:496, r:34, peek:'ears', ps:1.0,  hint:'low in the dune grass'},
    {id:'boat',      x:812, y:520, r:34, peek:'tail', ps:1.0,  hint:'under the old rowboat'},
    {id:'balls',     x:600, y:432, r:28, peek:'ears', ps:0.8,  hint:'behind the basket of volleyballs'},
  ],
  gather:{x:150,y:548}, paint:paintBeach,
  bannerText:'Sunset match! Cats 9 — Seagulls 0 🏐',
  intro:`Nana Plum brought everyone to the seaside — but at match time, the whole team vanished. Look carefully: sand-colored fur hides well on a beach.`,
  stories:{
    'Mochi':`Mochi discovered that beach sand is warm like the flowerbed but infinitely diggable, and she has been quietly digging the world's most comfortable nap-bowl all morning. She'd tell you where it is, but then it wouldn't be the quietest spot on the beach anymore.`,
    'Biscuit':`Biscuit found the one place on the beach with rooftop energy — high up, sun-warmed, excellent supervision angles. He is keeping score of the seagulls' warm-up drills and is unimpressed. His notes say, in their entirety: "no discipline."`,
    'Juniper':`The sea again, after all these years. Juniper watched the waves for one long hour and then found a lookout, the way she always did aboard ship. She says the ninth wave is always the big one. The kittens counted. She's right unsettlingly often.`,
    'Captain Pickles':`Captain Pickles marched straight to the water's edge, saluted the entire ocean, and declared it "an acceptably large pond." He has been inspecting the tide pools all morning and has met a crab. Negotiations are ongoing. The crab is winning.`,
    'Clementine':`Clementine appointed herself safety officer of the volleyball court, escorting every wayward hermit crab out of the play zone with the patience of a saint. Then she found a shadier post. Even matchmakers need a moment's peace — the hermit crabs know where to find her.`,
    'Poppy':`Poppy met the ocean today. She pounced on a wave, and the wave pounced back, and after some very intense negotiating from a safe distance they have agreed to be friends. She is now guarding her spot and keeping one eye on the sea, in case it tries anything affectionate again.`,
    'Waffles':`Someone has to guard the picnic, even at the beach — especially at the beach, because his old rival's cousins are everywhere, eyeing the sandwiches. Waffles chose a post with sightlines to the cooler. A gull drifted by and nodded. He nodded back. There is a code.`,
  },
  finale:{title:'🏐 The Sunset Match!', sub:`So that's why they were hiding...`,
    text:`They weren't hiding at all — they were <b>stretching</b>. The moment the ninth cat is found, the sun dips low, the net casts a long golden shadow, and the great Sunset Match begins: cats versus seagulls, best of one, no rules anyone can explain. Nana Plum referees from her beach chair with a lemonade. The cats win, as they do every year, because the seagulls always get distracted by someone's chips.`},
},
{ id:'alps', emoji:'⛰️', name:'Switchback Trail', sub:'— friends are hiding along the mountain path',
  roster:[...core(['Mochi','Biscuit','Juniper','Clementine','Umbra','Poppy','Earl Grey']), GUESTS.edel, GUESTS.strudel],
  spots:[
    {id:'pine',      x:140, y:298, r:36, peek:'ears', ps:1.0,  hint:'high in the old pine'},
    {id:'hutwin',    x:801, y:262, r:30, peek:'face', ps:0.95, hint:'in the window of the alpine hut'},
    {id:'signpost',  x:392, y:404, r:30, peek:'face', ps:0.9,  hint:'peeking past the trail signpost'},
    {id:'cairn',     x:622, y:360, r:32, peek:'ears', ps:0.95, hint:'behind the stone cairn'},
    {id:'boulder',   x:60,  y:455, r:34, peek:'tail', ps:1.0,  hint:'by the boulder at the stream'},
    {id:'flowers',   x:462, y:468, r:36, peek:'back', ps:1.0,  hint:'dozing in the alpine flowers'},

  bannerText:'Summit reached — go Nana go! ⛰️',
  intro:`Nana Plum is running her first mountain trail race (a gentle one, with tea stops). Her cheering squad has hidden along the switchbacks... find them before she reaches the top!`,

  stories:{
    'Mochi':`It is very quiet here — quieter than the flowerbed, quieter than anywhere. Mochi found a spot where she can hear the river talking to itself and has decided this is what the inside of a purr sounds like. She is memorizing it to bring home.`,
    'Juniper':`Juniper knew a ship's cat from Alaska once, who swore the sky here comes alive at night in green and violet. Juniper called it a tall tale for forty years. She has come all this way, and picked her waiting spot, to tell him sorry — properly, to the sky itself.`,
    'Captain Pickles':`The river guards itself, technically, but Captain Pickles has volunteered for the post anyway. There are fish here the size of small dogs and they LEAP, which the koi never once did. He has saluted so many salmon today that his paw is tired. He regrets nothing.`,

    'Earl Grey':`No mail comes here — Earl Grey checked, twice, with mounting concern. Then a bush plane droned over the ridge and dropped a canvas sack by the cabin, and his whole world clicked back into place. Airmail. ACTUAL airmail. He has been at his new post ever since, watching the sky.`,

  finale:{title:'🌌 The Sky Dances!', sub:`So that's why they were hiding...`,

  intro:`A white village above a blue, blue sea. Feta the taverna cat is planning something for tonight, and the whole crew is in on it. Find them among the domes and doorways!`,
  stories:{
    'Mochi':`Every wall in this village is warm — Mochi checked, thoroughly, wall by wall, which took most of the morning and counts as work. She has found the warmest one and melted onto it like butter on toast. The locals stepped around her. They understand completely.`,
    'Biscuit':`An entire village of rooftops. Biscuit walked up the first staircase he found and has not touched the ground since — it's all connected, roof to wall to dome, a kingdom of warm white shingles. He has supervised four laundry lines and one napping fisherman. Best rooftops of his career.`,

    'Clementine':`Clementine found the village kittens within the hour and has organized them into a tour company: this alley for sunbeams, that step for sardine deliveries, the fountain at four when the swallows come down to drink. She's already matched two lonely old cats with two lonely old fishermen. She works fast.`,

    'Earl Grey':`The mail here arrives by BOAT, at 9:02, which Earl Grey regards as the single most civilized fact he has ever learned. He has already befriended the ferryman and inspected today's post — one solemn sniff each. Three letters smelled of lemons. He approved them all.`,
    'Waffles':`They cool pastries on windowsills here — in the open, undefended, like an act of faith. Waffles has appointed himself to the honey-cake watch, and the baker has already started leaving him a corner piece as wages. He can't taste the sweetness. He guards it anyway. That's the job.`,

  finale:{title:'🫒 The Name-Day Feast!', sub:`So that's why they were hiding...`,
    text:`Tonight is Feta's <b>name day</b>, and in this village a name day means everyone you love at one long table. The cats spent all afternoon "hiding" — which is to say, borrowing lanterns, herding musicians, and escorting the honey cakes to safety. As the sun drops into the Aegean, Odysseus's old crew sails in with a crate of sardines, the lanterns come on all at once, and the taverna keeper pushes the tables together. Opa! Even the seagulls behave. Mostly.`},

function LV(){ return LEVELS[S.level]; }
function SP(){ return LV().spots; }
function GATHER(){ return LV().gather; }
const BLANKET=LEVELS[0].gather;   // kept for the cottage painter

// ---------- state ----------
const S={
  seed:0, rng:Math.random, assign:[], found:[], sprites:[], clicks:0, hintsUsed:0,
  complete:false, bannerT:0, lastCard:null, sparkle:null, petals:[], puffs:[],
  musicOn:true, sfxOn:true, hintReadyAt:0, finaleShown:false,
  level:0, unlocked:1, beaten:[],
};
const START_UNLOCKED=3;   // three adventures open from the start; each win opens another
function unlockCount(){ return clamp(START_UNLOCKED+S.beaten.length, START_UNLOCKED, LEVELS.length); }
function loadProgress(){
  try{
    S.beaten=JSON.parse(localStorage.getItem('cfBeaten')||'[]');
  }catch(e){ S.beaten=[]; }
  S.unlocked=unlockCount();
}
function saveProgress(){
  try{
    localStorage.setItem('cfBeaten',JSON.stringify(S.beaten));
  }catch(e){}
}
function newGame(seed){
  S.seed = (seed===undefined)? Math.floor(Math.random()*1e6) : seed;
  S.rng = mulberry32(S.seed);
  // shuffle cat -> spot assignment
  const idx=[...LV().roster.keys()];
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(S.rng()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  S.assign=idx;                       // assign[spotIndex] = catIndex
  S.found=SP().map(()=>false);
  S.sprites=[]; S.clicks=0; S.hintsUsed=0; S.complete=false; S.bannerT=0;
  S.lastCard=null; S.sparkle=null; S.petals=[]; S.puffs=[]; S.hintReadyAt=0; S.finaleShown=false;
  updateUI();
}
function setLevel(i, showIntro){
  if(i<0||i>=LEVELS.length||i>=S.unlocked) return false;
  S.level=i;
  newGame();
  const sub=$('subtitle'); if(sub) sub.textContent=LV().sub;
  if(showIntro!==false) levelIntro();
  return true;
}
function foundCount(){ return S.found.filter(Boolean).length; }
function catAtSpot(i){ return LV().roster[S.assign[i]]; }
function storyFor(cat){ return (LV().stories&&LV().stories[cat.name])||cat.story; }

// ---------- finding ----------
function clickAt(x,y){
  S.clicks++;
  // a found cat lounging at the picnic? say hi again
  for(const sp of S.sprites){
    if(sp.phase==='party' && Math.hypot(x-sp.x, y-sp.y)<30){
      showCatCard(sp.cat, true);
      sfx('meow');
      return {type:'party', cat:sp.cat};
    }
  }
  // an unfound hiding spot?
  const spots=SP();
  for(let i=0;i<spots.length;i++){
    if(S.found[i]) continue;
    const sp=spots[i];
    if(Math.hypot(x-sp.x, y-sp.y)<=sp.r){
      S.found[i]=true;
      const cat=catAtSpot(i);
      const seat=SEATS[i];
      S.sprites.push({cat, spotIdx:i, phase:'walk', x:sp.x, y:Math.min(sp.y+20,560),
        tx:GATHER().x+seat[0], ty:GATHER().y+seat[1], t0:nowMs(), dur:2600+S.rng()*800});
      burstSparkles(sp.x,sp.y);
      sfx('chime'); setTimeout(()=>sfx('meow'), IS_TEST?0:240);
      showCatCard(cat,false);
      if(foundCount()===spots.length){
        S.complete=true;
        if(!S.beaten.includes(LV().id)) S.beaten.push(LV().id);
        S.unlocked=unlockCount();
        saveProgress();
      }
      updateUI();
      return {type:'found', cat, spot:sp};
    }
  }
  // gentle miss: a puff of petals and a rustle
  S.puffs.push({x,y,t0:nowMs()});
  sfx('rustle');
  return {type:'miss'};
}
function hint(){
  const t=nowMs();
  if(t<S.hintReadyAt) return null;
  const spots=SP();
  const unfound=[...spots.keys()].filter(i=>!S.found[i]);
  if(!unfound.length) return null;
  const i=unfound[Math.floor(Math.random()*unfound.length)];
  S.sparkle={x:spots[i].x, y:spots[i].y, until:t+2600, spotIdx:i};
  S.hintsUsed++; S.hintReadyAt=t+9000;
  sfx('twinkle');
  updateUI();
  return spots[i];
}
function burstSparkles(x,y){
  if(IS_TEST) return;
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=0.4+Math.random()*1.4;
    S.petals.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,g:0.03,r:2+Math.random()*2.5,
      color:['#ffd97a','#fff3c4','#ffb3c0'][i%3], t0:nowMs(), life:900, spin:Math.random()*6});
  }
}
function petalRain(){
  if(IS_TEST) return;
  for(let i=0;i<90;i++){
    S.petals.push({x:Math.random()*VW, y:-20-Math.random()*200, vx:(Math.random()-.5)*0.6,
      vy:0.5+Math.random()*0.9, g:0.002, r:3+Math.random()*3,
      color:['#ffb3c0','#ffd0da','#fff0b8','#ffc89a'][i%4], t0:nowMs(), life:9000, spin:Math.random()*6});
  }
}

// ---------- cat drawing (parametric cuties) ----------
function catScale(c){ return c.kitten? 0.74 : 1; }
function blinkAmt(time, phase){
  const t=(time*0.001+phase)%4.6;            // blink every ~4.6s
  return t<0.18? Math.sin(t/0.18*Math.PI) : 0;
}
function drawCatFull(g, c, x, y, s, facing, time){
  s*=catScale(c);
  const sway=Math.sin(time*0.0016+(c.name.length))*0.12;
  g.save(); g.translate(x,y); g.scale(facing*s,s);
  // tail (curled beside body, swaying)
  g.strokeStyle=c.base; g.lineWidth=7; g.lineCap='round';
  g.beginPath(); g.moveTo(-14,8);
  g.quadraticCurveTo(-26,6,-27,-4+sway*22);
  g.stroke();
  if(c.pattern==='tabby'){ g.strokeStyle=c.dark; g.lineWidth=7; g.setLineDash([4,5]); g.beginPath(); g.moveTo(-14,8); g.quadraticCurveTo(-26,6,-27,-4+sway*22); g.stroke(); g.setLineDash([]); }
  // body (sitting bean)
  g.fillStyle=c.base;
  g.beginPath(); g.ellipse(0,4,15,14,0,0,Math.PI*2); g.fill();
  // chest
  g.fillStyle=(c.pattern==='tuxedo')?'#f5f2ea':(c.pattern==='bicolor'? c.dark : lighten(c.base));
  g.beginPath(); g.ellipse(3,8,8,9,0,0,Math.PI*2); g.fill();
  // patches
  if(c.pattern==='calico'){
    g.fillStyle=c.dark; g.beginPath(); g.ellipse(-7,-2,7,6,0.4,0,Math.PI*2); g.fill();
    g.fillStyle=c.dark2||'#4a4440'; g.beginPath(); g.ellipse(7,2,5.5,5,-0.4,0,Math.PI*2); g.fill();
  }
  if(c.pattern==='bicolor'){ g.fillStyle=c.base; g.beginPath(); g.ellipse(-6,-3,8,7,0.3,0,Math.PI*2); g.fill(); }
  if(c.pattern==='tabby'){
    g.strokeStyle=c.dark; g.lineWidth=2.4;
    for(const off of [-7,-1,5]){ g.beginPath(); g.arc(off,-2,9,Math.PI*1.25,Math.PI*1.75); g.stroke(); }
  }
  // paws
  g.fillStyle=(c.pattern==='tuxedo')?'#f5f2ea':c.base;
  g.beginPath(); g.ellipse(-4,17,4,2.6,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(6,17,4,2.6,0,0,Math.PI*2); g.fill();
  // head
  g.fillStyle=c.base;
  g.beginPath(); g.arc(2,-15,11.5,0,Math.PI*2); g.fill();
  // ears
  const tw=Math.sin(time*0.003+(c.name.length*2))>0.96? 0.25:0;
  ear(g,c,-6,-23,-0.25+tw); ear(g,c,10,-23,0.25);
  if(c.pattern==='tabby'){ g.strokeStyle=c.dark; g.lineWidth=2; g.beginPath(); g.arc(2,-20,7,Math.PI*1.2,Math.PI*1.8); g.stroke(); }
  // muzzle for tuxedo
  if(c.pattern==='tuxedo'){ g.fillStyle='#f5f2ea'; g.beginPath(); g.ellipse(4,-11,6,5,0,0,Math.PI*2); g.fill(); }
  // face
  const bl=blinkAmt(time, c.name.length*1.3);
  eye(g,c,-2.5,-16,bl); eye(g,c,8.5,-16,bl);
  g.fillStyle='#d98a8a';
  g.beginPath(); g.moveTo(3,-12.2); g.lineTo(5.4,-12.2); g.lineTo(4.2,-10.4); g.closePath(); g.fill();
  g.strokeStyle='#0002'; g.lineWidth=1;
  g.beginPath(); g.moveTo(4.2,-10.4); g.lineTo(4.2,-9); g.stroke();
  // whiskers
  g.strokeStyle='rgba(80,70,60,0.45)'; g.lineWidth=1;
  for(const [y1,y2] of [[-12,-11.4],[-10.5,-10.5],[-9,-9.6]]){
    g.beginPath(); g.moveTo(8,y1); g.lineTo(16,y2); g.stroke();
    g.beginPath(); g.moveTo(0,y1); g.lineTo(-8,y2); g.stroke();
  }
  // collar + bell
  g.strokeStyle=c.collar; g.lineWidth=3;
  g.beginPath(); g.arc(2,-15,11.5,Math.PI*0.32,Math.PI*0.68); g.stroke();
  g.fillStyle='#e8c84a'; g.beginPath(); g.arc(2,-3.2,2.2,0,Math.PI*2); g.fill();
  g.fillStyle='#a8882a'; g.beginPath(); g.arc(2,-2.6,0.8,0,Math.PI*2); g.fill();
  g.restore();
}
function lighten(hex){
  const p=h=>parseInt(h,16);
  const r=p(hex.slice(1,3)),gr=p(hex.slice(3,5)),b=p(hex.slice(5,7));
  return `rgb(${Math.min(255,r+26)},${Math.min(255,gr+26)},${Math.min(255,b+26)})`;
}
function ear(g,c,x,y,rot){
  g.save(); g.translate(x,y); g.rotate(rot);
  g.fillStyle=c.base;
  g.beginPath(); g.moveTo(-5,6); g.lineTo(0,-7); g.lineTo(5,6); g.closePath(); g.fill();
  g.fillStyle='#e8a8a8';
  g.beginPath(); g.moveTo(-2.4,4); g.lineTo(0,-3); g.lineTo(2.4,4); g.closePath(); g.fill();
  g.restore();
}
function eye(g,c,x,y,blink){
  if(blink>0.5){ g.strokeStyle='#3a342c'; g.lineWidth=1.6; g.beginPath(); g.arc(x,y+1,2.4,0.15*Math.PI,0.85*Math.PI); g.stroke(); return; }
  g.fillStyle=c.eye;
  g.beginPath(); g.ellipse(x,y,2.8,3.2*(1-blink),0,0,Math.PI*2); g.fill();
  g.fillStyle='#2a261f';
  g.beginPath(); g.ellipse(x,y,1.3,2.2*(1-blink),0,0,Math.PI*2); g.fill();
  g.fillStyle='#fff';
  g.beginPath(); g.arc(x+0.9,y-1.1,0.8,0,Math.PI*2); g.fill();
}
// --- partial "peek" drawings, in each cat's own colors ---
function drawPeek(g, spot, c, time){
  const x=spot.x, y=spot.y, s=spot.ps*catScale(c);
  g.save(); g.translate(x,y); g.scale(s,s);
  if(spot.peek==='ears'){
    const tw=Math.sin(time*0.0026+x)>0.95? 0.2:0;
    g.fillStyle=c.base;
    g.beginPath(); g.arc(0,7,11,Math.PI,0); g.fill();   // top of head
    ear(g,c,-7,-1,-0.28+tw); ear(g,c,7,-1,0.28);
    if(c.pattern==='tabby'){ g.strokeStyle=c.dark; g.lineWidth=2; g.beginPath(); g.arc(0,5,7,Math.PI*1.2,Math.PI*1.8); g.stroke(); }
  } else if(spot.peek==='tail'){
    const sway=Math.sin(time*0.0019+y)*7;
    g.strokeStyle=c.base; g.lineWidth=8; g.lineCap='round';
    g.beginPath(); g.moveTo(0,16); g.quadraticCurveTo(4,-2, sway, -16); g.stroke();
    if(c.pattern==='tabby'||c.pattern==='calico'){
      g.strokeStyle=c.dark; g.lineWidth=8; g.setLineDash([5,6]);
      g.beginPath(); g.moveTo(0,16); g.quadraticCurveTo(4,-2, sway, -16); g.stroke(); g.setLineDash([]);
    }
    g.fillStyle=lighten(c.base); g.beginPath(); g.arc(sway,-16,4.5,0,Math.PI*2); g.fill();
  } else if(spot.peek==='face'){
    g.fillStyle=c.base;
    g.beginPath(); g.arc(0,2,11,0,Math.PI*2); g.fill();
    ear(g,c,-7,-7,-0.28); ear(g,c,7,-7,0.28);
    const bl=blinkAmt(time, x*0.1);
    eye(g,c,-4,-0.5,bl); eye(g,c,4.5,-0.5,bl);
    g.fillStyle='#d98a8a';
    g.beginPath(); g.moveTo(-0.9,3.4); g.lineTo(1.5,3.4); g.lineTo(0.3,5); g.closePath(); g.fill();
  } else if(spot.peek==='back'){
    const br=1+Math.sin(time*0.0013+x)*0.03;  // gentle breathing
    g.scale(1,br);
    g.fillStyle=c.base;
    g.beginPath(); g.ellipse(0,4,16,11,0,Math.PI,0); g.fill();
    if(c.pattern==='tabby'){ g.strokeStyle=c.dark; g.lineWidth=2.4;
      for(const off of [-8,0,8]){ g.beginPath(); g.moveTo(off,-4); g.lineTo(off+2,3); g.stroke(); } }
    if(c.pattern==='calico'){ g.fillStyle=c.dark; g.beginPath(); g.ellipse(-6,0,5,4,0,Math.PI,0); g.fill(); }
    ear(g,c,9,-6,0.4);
  }
  g.restore();
}

// ---------- scene drawing ----------
let canvas=null, ctx=null;
function progress(){ return foundCount()/SP().length; }
function draw(time){
  if(!ctx) return;
  const p=progress();
  LV().paint(time,p);
  // found cats walking / partying
  for(const sp of S.sprites) drawSprite(sp,time);
  // finale banner
  if(S.complete){ S.bannerT=clamp(S.bannerT+0.012,0,1); banner(S.bannerT,time); }
  // sparkles (hint)
  if(S.sparkle){
    if(nowMs()>S.sparkle.until) S.sparkle=null;
    else sparkleStars(S.sparkle.x, S.sparkle.y, time);
  }
  // petals & puffs
  drawPetals();
  drawPuffs(time);
  // soft vignette
  const v=ctx.createRadialGradient(VW/2,VH/2,300,VW/2,VH/2,640);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(90,60,30,0.16)');
  ctx.fillStyle=v; ctx.fillRect(0,0,VW,VH);
}
function paintCottage(time,p){

  const sx=lerp(110,330,p), sy=lerp(92,300,p);
  const glow=ctx.createRadialGradient(sx,sy,5,sx,sy,90+p*60);
  glow.addColorStop(0, lerpColor('#fff6d0','#ffd9a8',p));
  glow.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,90+p*60,0,Math.PI*2); ctx.fill();

  cloud(330+((time*0.005)%1200)-90, 45, 0.55, time);

  ctx.fillStyle=lerpColor('#b5d99a','#cfba7f',p*0.6);
  ctx.beginPath(); ctx.moveTo(0,330); ctx.quadraticCurveTo(190,235,420,318); ctx.quadraticCurveTo(610,255,960,325); ctx.lineTo(960,360); ctx.lineTo(0,360); ctx.fill();
  // meadow

  mg.addColorStop(1, lerpColor('#7dbb59','#96ab53',p*0.5));
  ctx.fillStyle=mg; ctx.fillRect(0,330,VW,270);
  // winding path to the cottage door
  ctx.fillStyle='#e3cf9f';

  ctx.lineTo(842,418); ctx.quadraticCurveTo(760,500,740,600); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#d4ba84';
  for(let i=0;i<7;i++){ ctx.beginPath(); ctx.ellipse(742+i*9-(i*i),585-i*26,7-i*0.5,3.4,0.2,0,Math.PI*2); ctx.fill(); }
  // fence along the back
  fence(0,348,610);
  // pond
  pond(time,p);
  // picnic blanket + Nana Plum
  picnic(time,p);
  // big oak (cat may peek from notch)
  oak(time);
  if(!S.found[0]) drawPeek(ctx, SPOTS_COTTAGE[0], catAtSpot(0), time);
  oakFrontLeaves(time);
  // cottage (window cat behind glass shine)
  cottage(time,p);
  // mailbox + peeking face
  if(!S.found[7]) drawPeek(ctx, SPOTS_COTTAGE[7], catAtSpot(7), time);
  mailbox(time);
  // flower bed + curled back
  if(!S.found[5]) drawPeek(ctx, SPOTS_COTTAGE[5], catAtSpot(5), time);
  flowerbed(time);
  // reeds + tail
  if(!S.found[3]) drawPeek(ctx, SPOTS_COTTAGE[3], catAtSpot(3), time);
  reeds(432,468,time);
  // tall grass + ears
  if(!S.found[4]) drawPeek(ctx, SPOTS_COTTAGE[4], catAtSpot(4), time);
  tallGrass(520,448,time);
  // bush + ears
  if(!S.found[6]) drawPeek(ctx, SPOTS_COTTAGE[6], catAtSpot(6), time);
  bush(924,402,time);
  // watering can + kitten ears
  if(!S.found[8]) drawPeek(ctx, SPOTS_COTTAGE[8], catAtSpot(8), time);
  wateringCan(776,486);
  // chimney tail & window face draw above their structures
  if(!S.found[1]) drawPeek(ctx, SPOTS_COTTAGE[1], catAtSpot(1), time);
  // butterflies
  butterfly(time, 0); butterfly(time, 1); butterfly(time+9000, 2);
}
function cloud(x,y,s,time){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(const [cx,cy,r] of [[0,0,22],[24,-7,17],[46,2,20],[22,9,16]]){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

    ctx.beginPath(); ctx.moveTo(x,y-22); ctx.lineTo(x+3.5,y-28); ctx.lineTo(x+7,y-22); ctx.fill();

function nana(x,y,time,p,fit){
  fit=fit||{};
  const skirtCol=fit.skirt||'#9a86b8', topCol=fit.top||'#c8a2b8';
  ctx.save(); ctx.translate(x,y);
  const rock=Math.sin(time*0.0014)*0.03;
  ctx.rotate(rock);
  // skirt
  ctx.fillStyle=skirtCol;
  ctx.beginPath(); ctx.ellipse(0,22,26,18,0,Math.PI,0); ctx.fill();
  // torso & cardigan
  ctx.fillStyle=topCol;
  ctx.beginPath(); ctx.ellipse(0,-2,15,17,0,0,Math.PI*2); ctx.fill();
  // arms holding needles
  ctx.strokeStyle=topCol; ctx.lineWidth=8; ctx.lineCap='round';
  const knit=Math.sin(time*0.006)*2;
  ctx.beginPath(); ctx.moveTo(-11,2); ctx.lineTo(-16,14+knit); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,2); ctx.lineTo(17,14-knit); ctx.stroke();
  // knitting needles + yarn
  ctx.strokeStyle='#8a6a4a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-16,14+knit); ctx.lineTo(2,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(17,14-knit); ctx.lineTo(0,7); ctx.stroke();
  ctx.fillStyle='#e86a6a'; ctx.beginPath(); ctx.arc(1,16,5,0,Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle='#f3d9c4';
  ctx.beginPath(); ctx.arc(0,-26,11,0,Math.PI*2); ctx.fill();
  // silver bun
  ctx.fillStyle='#dcdce2';
  ctx.beginPath(); ctx.arc(0,-33,8,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-38,4.5,0,Math.PI*2); ctx.fill();
  // optional headwear
  if(fit.hat==='sun'){
    ctx.fillStyle='#f0dfae';
    ctx.beginPath(); ctx.ellipse(0,-33,19,5.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-35,10,Math.PI,0); ctx.fill();
    ctx.strokeStyle='#e88a9a'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.ellipse(0,-34,10,3,0,0,Math.PI); ctx.stroke();
  } else if(fit.hat==='beanie'){
    ctx.fillStyle=fit.hatCol||'#d9534f';
    ctx.beginPath(); ctx.arc(0,-31,11.5,Math.PI,0); ctx.fill();
    ctx.fillRect(-11.5,-32,23,4);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-42,4,0,Math.PI*2); ctx.fill();
  } else if(fit.hat==='cap'){
    ctx.fillStyle=fit.hatCol||'#6a9ad0';
    ctx.beginPath(); ctx.arc(0,-32,10.5,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8,-32,9,3,0,0,Math.PI*2); ctx.fill();
  }
  // glasses + smile + cheeks
  ctx.strokeStyle='#8a7a6a'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(-4,-26,3.2,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(4,-26,3.2,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1,-26); ctx.lineTo(1,-26); ctx.stroke();
  ctx.strokeStyle='#b07a6a'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-22,3.5,0.2*Math.PI,0.8*Math.PI); ctx.stroke();
  ctx.fillStyle='rgba(230,140,140,0.4)';
  ctx.beginPath(); ctx.arc(-7,-22,2.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-22,2.4,0,Math.PI*2); ctx.fill();
  // hearts when the party is on
  if(S.complete){
    const hb=(time*0.001)%1.6;
    ctx.globalAlpha=clamp(1-hb/1.6,0,1);
    heart(2,-48-hb*22,4.5,'#e87a9a');
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function heart(x,y,s,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x,y+s);
  ctx.bezierCurveTo(x-s*1.4,y-s*0.4,x-s*0.6,y-s*1.4,x,y-s*0.4);
  ctx.bezierCurveTo(x+s*0.6,y-s*1.4,x+s*1.4,y-s*0.4,x,y+s);
  ctx.fill();
}

  ctx.fillStyle='#e8b87a'; ctx.beginPath(); ctx.ellipse(96,22,16,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8a4a9a'; ctx.beginPath(); ctx.ellipse(96,20,11,4.5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  nana(88,538,time,p,{top:'#c8a2b8', skirt:'#7aa86a'});
  butterfly(time,0); butterfly(time+5000,1);
}
function drawSprite(sp,time){
  if(sp.phase==='walk'){
    const t=clamp((nowMs()-sp.t0)/sp.dur,0,1);
    const e=t<0.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    sp.x=lerp(sp.x0??(sp.x0=sp.x), sp.tx, e);
    sp.y=lerp(sp.y0??(sp.y0=sp.y), sp.ty, e) - Math.abs(Math.sin(t*Math.PI*6))*5;
    if(t>=1){ sp.phase='party'; sp.x=sp.tx; sp.y=sp.ty; }
    drawCatFull(ctx, sp.cat, sp.x, sp.y, 1, sp.tx>sp.x?1:-1, time);
  } else {
    const facing = sp.x>GATHER().x-60? -1:1;   // gaze toward Nana
    drawCatFull(ctx, sp.cat, sp.x, sp.y, 1, facing, time);
    if(S.complete && Math.sin(time*0.001+sp.x)>0.93) heart(sp.x, sp.y-38, 3.4, '#e87a9a');
  }
}
function banner(t,time){
  const y=lerp(-60,118,t);
  ctx.strokeStyle='#8a6a4a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(150,y-28); ctx.quadraticCurveTo(480,y+22,790,y-38); ctx.stroke();
  // bunting
  for(let i=0;i<13;i++){
    const bt=i/12, bx=lerp(150,790,bt), by=lerp(y-28,y-38,bt)+Math.sin(bt*Math.PI)*48+6;
    ctx.fillStyle=['#e86a6a','#f0c84a','#7aa86a','#9a86b8','#e8a0c0'][i%5];
    ctx.beginPath(); ctx.moveTo(bx-9,by-7); ctx.lineTo(bx+9,by-7); ctx.lineTo(bx,by+11); ctx.closePath(); ctx.fill();
  }
  // sign
  const sx=470, sy=y+44+Math.sin(time*0.0014)*2.5;
  ctx.fillStyle='#fff8e8';
  ctx.strokeStyle='#d9b87a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect? ctx.roundRect(sx-170,sy-24,340,48,12):ctx.rect(sx-170,sy-24,340,48);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#b06a3a'; ctx.font='bold 21px Georgia'; ctx.textAlign='center';
  ctx.fillText(LV().bannerText, sx, sy+7);
}
function sparkleStars(x,y,time){
  for(let i=0;i<5;i++){
    const a=time*0.003+i*1.26, r=18+Math.sin(time*0.005+i)*7;
    const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r*0.7;
    star(px,py,3.2+Math.sin(time*0.01+i)*1.2,'#ffe9a0');
  }
}
function star(x,y,s,col){
  ctx.fillStyle=col;
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath();
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4, r=k%2?s*0.4:s;
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawPetals(){
  const t=nowMs();
  S.petals=S.petals.filter(p=>t-p.t0<p.life && p.y<VH+20);
  for(const p of S.petals){
    p.x+=p.vx+Math.sin((t-p.t0)*0.003+p.spin)*0.4; p.y+=p.vy; p.vy+=p.g;
    ctx.globalAlpha=clamp(1-(t-p.t0)/p.life,0,1);
    ctx.fillStyle=p.color;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin+(t-p.t0)*0.002);
    ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.55,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawPuffs(time){
  const t=nowMs();
  S.puffs=S.puffs.filter(p=>t-p.t0<500);
  for(const p of S.puffs){
    const a=(t-p.t0)/500;
    ctx.globalAlpha=(1-a)*0.6;
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,4+a*18,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ---------- audio: a tiny music box ----------
let actx=null, musicTimer=null, chirpTimer=null, step=0;
function ensureAudio(){
  if(IS_TEST) return;
  if(!actx && typeof AudioContext!=='undefined'){ try{ actx=new AudioContext(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
  if(actx && !musicTimer) startMusic();
}
function note(midi){ return 440*Math.pow(2,(midi-69)/12); }
const PENTA=[60,62,64,67,69,72,74,76];
let melodyPos=3;
function startMusic(){
  if(musicTimer) return;
  musicTimer=setInterval(()=>{
    if(!actx || !S.musicOn) { step++; return; }
    const t=actx.currentTime;
    // gentle wandering melody
    if(step%2===0 && Math.random()<0.8){
      melodyPos=clamp(melodyPos+(Math.random()<0.5?-1:1)*(Math.random()<0.25?2:1),0,PENTA.length-1);
      tone(note(PENTA[melodyPos]), 0.034, 1.1, 'triangle', t);
      if(Math.random()<0.25) tone(note(PENTA[melodyPos])*2, 0.012, 0.9, 'sine', t);
    }
    // soft bass heartbeat
    if(step%8===0){
      const roots=[48,43,45,41];
      tone(note(roots[(step/8|0)%4]), 0.05, 2.2, 'sine', t);
    }
    step++;
  }, 280);
  chirpTimer=setInterval(()=>{
    if(!actx || !S.sfxOn || Math.random()<0.4) return;
    const t=actx.currentTime;
    for(let i=0;i<2+Math.floor(Math.random()*2);i++) chirpOnce(t+i*0.14);
  }, 6000);
}
function tone(freq,vol,dur,type,t0){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function chirpOnce(t0){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(2600,t0);
  o.frequency.exponentialRampToValueAtTime(3900,t0+0.07);
  o.frequency.exponentialRampToValueAtTime(2900,t0+0.12);
  g.gain.setValueAtTime(0.018,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.16);
}
function sfx(kind){
  if(IS_TEST || !S.sfxOn) return;
  ensureAudio(); if(!actx) return;
  const t=actx.currentTime;
  if(kind==='meow'){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(940,t+0.13);
    o.frequency.exponentialRampToValueAtTime(430,t+0.36);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.45);
  } else if(kind==='purr'){
    const o=actx.createOscillator(), g=actx.createGain(), l=actx.createOscillator(), lg=actx.createGain();
    o.type='triangle'; o.frequency.value=52;
    l.type='sine'; l.frequency.value=21; lg.gain.value=0.022;
    l.connect(lg); lg.connect(g.gain);
    g.gain.value=0.028;
    o.connect(g); g.connect(actx.destination);
    o.start(t); l.start(t); o.stop(t+1.5); l.stop(t+1.5);
    g.gain.setValueAtTime(0.028,t+1.1); g.gain.linearRampToValueAtTime(0.0001,t+1.5);
  } else if(kind==='chime'){
    [76,79,84].forEach((m,i)=>tone(note(m),0.06,0.9,'triangle',t+i*0.09));
  } else if(kind==='twinkle'){
    [88,91,96].forEach((m,i)=>tone(note(m),0.03,0.5,'sine',t+i*0.07));
  } else if(kind==='rustle'){
    const len=actx.sampleRate*0.12, buf=actx.createBuffer(1,len,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=actx.createBufferSource(); src.buffer=buf;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=0.8;
    const g=actx.createGain(); g.gain.value=0.05;
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t);
  } else if(kind==='fanfare'){
    [72,76,79,81,79,84].forEach((m,i)=>tone(note(m),0.07,0.7,'triangle',t+i*0.13));
    sfx('purr');
  }
}

// ---------- UI ----------
function $(id){ return (typeof document!=='undefined')? document.getElementById(id):null; }
function updateUI(){
  if(typeof document==='undefined') return;
  const lvlBox=$('levels');
  if(lvlBox && typeof document.createElement==='function'){
    lvlBox.innerHTML='';
    LEVELS.forEach((L,i)=>{
      const d=document.createElement('div');
      const locked=i>=S.unlocked;
      d.className='lvl'+(i===S.level?' active':'')+(locked?' locked':'')+(S.beaten.includes(L.id)?' done':'');
      d.textContent=L.emoji;
      d.title=locked? '??? — finish another adventure to unlock this one' : L.name;
      if(!locked) d.onclick=()=>{ ensureAudio(); if(i!==S.level) setLevel(i); };
      lvlBox.appendChild(d);
    });
  }
  const pawBox=$('paws');
  if(pawBox && typeof document.createElement==='function'){
    pawBox.innerHTML='';
    SP().forEach((sp,i)=>{
      const d=document.createElement('div');
      d.className='paw'+(S.found[i]?' found':'');
      d.textContent='🐾';
      if(S.found[i]){
        const c=catAtSpot(i);
        d.title=c.name;
        d.style.background=c.base;
        d.onclick=()=>{ showCatCard(c,true); sfx('meow'); };
      } else d.title='???';
      pawBox.appendChild(d);
    });
  }
  const pt=$('progressTxt');
  if(pt) pt.textContent = S.complete? '🎉 everyone is here!' : `${foundCount()} / ${SP().length} friends found`;
  const hb=$('hintBtn');
  if(hb){
    const left=Math.ceil((S.hintReadyAt-nowMs())/1000);
    hb.disabled = left>0 || S.complete;
    hb.textContent = left>0? `✨ ${left}s` : '✨ Hint';
  }
}
function showCatCard(cat, revisit){
  const o=$('overlay'); if(!o){ S.lastCard=cat.name; return; }
  const all=foundCount()===SP().length;
  $('card').innerHTML=`
    <div id="portraitWrap"><canvas id="portrait" width="150" height="150"></canvas></div>
    <h2>${cat.name}</h2>
    <div class="title">${cat.title}</div>
    <p>${storyFor(cat)}</p>
    <div class="fact"><b>A true cat fact:</b> ${cat.fact}</div>
    <button onclick="CF.closeCard()">${all && !revisit? 'To the party! 🎉' : revisit? 'Back to the search 🐾' : 'Keep looking 🐾'}</button>`;
  o.classList.add('show');
  S.lastCard=cat.name;
  const pc=$('portrait');
  if(pc && pc.getContext){
    const g=pc.getContext('2d');
    g.clearRect(0,0,150,150);
    drawCatFull(g, cat, 75, 92, 2.4, 1, 1234);
  }
  sfx('purr');
}
function closeCard(){
  const o=$('overlay'); if(o) o.classList.remove('show');
  if(S.complete && !S.finaleShown){
    S.finaleShown=true;
    petalRain();
    sfx('fanfare');
    setTimeout(showFinale, IS_TEST?0:2400);
  }
  updateUI();
}
function showFinale(){
  if(!S.complete) return;
  const o=$('overlay'); if(!o) return;
  const L=LV();
  const allDone=LEVELS.every(l=>S.beaten.includes(l.id));
  const ni=LEVELS.findIndex((l,i)=>i!==S.level && i<S.unlocked && !S.beaten.includes(l.id));
  const nextBtn = ni<0? '' : `<button onclick="CF.next(${ni})">Next adventure — ${LEVELS[ni].emoji} ${LEVELS[ni].name} ➜</button>`;
  const crown = allDone? `<p style="text-align:center;">👑 <b>You've finished every adventure!</b> The whole atlas of friends has been found — all the locals, all the stories, all the naps. The cats are very proud of you. (They're planning more trips. They won't say where.)</p>` : '';
  $('card').innerHTML=`
    <h2>${L.finale.title}</h2>
    <div class="title">${L.finale.sub}</div>
    <p>${L.finale.text}</p>
    <p style="text-align:center; font-style:italic; color:#9a7a5a;">You found every friend in ${S.clicks} click${S.clicks===1?'':'s'}${S.hintsUsed? ` with ${S.hintsUsed} sparkle${S.hintsUsed===1?'':'s'} of help`:''}. 🐾</p>
    ${crown}
    ${nextBtn}
    <button onclick="CF.stay()">Stay a while 🌅</button>
    <button onclick="CF.again()">Play again — new hiding spots 🔄</button>`;
  o.classList.add('show');
}
function levelIntro(){
  const o=$('overlay'); if(!o) return;
  const L=LV();
  $('card').innerHTML=`
    <h2>${L.emoji} ${L.name}</h2>
    <div class="title">adventure ${S.level+1} of ${LEVELS.length}</div>
    <p>${L.intro}</p>
    <button onclick="CF.closeCard()">Start looking 🐱</button>`;
  o.classList.add('show');
}
const CF={
  closeCard,
  stay(){ const o=$('overlay'); if(o) o.classList.remove('show'); },
  again(){ const o=$('overlay'); if(o) o.classList.remove('show'); newGame(); },
  next(i){ const o=$('overlay'); if(o) o.classList.remove('show'); setLevel(i===undefined? S.level+1 : i); },
  intro(){
    const o=$('overlay'); if(!o) return;
    $('card').innerHTML=`
      <h2>🐾 Cat Finder</h2>
      <div class="title">a very gentle hidden-cat game</div>
      <ul class="rules">
        <li><b>Nine cats</b> are hiding in every scene — watch for a flick of a tail, the tips of two ears, a pair of eyes in a window.</li>
        <li><b>Click a cat</b> to meet them: every cat has a name, a story, and a true cat fact to share.</li>
        <li>Found cats trot over to the gathering spot. They always seem to be... waiting for something?</li>
        <li>There are ${LEVELS.length} adventures, from the cottage meadow to the far north — the first three are open right away, and every adventure you finish unlocks another. New places mean new local cats to meet.</li>
        <li>Stuck? The <b>✨ Hint</b> button gives a little sparkle of whisker-sense.</li>
        <li>No timer. No score. Just sunshine. ☀️</li>
      </ul>
      <button onclick="CF.closeCard()">Start looking 🐱</button>`;
    o.classList.add('show');
  },
};

// ---------- input & boot ----------
function canvasPoint(ev){
  const r=canvas.getBoundingClientRect();
  return [ (ev.clientX-r.left)/r.width*VW, (ev.clientY-r.top)/r.height*VH ];
}
function boot(){
  canvas=$('scene');
  if(!canvas) return;
  const dpr=(typeof window!=='undefined'&&window.devicePixelRatio)||1;
  canvas.width=VW*dpr; canvas.height=VH*dpr;
  canvas.style.width=VW+'px';
  ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  canvas.addEventListener('click', ev=>{
    ensureAudio();
    const overlayOpen=$('overlay').classList.contains('show');
    if(overlayOpen) return;
    const [x,y]=canvasPoint(ev);
    clickAt(x,y);
  });
  $('newBtn').addEventListener('click', ()=>{ $('overlay').classList.remove('show'); newGame(); });
  $('hintBtn').addEventListener('click', ()=>{ ensureAudio(); hint(); });
  $('aboutBtn').addEventListener('click', ()=>CF.intro());
  $('musicBtn').addEventListener('click', ()=>{ ensureAudio(); S.musicOn=!S.musicOn; $('musicBtn').textContent=S.musicOn?'🎵':'🚫'; });
  $('sfxBtn').addEventListener('click', ()=>{ ensureAudio(); S.sfxOn=!S.sfxOn; $('sfxBtn').textContent=S.sfxOn?'🔊':'🔇'; });
  document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') CF.stay(); });
  setInterval(updateUI, 600);     // keeps the hint cooldown label fresh
  loadProgress();
  setLevel(0,false);
  CF.intro();
  (function loop(t){ draw(t||0); requestAnimationFrame(loop); })(0);
}

// expose for tests + onclick
const API={S, newGame, clickAt, hint, foundCount, CATS, GUESTS, LEVELS, SPOTS:SPOTS_COTTAGE, SP, setLevel, loadProgress,
  catAtSpot, storyFor, drawCatFull, closeCard, showCatCard, BLANKET, GATHER,
  _setCtx(c){ ctx=c; }, draw};
if(typeof globalThis!=='undefined'){ globalThis.CFG=API; globalThis.CF=CF; }
if(typeof document!=='undefined' && !IS_TEST){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
</script>
